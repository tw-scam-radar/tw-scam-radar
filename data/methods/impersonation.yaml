- id: guess-who
  name: 猜猜我是誰：假親友換號碼借錢
  aliases:
  - 假冒親友借錢
  - 假冒親友詐騙
  - 我換電話了
  category: 冒名恐嚇
  summary: 對方假裝是你的兒女、親戚或多年不見的朋友，說換了手機或 LINE，要你加新帳號，過幾天再以急用、周轉或車禍要賠錢為由借錢。
  status: active
  first_seen: '2021'
  channels:
  - 電話
  - LINE
  pretend_to_be:
  - 兒女
  - 親戚
  - 多年不見的朋友
  stages:
  - stage: 接觸
    what_you_see: 接到聲音很像家人的電話，要你猜他是誰，或直接說「我換電話了」。
  - stage: 取信
    what_you_see: 對方要你改加新的手機號碼或 LINE，之後都用新帳號聯絡。
  - stage: 製造情境
    what_you_see: 幾天後說臨時急用、生意周轉不過來，或出了交通事故要賠對方錢。
  - stage: 要求行動
    what_you_see: 要你匯款到他給的帳戶，或說會請「朋友」到你家拿現金。
  - stage: 收網後
    what_you_see: 得手後，可能用同一套說法再來借第二次。
  opener_examples:
  - 媽，我換手機了，加我新的 LINE，舊的先不要用。
  - 猜猜我是誰？是我啦，好久沒聯絡了。
  - 我生意周轉不過來，先借我一點，過幾天就還你。
  red_flags:
  - id: new-number
    text: 說換了手機號碼或 LINE，要你加新的
    cues:
    - 換電話
    - 換手機
    - 換號碼
    - 新的LINE
    - 加我新
    weight: 2
  - id: guess-identity
    text: 一開口就要你猜他是誰
    cues:
    - 猜猜我是誰
    - 猜我是誰
    weight: 2
  - id: urgent-loan
    text: 急著借錢周轉
    cues:
    - 借我
    - 周轉
    - 週轉
    - 急用
    - 先借
    weight: 2
  - id: accident-compensation
    text: 說出了車禍要馬上賠錢
    cues:
    - 車禍
    - 交通事故
    - 賠償
    - 賠對方
    weight: 2
  - id: friend-picks-up-cash
    text: 說要請朋友到你家拿現金
    cues:
    - 朋友過去拿
    - 朋友去拿
    - 去拿現金
    - 派人去拿
    weight: 3
  - id: account-name-mismatch
    text: 要你匯款的帳戶，戶名不是親友本人
    cues:
    - 朋友的帳戶
    - 戶名
    - 匯到這個帳戶
    weight: 2
  final_ask:
  - 匯款到對方指定的帳戶。
  - 把現金交給對方派來的「朋友」。
  verify:
  - 用你原本存的舊電話打給本人確認，不要只憑聲音、LINE 大頭照、貼圖或對話判斷。
  - 跟家人事先約好只有彼此知道的通關密語。
  - 撥 165 反詐騙專線或 110 詢問。
  safe_lookalikes:
  - LINE 帳號也可能被盜用：就算是熟人原本的帳號傳來借錢或要你買點數，也要另外打電話確認是本人。
  if_already_happened:
  - 撥 165 或 110 報案。
  prevalence:
    note: 110 年 1–6 月（2021 年）50 歲以上被害人以「猜猜我是誰」占 27.70% 最多（資料較舊，尚未查到更新的分項統計）。
    source_url: https://www.npa.gov.tw/ch/app/data/doc?module=wg057&detailNo=864291785080311808&type=s
  sources:
  - title: 常見詐騙手法話術解析與因應之道－第五章　猜猜我是誰
    publisher: 刑事警察局
    date: '2026-10-22'
    url: https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=4f04dab6-3ca5-4139-a94e-66be03b62ba3
    level: L1
    supports:
    - summary
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - verify
  - title: 常見問答：近來新興常見之詐騙手法（Line訊息詐騙）
    publisher: 臺北市政府警察局刑事警察大隊
    date: '2026-10-01'
    url: https://cid.police.gov.taipei/News_Content.aspx?n=FDEFB49FC705A752&s=918735B357458108
    level: L1
