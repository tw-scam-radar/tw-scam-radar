- id: fake-gov-subsidy
  name: 假冒政府發錢：普發現金、退稅
  aliases:
  - 普發現金詐騙
  - 普發一萬詐騙
  - 退稅詐騙
  category: 冒名恐嚇
  summary: 對方用普發現金、退稅等政府發錢的名義，傳簡訊或郵件叫你點連結填個資；或打電話說你的普發現金被冒領，再轉接假檢警，要你交出財產。
  status: active
  first_seen: '2023'
  channels:
  - 簡訊
  - 電子郵件
  - 電話
  - LINE
  pretend_to_be:
  - 財政部
  - 國稅局
  - 郵局人員
  - 警察
  - 檢察官
  stages:
  - stage: 接觸
    what_you_see: 收到「每人普發 1 萬元」之類的簡訊、郵件，附上連結；或接到自稱郵局人員的電話。
  - stage: 取信
    what_you_see: 連結打開是仿冒的登記網頁，要你填個人資料；或電話說有人冒用你的身分證登記普發現金。
  - stage: 製造情境
    what_you_see: 電話轉接給假警察、假偵查佐，要你加 LINE，傳來假傳票、搜索票，說你的帳戶涉及洗錢、家裡的現金會被當成非法款項。
  - stage: 要求行動
    what_you_see: 要你把家中現金、金飾交給假檢察官「財產監管」，或交出提款卡等金融帳戶。
  opener_examples:
  - 每人普發一萬元，點連結登記才能領取。
  - 我是郵局人員，有人冒用你的身分證登記普發現金。
  - 您有一筆退稅待領取，請點連結辦理。
  red_flags:
  - id: gov-money-sms-link
    text: 用簡訊、郵件或通訊軟體通知你領錢、退稅，還附連結
    cues:
    - re:(普發|退稅|補助).{0,40}(https?://|網址|連結)
    - re:(https?://|連結).{0,40}(普發|退稅|補助)
    - 登記領取
    weight: 2
  - id: fake-gov-domain
    text: 網址看起來像政府網站，但不是以「.gov.tw」結尾，或 gov 前面不是一個點（例如 gov.tw 出現在網址後段）
    cues:
    - re:gov[-_]tw
    - re:gov\.tw\.[a-z]{2,}
    - re:gov\.(?!tw(?![a-z0-9]))[a-z]+
    weight: 3
  - id: registration-stolen
    text: 說你的身分被冒用登記、普發現金被冒領
    cues:
    - 冒領
    - 冒用你的身分
    - 身分遭盜用
    - 冒用登記
    weight: 3
  - id: register-or-lose
    text: 催你趕快登記，不然領不到
    cues:
    - 未登記
    - 尚未登記
    - 盡快登記
    - re:逾期.{0,8}(作廢|取消|失效|無法領取|視同放棄)
    weight: 2
  - id: atm-to-receive
    text: 要你到 ATM 或網路銀行操作才能領錢
    cues:
    - re:(ATM|網銀|網路銀行).{0,10}(領|入帳|操作)
    - 操作轉帳
    - ATM操作
    weight: 3
  - id: cash-called-illegal
    text: 說家裡的現金會被當成非法款項，要幫你申報或監管
    cues:
    - 非法款項
    - 替你申報
    - 財產監管
    weight: 3
  final_ask:
  - 在仿冒的登記網頁填寫個人資料。
  - 交出提款卡或其他金融帳戶資料。
  - 把家中現金、金飾交給假檢察官「財產監管」。
  verify:
  - 2025 年普發現金的官方網站是 10000.gov.tw；政府網站網址結尾一定是「.gov.tw」，gov 前面一定是「.」。
  - 有疑問撥 165 反詐騙專線，或到財政部官網查詢。
  - 沒收到錢，向銀行、財政部等正式管道查詢，不要相信打來說你被冒領的人。
  safe_lookalikes:
  - 政府不會用簡訊或電子郵件通知你登記領錢，也不會打電話要你到 ATM 或網銀操作。
  - 2025 年普發現金不登記也能到郵局臨櫃領；各銀行入帳時間不同，沒收到錢不代表被冒領。
  - 國稅局不會透過簡訊或通訊軟體要你點連結繳稅或退稅。
  if_already_happened:
  - 撥 165 查證或 110 報案。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 普發現金上路 刑事局：詐騙集團已冒用籲注意
    publisher: 中央社
    date: '2025-11-15'
    url: https://www.cna.com.tw/news/asoc/202511150126.aspx
