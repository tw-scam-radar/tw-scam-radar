    url: https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=b7cf505d-f709-4885-b06b-d29b092ce04f
    level: L1
    supports:
    - stages
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
  - title: 教你識破「假檢警、真詐財」！
    publisher: 臺灣臺北地方檢察署
    date: '2025-04-28'
    url: https://www.tpc.moj.gov.tw/292885/976681/661783/1281204/post
    level: L1
