- id: fake-boss
  name: 假老闆、假主管：拉 LINE 群組叫你匯款
  aliases:
  - BEC 詐騙
  - 變臉詐騙
  - 假冒高層
  - 假冒主管
  category: 冒名恐嚇
  summary: 對方冒用老闆或主管的名字寄信、要你建 LINE 群組，或盜用主管的 LINE 帳號，以付款急迫為由，叫負責匯款的員工把公司的錢匯到指定帳戶。
  status: active
  first_seen: ''
  channels:
  - 電子郵件
  - LINE
  - LINE 群組
  pretend_to_be:
  - 老闆
  - 主管
  - 公司高層
  - 國外廠商
  stages:
  - stage: 接觸
    what_you_see: 收到顯示名稱是老闆、理事長或主管的電子郵件，要你馬上建立 LINE 群組並回傳 QR Code，還叮囑不要讓其他人加入。
  - stage: 取信
    what_you_see: 真的老闆被踢出群組，或真主管的帳號被封鎖；群組裡只剩假老闆、假廠商和你。
  - stage: 製造情境
    what_you_see: 假廠商說老闆已同意付款，或假老闆要你先截圖公司台幣、美金帳戶的餘額。
  - stage: 要求行動
    what_you_see: 要你到銀行臨櫃或用網銀，把款項匯到指定帳戶，常是國外帳戶。
  opener_examples:
  - 我是董事長，請馬上建一個 LINE 群組，回傳 QR Code 給我。
  - 這個群組先不要讓其他人加入，有急事要處理。
  - 老闆已經同意付款，請今天到銀行把貨款匯出。
  - 把公司台幣和美金帳戶的餘額截圖給我。
  red_flags:
  - id: build-line-group
    text: 主管用電子郵件要你自己建 LINE 群組、回傳 QR Code
    cues:
    - 建立LINE群組
    - 建一個LINE群組
    - re:建.{0,3}群組
    - 回傳QR
    - 群組QR
    weight: 3
  - id: keep-group-secret
    text: 叮囑不要讓其他人加入群組
    cues:
    - 不要讓其他人加入
    - 不要讓別人加入
    - 先不要告訴
    weight: 2
  - id: balance-screenshot
    text: 要你截圖公司帳戶餘額
    cues:
    - 餘額截圖
    - 帳戶金額
    - 截圖給我
    weight: 3
  - id: urgent-company-transfer
    text: 以付款急迫、代匯公款為由催你匯款
    cues:
    - 代匯
    - 公款
    - 盡快匯款
    - 今天匯出
    weight: 2
  - id: overseas-account
    text: 要你匯到從沒往來過的國外帳戶
    cues:
    - 國外帳戶
    - 海外帳戶
    - 指定帳戶
    weight: 2
  final_ask:
  - 把公司帳戶的錢匯到對方指定的帳戶（常是國外帳戶）。
  - 截圖公司帳戶餘額回傳給對方。
  verify:
  - 用公司電話、視訊或當面直接問老闆本人；詐團就是賭你不敢打給高層確認。
  - 大額或不尋常的付款，不要只憑通訊軟體訊息就匯款，照公司原本的覆核流程走。
  - 不點陌生的 LINE 加入連結，不加入來路不明的公司群組。
  safe_lookalikes:
  - LINE 帳號可能被盜用，訊息看起來就是主管本人的帳號；「帳號是真的」不代表傳訊的人是本人。
  if_already_happened:
  - 錢剛匯出或還在辦理，馬上請銀行協助並報警，有機會攔下來。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 會計誤信假老闆LINE指示匯貨款險失1400萬 警銀聯手「這招」救回公司鉅款
    publisher: 警政署公共關係室（警光雜誌社）
    date: '2026-03-26'
    url: https://police.npa.gov.tw/ch/app/data/view?module=wg081&id=1835&serno=b692242f-5173-46f5-a596-82767731d3cf
    level: L1
    supports:
    - stages
