- id: fake-telecom-call
  name: 假冒電信或公家機關的語音電話：「按 9 轉專人」
  aliases:
  - 語音電話詐騙
  - 假電信催繳
  - 停話通知詐騙
  category: 冒名恐嚇
  summary: 市話或手機接到錄音語音，說電話費欠繳要停話、健保卡異常要停卡、證件被拿去辦門號等，要你按 9 轉專人，接著由假客服把你轉給假警察、假檢察官。
  status: active
  first_seen: '2019'
  channels:
  - 電話
  pretend_to_be:
  - 中華電信
  - 電信業者
  - 健保署
  - 公家機關客服
  stages:
  - stage: 接觸
    what_you_see: 接到錄音語音，說電話費逾期未繳將停話，或你的證件、健保卡有異常。
  - stage: 取信
    what_you_see: 語音要你按 9 轉專人，接著出現自稱客服的人，說你的身分被冒用申辦門號或補助。
  - stage: 製造情境
    what_you_see: 客服主動說要幫你轉接警察機關做筆錄，接下來就變成假檢警的劇本。
  - stage: 要求行動
    what_you_see: 最後要你提供個資、銀行帳戶，或配合「監管帳戶」。
  opener_examples:
  - 您的市話費逾期未繳，即將停話，有疑問請按9。
  - 您的證件被用來申辦門號，將暫停服務，轉專人請按9。
  - 您的健保卡使用異常，請按9由專人為您說明。
  red_flags:
  - id: press-key-to-agent
    text: 錄音語音要你按 9 或按鍵轉專人
    cues:
    - 請按9
    - 按9
    - 由專人服務
    - 由專人為您
    - 轉接專人
    weight: 3
  - id: suspension-threat
    text: 說你的電話要停話、證件或卡片要停用
    cues:
    - 停話
    - 停用
    - 停卡
    - 暫停服務
    weight: 2
  - id: id-used-for-number
    text: 說有人用你的證件申辦門號
    cues:
    - 申辦門號
    - 冒辦門號
    - 門號申請
    - 身分遭冒用
    weight: 2
  - id: agent-transfers-police
    text: 客服說要幫你轉接警察或 165
    cues:
    - 轉接警察
    - 轉接165
    - 幫你轉接
    - 轉接警局
    weight: 3
  final_ask:
  - 照語音按鍵後，在電話中提供個資或銀行帳戶。
  - 被轉接給假檢警後，配合「監管帳戶」。
  verify:
  - 直接掛斷，自己撥電信公司官方客服（中華電信 123）或 165 查證。
  - 自己查該機關官網上的電話回撥，不要讓對方轉接。
  safe_lookalikes:
  - 中華電信的語音催繳只會播一段錄音，告訴你號碼和欠費月份，不會要你跟著語音操作。
  - 健保署不會用電話語音通知違規或停卡，也不會要你按鍵轉接服務人員。
  if_already_happened:
  - 只按了 9 不會增加話費；但不要再照指示提供帳戶或個資，有疑慮撥 165。
  prevalence:
    note: 2019 年 7 月第 1 週，冒充中華電信語音催繳的詐騙電話在 165 全民防騙網排行第 2（資料較舊，尚未查到近年數字）。
    source_url: https://news.ltn.com.tw/news/Nantou/breakingnews/2852269
  sources:
  - title: 詐騙電話按9中計怎辦？ 中華電信教你這樣做...
    publisher: 自由時報
    date: '2019-07-14'
    url: https://news.ltn.com.tw/news/Nantou/breakingnews/2852269
    level: L2
    supports:
