- id: fake-prosecutor
  name: 假檢警：說你涉案、要「監管帳戶」
  aliases:
  - 假冒機構
  - 假冒公務員
  - 假警察
  - 假檢察官
  - 監管帳戶
  category: 冒名恐嚇
  summary: 對方假冒警察或檢察官，說你的帳戶或證件涉及洗錢等刑案，用「偵查不公開」要你保密，最後要你交出提款卡、存摺或現金給他「監管」。
  status: active
  first_seen: '2011'
  channels:
  - 電話
  - LINE
  pretend_to_be:
  - 警察
  - 檢察官
  - 法院人員
  stages:
  - stage: 接觸
    what_you_see: 接到自稱戶政事務所、健保署、電信業者或郵局人員的電話，說你的身分被冒用，或你的帳戶涉及詐欺案。
  - stage: 取信
    what_you_see: 電話被「轉接」給自稱警察或檢察官的人，對方說你涉及洗錢或其他刑案。
  - stage: 製造情境
    what_you_see: 對方要你加 LINE 做「視訊筆錄」，傳來警察制服照、傳票、扣押條、「監管證明」等圖片，並說「偵查不公開」，不准告訴家人或銀行。
  - stage: 要求行動
    what_you_see: 要你把存款領出或集中、交出提款卡和密碼，或把現金、金飾整理好交給「專人監管」，有時還要你繳「公證金」。
  - stage: 收網後
    what_you_see: 對方要你加 LINE 定時回報、不准掛電話，甚至威脅不配合就拘提或收押。
  opener_examples:
  - 這裡是郵局，你的帳戶涉及一件詐欺大案，幫你轉接警察。
  - 我是警察，你涉嫌洗錢，請加 LINE 做視訊筆錄。
  - 本案偵查不公開，不能跟家人或銀行說。
  red_flags:
  - id: supervised-account
    text: 說要「監管帳戶」或幫你「財產監管」
    cues:
    - 監管帳戶
    - 帳戶監管
    - 財產監管
    - 監管證明
    weight: 3
  - id: investigation-secret
    text: 用「偵查不公開」要你不准告訴任何人
    cues:
    - 偵查不公開
    - 不得向他人透露
    - 不能告訴家人
    weight: 3
  - id: statement-by-line
    text: 要你用 LINE 或視訊做筆錄、定時回報
    cues:
    - 視訊筆錄
    - 定時回報
    - re:(LINE|視訊|線上).{0,8}筆錄
    weight: 3
  - id: notarization-fee
    text: 要你繳交「公證金」
    cues:
    - 公證金
    - 繳交公證
    weight: 3
  - id: call-transfer
    text: 說可以幫你「轉接」警察、地檢署、法院或 165
    cues:
    - 轉接警察
    - 轉接165
    - 轉接地檢署
    - 幫你轉接
    weight: 3
  - id: no-hangup-arrest-threat
    text: 不准你掛電話，威脅要拘提或收押
    cues:
    - 不准掛電話
    - 不要掛電話
    - 拘提
    - 收押
    weight: 3
  - id: hand-over-card
    text: 要你交出提款卡、存摺或印鑑
    cues:
    - re:(寄|交|給|提供|放|郵寄|快遞|面交|交付|出借|出租|借|租).{0,8}(金融卡|提款卡|存摺|存簿|簿子)
    - re:(金融卡|提款卡|存摺|存簿).{0,10}(寄|交給|給我|密碼|一起|放在|寄到)
    - 印鑑
    weight: 2
  - id: court-docs-by-line
    text: 用 LINE 或超商傳真傳來傳票、拘票、扣押條等「公文」
    cues:
    - 傳票
    - 拘票
    - 扣押條
    - 搜索票
    weight: 2
  final_ask:
  - 交出提款卡、存摺，或告訴對方密碼。
  - 把存款領出或集中到指定帳戶，交給對方「監管」。
  - 提領現金或整理金飾，交給上門來拿的人。
  - 繳交「公證金」。
  verify:
  - 先掛掉電話，再自己撥 165 或 110 查證；對方說要「幫你轉接」，一律不要接受。
  - 問清楚對方的單位、職稱、姓名後掛斷，自己查該機關的官方電話回撥。
  - 記住：警察不會用電話、LINE 或視訊做筆錄；檢警真的要你說明，會寄書面通知書或傳票請你到機關。
  safe_lookalikes:
  - 真正的司法案件會寄通知書或傳票，請你到機關說明，不會要你交提款卡、密碼，也不會派人跟你面交現金。
  - 收到看起來像地檢署或法院的通知，可以自己到機關官網查電話回撥確認。
  if_already_happened:
  - 撥 24 小時的 165 反詐騙專線，或到最近的派出所、分局報案。
  - 發現家人疑似被騙，陪他一起打 165 或通報警方。
  prevalence:
    note: 114 年上半年（2025 年 1–6 月）假檢警詐騙 2,713 件，財損約 53.1 億元，平均每案近 200 萬元；最常被冒用的機構是戶政事務所（23%），交付方式以交出金融卡最多（57%）。
    source_url: https://www.ctee.com.tw/news/20251007700882-431204
  sources:
  - title: 常見詐騙手法話術解析與因應之道－第六章　假冒機構（公務員）
    publisher: 刑事警察局
