- id: fake-nhi-hospital
  name: 假冒健保署或醫院：說健保卡被盜用領藥
  aliases:
  - 健保卡被盜用
  - 健保卡停卡詐騙
  - 假藥劑師
  - 假冒醫療院所
  category: 冒名恐嚇
  summary: 對方自稱健保署人員或醫院藥劑師，說你的健保卡、身分證被人拿去代領藥或申請補助，再把電話轉給假警察、假檢察官，最後要你交錢「自清資金」。
  status: active
  first_seen: '2011'
  channels:
  - 電話
  pretend_to_be:
  - 健保署人員
  - 醫院藥劑師
  - 醫療院所人員
  - 警察
  - 檢察官
  - 金管會專員
  stages:
  - stage: 接觸
    what_you_see: 接到語音電話說健保卡使用違規異常、即將停卡，要你按 9 轉專人；或接到自稱某知名醫院藥劑師的來電。
  - stage: 取信
    what_you_see: 對方說得出你的個資，說有人拿你的健保卡、身分證和委託書代領藥物，或拿你的證件申請醫療補助。
  - stage: 製造情境
    what_you_see: 接著又有電話說你的證件被拿去申辦門號、身障補助、印鑑證明或戶籍遷移，可能涉及洗錢，主動說要幫你轉接警察或地檢署。
  - stage: 要求行動
    what_you_see: 假警察、假檢察官要你「自清資金」，並用「偵查不公開」要你別告訴家人、銀行。
  opener_examples:
  - 您的健保卡使用異常，即將停卡，詳情請按9。
  - 這裡是醫院藥局，有人拿你的健保卡和委託書來代領藥。
  - 你的證件可能被拿去洗錢，我幫你轉接警察處理。
  red_flags:
  - id: nhi-card-misuse-call
    text: 打電話說你的健保卡被盜用、違規使用或要停卡
    cues:
    - 健保卡被盜用
    - 健保卡異常
    - 違規使用
    - 停卡
    - 鎖卡
    weight: 2
  - id: press-9-transfer
    text: 語音要你按 9 或按鍵轉接專人
    cues:
    - 請按9
    - 按9
    - 由專人為您
    - 轉接專人
    weight: 3
  - id: proxy-medicine
    text: 說有人拿你的證件或委託書代領藥物
    cues:
    - 代領藥
    - 代領藥物
    - 委託書
    weight: 2
  - id: medical-transfers-police
    text: 醫院或健保單位主動說要幫你轉接警察、檢察官或金管會
    cues:
    - 轉接警察
    - 轉接地檢署
    - 金管會專員
    - 幫你轉接
    weight: 3
  - id: clear-funds
    text: 要你「自清資金」證明清白
    cues:
    - 自清資金
    - 自清
    weight: 3
  final_ask:
  - 匯款、面交現金，或交出提款卡與帳戶資料「自清資金」。
  - 把錢領出交給所謂的「監管單位」，或交出存摺、提款卡及密碼。
  - 在電話中提供個人資料。
  verify:
  - 掛斷後撥健保卡背面的免付費專線 0800-030-598 或 4128-678 查證（手機撥 02-4128-678）。
  - 自己查醫院的官方電話回撥，不要回撥對方給的號碼。
  - 撥 165 反詐騙專線詢問。
  safe_lookalikes:
  - 健保署不會用電話語音、簡訊或 LINE 要你匯款、回電或點連結；健保欠費也不會讓你被鎖卡、不能看病。
  - 健保署不會要你按鍵轉接服務人員。
  if_already_happened:
  - 撥 165 反詐騙專線，或撥 110 報案。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 當心假冒身份證件詐騙再現 打詐指揮中心：請民眾提高警覺 避免受害損失
    publisher: 行政院打擊詐欺指揮中心
