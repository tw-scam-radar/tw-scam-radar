- id: fake-agency-id-misuse
  name: 假冒戶政、郵局：說你的證件或帳戶被冒用
  aliases:
  - 證件遭冒用
  - 身分遭冒用
  - 假郵局人員
  - 假戶政人員
  category: 冒名恐嚇
  summary: 對方自稱戶政事務所、郵局等單位的人員，說你的身分證、委託書被人冒用去辦事，或你的帳戶涉及詐欺案，再主動把電話轉給假警察、假檢察官。
  status: active
  first_seen: ''
  channels:
  - 電話
  - LINE
  pretend_to_be:
  - 戶政事務所人員
  - 郵局人員
  - 電信業者
  stages:
  - stage: 接觸
    what_you_see: 接到自稱戶政事務所或郵局人員的電話，說有人拿你的證件或委託書申請印鑑證明、戶籍遷移，或你的帳戶涉及詐欺大案。
  - stage: 製造情境
    what_you_see: 對方說這可能涉及洗錢，主動要幫你轉接警察或 165。
  - stage: 要求行動
    what_you_see: 接下來就是假檢警：要你加 LINE 做視訊筆錄、配合監管帳戶、交出提款卡或現金。
  opener_examples:
  - 這裡是戶政事務所，有人拿你的委託書來申請印鑑證明。
  - 我是郵局人員，你的帳戶涉及詐欺案，幫你轉接警察。
  - 有人冒用你的證件辦戶籍遷移，要幫你轉接報案嗎？
  red_flags:
  - id: id-misused
    text: 說你的身分證、委託書被人冒用
    cues:
    - 證件遭冒用
    - 身分遭冒用
    - 證件被盜用
    - 冒用你的身分
    - 委託書
    weight: 2
  - id: agency-transfers-police
    text: 公家單位或郵局主動說要幫你轉接警察、165
    cues:
    - 轉接警察
    - 轉接165
    - 幫你轉接
    - 轉接警局
    weight: 3
  - id: account-in-case
    text: 說你的帳戶涉及詐欺、洗錢案
    cues:
    - 涉及洗錢
    - 涉嫌洗錢
    - 詐欺大案
    - 帳戶涉案
    weight: 2
  final_ask:
  - 被轉接後，照假檢警的指示交出提款卡、現金，或配合「監管帳戶」。
  verify:
  - 掛掉電話，自己查戶政事務所或郵局的官方電話回撥。
  - 撥 165 或 110 查證，不要讓對方幫你轉接。
  safe_lookalikes:
  - 檢警處理司法案件會用通知書請你到案說明，不會在電話裡製作筆錄，也不會由其他機關替你轉接。
  if_already_happened:
  - 撥 165 或 110，或到最近的派出所報案。
  prevalence:
    note: 114 年上半年（2025 年 1–6 月）假檢警詐騙中，最常被冒用的機構是戶政事務所，占 23%。
    source_url: https://www.ctee.com.tw/news/20251007700882-431204
  sources:
