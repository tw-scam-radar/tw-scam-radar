- id: fake-kidnap
  name: 假綁架、假車禍：電話裡有哭聲，要你馬上付錢
  aliases:
  - 假綁架
  - 假車禍和解
  - AI 語音深偽詐騙
  category: 冒名恐嚇
  summary: 對方說你的家人欠債被押走、被打傷，或出車禍撞到人要和解，電話裡傳來哭喊或求救聲，不准你掛電話、不准報警，要你立刻匯款或領現金。
  status: active
  first_seen: '2019'
  channels:
  - 電話
  pretend_to_be:
  - 綁匪
  - 地下錢莊債主
  - 車禍對方
  - 家人（AI 仿聲）
  stages:
  - stage: 接觸
    what_you_see: 突然接到電話，聽到像是家人的哭喊、求救或哀號聲。
  - stage: 製造情境
    what_you_see: 對方說家人欠地下錢莊錢被押走、被打傷，或開車撞傷人、涉案要交保，要先付錢才放人或和解。
  - stage: 要求行動
    what_you_see: 威脅你不准掛電話、不准報警，要你立刻到銀行臨櫃提款、ATM 匯款，或把現金交給來拿錢的人。
  - stage: 收網後
    what_you_see: 詐團派車手到約定地點收錢。
  opener_examples:
  - 你兒子欠錢被我們押走了，先拿二十萬來。
  - 媽，我開車撞傷人了，對方要我馬上賠錢。
  - 敢掛電話或報警，你就見不到他。
  red_flags:
  - id: crying-for-help
    text: 電話裡有哭喊、求救聲，接著要你馬上付錢
    cues:
    - 救我
    - 求救
    - 哭喊
    weight: 2
  - id: no-hangup-no-police
    text: 威脅不准掛電話、不准報警
    cues:
    - 敢掛電話
    - 不准掛
    - 不准報警
    - 不要報警
    weight: 3
  - id: debt-hostage
    text: 說家人欠債被押走，要付錢才放人
    cues:
    - 被押走
    - 地下錢莊
    - 贖金
    - 欠債
    weight: 3
  - id: accident-settlement
    text: 說家人撞到人、撞傷孕婦，要馬上和解賠錢
    cues:
    - 撞到人
    - 撞傷
    - 孕婦
    - 和解
    - 賠償
    weight: 2
  - id: bail-money
    text: 說家人涉刑案，要你先付交保金
    cues:
    - 交保金
    - 交保
    weight: 2
  final_ask:
  - 立刻到銀行臨櫃提款、用 ATM 匯款，或把現金交給來拿錢的人。
  verify:
  - 先掛斷，用原本存的號碼打給家人本人，或打給他的學校、公司確認人在哪裡。
  - 跟家人在見面時約好只有家人知道的通關密語或問答。
  - 對方不讓你掛電話時，可以走到派出所，或請旁邊的人幫你報警。
  - 撥 110 報案，或撥 165 反詐騙專線諮詢。
  safe_lookalikes:
  - 週五晚上到週日家人回訊息比較慢，一時聯絡不上不代表出事；先用其他管道找人。
  if_already_happened:
  - 立刻撥 110 報案或 165 反詐騙專線。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 小兒子欠債被綁架？父急找大兒子籌錢救人，真相曝光……
    publisher: 警政署公共關係室（警光雜誌社）
    date: '2023-07-04'
    url: https://police.npa.gov.tw/ch/app/data/view?module=wg081&id=1835&serno=3573508c-d2d4-4e77-822c-8aefe9920204
    level: L1
    supports:
    - stages
    - opener_examples
    - red_flags
    - verify
    - if_already_happened
  - title: 婦人遇假綁架詐騙領79萬 警方「無聲交談」逮車手
