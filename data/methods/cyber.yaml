- id: fake-utility-bill
  name: 假電費、水費、電信費、ETC 通行費欠費簡訊
  aliases:
  - 假台電簡訊
  - 電費逾期簡訊
  - 假台水簡訊
  - ETC 欠費簡訊
  - 通行費簡訊
  - 停車費簡訊
  - 電信點數到期簡訊
  category: 帳號資安
  summary: 假冒台電、台水、電信業者或遠通電收，說你欠費要停電停水、小額通行費、停車費要罰款，或點數今天到期，叫你點連結刷卡或下載 App。
  status: active
  first_seen: '2022'
  channels:
  - 簡訊
  - 電子郵件
  pretend_to_be:
  - 台電
  - 台水
  - 中華電信
  - 遠通電收（ETC）
  - eTag
  stages:
  - stage: 接觸
    what_you_see: 收到開頭寫【台灣電力公司】、【遠通電收】或電信公司名稱的簡訊或郵件，常從境外號碼發出。
  - stage: 製造情境
    what_you_see: 說電費、水費逾期將終止供電供水；或說有一筆幾十元的通行費、停車費未繳，逾期要罰款、加收滯納金；或說會員積分今天到期作廢。
  - stage: 要求行動
    what_you_see: 點連結到假繳費頁，被要求輸入車號、身分證字號、信用卡號、有效期限與安全碼，或被叫去下載 App 繳費。
  - stage: 收網後
    what_you_see: 信用卡被盜刷，有人一次損失數十萬元。
  opener_examples:
  - 【某電力公司】貴戶本期電費已逾期，請限期繳費以免停止供電。
  - 提醒您有一筆小額停車費未繳清，逾期將處以罰款。
  - 您的會員積分將於今日到期，逾期作廢，請盡快兌換。
  red_flags:
  - id: utility-cutoff-threat
    text: 威脅逾期就終止供電、供水
    cues:
    - 終止供電
    - 停止供電
    - 終止供水
    - 將終止
    weight: 2
  - id: small-fee-late-penalty
    text: 幾十元的小額通行費、停車費，說逾期要罰款或加收滯納金
    cues:
    - 滯納金
    - 臨時停車費
    - 逾期將處
    - 罰緩
    - 今日午夜
    weight: 2
  - id: no-plate-number
    text: 通行費通知沒寫車號，改寫「案件編號」「公告字號」之類
    cues:
    - 案件編號
    - 公告字號
    - 郵件代碼
    weight: 1
  - id: parking-fee-pending-login
    text: 說停車費、通行費「扣款未成功」「待處理」，叫你登入或點連結處理
    cues:
    - re:(停車費|通行費).{0,15}(扣款未成功|扣款失敗|未完成扣款|待處理|待繳)
    - re:(停車|通行)服務狀態
    weight: 2
  - id: points-expiring-today
    text: 說會員點數、積分今天到期，叫你點連結兌換
    cues:
    - 積分
    - 今日內到期
    - 逾期將作廢
    - 兌換獎品
    - 點數即將到期
    weight: 2
  - id: bill-message-with-link
    text: 帳單或欠費通知附了連結，或叫你下載 App 繳費
    cues:
    - re:(電費|水費|通行費|停車費|電信費).{0,40}(http|www\.|\[連結\])
    - 下載App線上繳費
    - 詳情繳費
    weight: 3
  - id: foreign-sender-number
    text: 發送號碼是「+」開頭的境外號碼
    cues:
    - '+63'
    - '+66'
    weight: 2
  final_ask:
  - 點連結輸入信用卡號、有效期限、安全碼，以及身分證字號或車號。
  - 依簡訊指示下載 App 繳費。
  verify:
  - 打台電 24 小時客服 1911 查證。
  - 通行費先用遠通電收的 ETC App 查，或打它官網上公布的客服電話。
  - 自己上網搜尋官方網站，用官網上的繳費入口和客服電話查證，不要用簡訊裡的連結和電話。
  - 撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - 台電電費未繳提醒從 2024 年 1 月起由「111」政府專屬短碼發送，只列電號與住址讓你核對，不附任何連結。
  - 正牌 ETC 欠費通知一定寫車號，不附繳費連結，也不會要你線上刷卡。
  - 遠通電收表示不會用電子郵件催繳停車費；收到用遠通名義寄的停車費催繳信，都是詐騙。
  if_already_happened:
  - 誤點連結就立刻關掉網頁，不再點任何東西。
  - 已輸入卡號，立刻聯絡發卡銀行確認交易，並停卡、換卡。
  - 撥 110 或 165，到派出所報案。
  prevalence:
    note: 刑事局 2026 年 9 月指出，假冒電信及交通收費通知（中華電信、遠通電收、ETC、eTag）是近期六類釣魚話術中最多的一類。
    source_url: https://udn.com/news/story/124490/9755214
  sources:
  - title: 開車族注意了！ 假冒遠通催繳停車費Mail皆是詐騙 輸任何車號都顯示欠120元
    publisher: 鉅亨網（優分析轉載）
    date: '2026-10-14'
