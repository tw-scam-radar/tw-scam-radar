- id: fake-sticker
  name: 假免費 LINE 貼圖、假官方帳號送好禮
  aliases:
  - 免費貼圖詐騙
  - 分享送貼圖
  - 假官方帳號送禮
  - 免費送小物
  category: 帳號資安
  summary: 用「免費貼圖」「免費送好禮」吸引你點連結、轉傳給好友、加假官方帳號，最後騙個資，或騙你付運費、做網銀「認證」。
  status: active
  first_seen: '2018'
  channels:
  - LINE
  - LINE 群組
  - 臉書
  - 其他
  pretend_to_be:
  - LINE 官方
  - 知名品牌官方帳號
  - 活動主辦單位
  - 同為支持者的網友
  stages:
  - stage: 接觸
    what_you_see: 群組裡有人貼「免費貼圖下載」連結；或社群貼文留言區有陌生帳號說要分享小物、叫你「加我LINE」。
  - stage: 要求行動
    what_you_see: 要你轉傳給更多好友或群組、加入「活動客服」帳號，再填姓名、電話、地址、電子郵件，或下載不明 App。
  - stage: 收網後
    what_you_see: 照做了也拿不到貼圖；加 LINE 後被要求先付物流費、做實名認證、金流綁定，甚至操作網銀、ATM 或交出簡訊驗證碼。
  opener_examples:
  - 免費貼圖限時下載，轉傳給好友就能領取。
  - 想要應援小物嗎？加我 LINE 截圖私訊就送你。
  red_flags:
  - id: share-to-unlock
    text: 要轉傳給更多好友或群組才能領
    cues:
    - 分享給
    - 轉傳
    - 才能領取
    - 才能享有
    weight: 2
  - id: free-sticker-link
    text: 主打「免費貼圖」下載、免費抽貼圖
    cues:
    - 免費貼圖
    - 貼圖下載
    - 免費抽
    weight: 1
  - id: free-sticker-outside-link
    text: 免費貼圖訊息附的是外部網址，不是 LINE 貼圖小舖
    cues:
    - re:免費貼圖.{0,20}(http|www\.|\[連結\])
    - re:貼圖下載.{0,10}(http|www\.|\[連結\])
    weight: 2
  - id: add-line-for-gift
    text: 送東西卻要你加 LINE 或私訊
    cues:
    - 加我LINE
    - 截圖私訊
    - 加入好友
    weight: 2
  - id: free-gift-then-fee
    text: 說是免費，卻要先付物流費、做實名認證或金流綁定
    cues:
    - 物流費
    - 實名制認證
    - 金流綁定
    - 帳戶驗證失敗
    weight: 3
  final_ask:
  - 填姓名、電話、地址、電子郵件，或下載不明 App。
  - 先付物流費，或依指示操作網銀、ATM，交出無卡提款 QR Code、付款碼或簡訊驗證碼。
  verify:
  - 到 LINE 貼圖小舖的「活動貼圖」區，確認有沒有這組免費貼圖。
  - 掛著知名品牌名字，卻是灰色盾牌（一般帳號）的，就不是 LINE 認證過的帳號，先別相信。
  - 有疑慮撥 165 反詐騙諮詢專線，或查 165 打詐儀錶板。
  safe_lookalikes:
  - LINE 貼圖小舖的活動貼圖區確實有正牌免費貼圖，在那裡查得到的才是真的。
  if_already_happened:
  - 誤加了不明帳號但沒輸入手機號碼等資料，先檢舉再封鎖。
  - 已付款或交出資料，撥 165 反詐騙專線或 110 報案。
  prevalence:
    note: 刑事局 2026-10-06 提醒選舉應援小物「免費送」要你加 LINE 的手法；警方表示當時尚未接獲實際受騙報案。
    source_url: https://news.ltn.com.tw/news/society/breakingnews/5597041
  sources:
  - title: LINE 詐騙帳號送貼圖，官方 4 招教你辨真假
    publisher: 中央社（科技新報轉載）
    date: '2018-06-26'
    url: https://technews.tw/2018/06/26/line-account-fraud/
    level: L2
    supports:
