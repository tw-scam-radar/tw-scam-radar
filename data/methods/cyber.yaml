- id: fake-security-alert
  name: 假安全警告：假警方封鎖彈窗、假 Apple 帳號停用、假客服
  aliases:
  - 假中毒彈窗
  - 假刑事局警告網頁
  - Apple Pay 停用通知
  - 假蘋果客服
  - 假技術支援
  category: 帳號資安
  summary: 網頁突然跳出「裝置已被封鎖」警告，或冒充 Apple 寄信、打電話說帳號或付款被停用，要你刷卡繳「罰款」、點連結驗證或交出驗證碼。
  status: active
  first_seen: '2023'
  channels:
  - 網站彈窗
  - 電子郵件
  - 簡訊
  - 電話
  pretend_to_be:
  - 刑事局
  - 執法機關
  - Apple
  stages:
  - stage: 接觸
    what_you_see: 逛色情、免費影音或來路不明的網站時跳出警告畫面；或收到 Apple 名義的郵件、簡訊、電話。
  - stage: 製造情境
    what_you_see: 警告寫「系統偵測涉及兒少性剝削」，說裝置已被封鎖、將永久鎖定並追訴；或說 Apple Pay 付款資格被暫停、iCloud 遭入侵，要 24 小時內處理。
  - stage: 要求行動
    what_you_see: 要你限時線上刷卡繳罰款「解除封鎖」；或點連結驗證、說出密碼與雙重認證代碼，甚至要你關閉雙重認證。
  - stage: 收網後
    what_you_see: 信用卡被盜刷；Apple 帳號被盜，綁定的其他裝置也可能被入侵。
  opener_examples:
  - 系統偵測您的裝置涉及違法內容，已被封鎖，請繳罰款解除。
  - 您的付款資格已暫時停用，請於 24 小時內點連結完成認證。
  red_flags:
  - id: popup-pay-fine-unlock
    text: 網頁跳窗說裝置被封鎖，要你刷卡繳罰款解除
    cues:
    - 解除封鎖
    - 已被封鎖
    - 兒少性剝削
    - 永久鎖定
    - 繳交罰款
    weight: 3
  - id: account-suspended-deadline
    text: 說帳號或付款資格被暫停，要限時驗證
    cues:
    - 暫時停用
    - 永久停用
    - 24小時內
    - 完成認證
    weight: 2
  - id: asks-2fa-or-disable-security
    text: 要你提供雙重認證代碼，或關閉雙重認證、遭竊裝置防護
    cues:
    - 雙重認證
    - 遭竊裝置防護
    - 關閉雙重認證
    weight: 3
  - id: simplified-chinese-text
    text: 信件夾雜簡體字
    cues:
    - re:[这们认]
    - re:[邮账览]
    weight: 1
  final_ask:
  - 輸入信用卡卡號、有效期限與安全碼繳「罰款」。
  - 點連結登入，說出密碼或雙重認證代碼。
  verify:
  - 直接關掉瀏覽器分頁、清除瀏覽紀錄，必要時重新開機；不點頁面上的任何東西。
  - 看寄件人的電子郵件地址，結尾是不是 apple.com。
  - 接到自稱 Apple 的電話就掛斷，自己查正確號碼再回撥。
  - 截圖後到 165 全民防騙網或 165 打詐儀錶板通報。
  safe_lookalikes:
  - 真正的執法機關不會用網頁跳窗要你線上繳罰款，也不會要你輸入信用卡號、簡訊驗證碼或安全碼。
  - Apple 表示官方不會要求用戶登入任何網站、提供密碼或雙重認證代碼，也不會要求停用安全防護。
  if_already_happened:
  - 已輸入信用卡資料，立刻聯絡發卡銀行停卡、換卡或限制交易。
  - 已匯款或有疑慮，撥 165 反詐騙專線或 110 報案。
  prevalence:
    note: 刑事局 2026 年 5 月提醒假冒刑事局的「兒少性剝削」封鎖網頁；查無件數統計。Google、微軟名義的假警告目前查無台灣官方或主要媒體來源。
    source_url: https://udn.com/news/story/124490/9535397
