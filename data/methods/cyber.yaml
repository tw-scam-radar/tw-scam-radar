- id: fake-parcel
  name: 假郵局、假物流：包裹無法投遞、補繳運費關稅
  aliases:
  - 包裹無法投遞簡訊
  - 假郵局關稅通知
  - 補繳運費簡訊
  - 假宅配簡訊
  - 假黑貓
  category: 帳號資安
  summary: 假冒中華郵政或物流業者，說包裹地址有誤、無法配送或要補繳關稅運費，叫你點連結填資料、刷卡付小錢。
  status: active
  first_seen: '2021'
  channels:
  - 簡訊
  - 電子郵件
  pretend_to_be:
  - 中華郵政
  - 黑貓宅急便
  - 新竹物流
  - 宅配通
  - 賣貨便
  stages:
  - stage: 接觸
    what_you_see: 收到印著郵局 Logo 的電子郵件或簡訊，說有包裹等著投遞。
  - stage: 製造情境
    what_you_see: 說無法定位地址、配送失敗，或國際包裹有未繳的關稅、運費、重新遞送費。
  - stage: 要求行動
    what_you_see: 點連結「驗證地址資訊」或線上繳費，被要求輸入信用卡卡號、效期與驗證碼。
  - stage: 收網後
    what_you_see: 信用卡被盜刷，或卡片被綁進別人的行動支付。
  opener_examples:
  - 郵局通知：您的包裹地址無法定位，請點連結驗證地址資訊。
  - 您的國際包裹有關稅未繳，請點連結線上補繳後再投遞。
  red_flags:
  - id: parcel-pay-or-readdress
    text: 包裹通知要你補繳關稅、運費，或因無法投遞要你處理
    cues:
    - 補繳
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 無法投遞
    - 無法配送
    - 重新遞送
    weight: 2
  - id: parcel-verify-address
    text: 要你點按鈕「驗證地址資訊」或前往「帳戶門戶」
    cues:
    - 無法定位地址
    - 驗證地址
    - 帳戶門戶
    - 為完成配送
    weight: 3
  - id: simplified-chinese-text
    text: 文字夾雜簡體字或中國用語
    cues:
    - re:[这们认]
    - re:[邮账览运费单]
    weight: 1
  final_ask:
  - 點連結到假頁面填地址，輸入信用卡卡號、效期、驗證碼，付小額運費或關稅。
  verify:
  - 打中華郵政客服 0800-700-365（手機撥 04-2354-2030）查證。
  - 拿到掛號招領通知單，核對上面印的招領郵局名稱與市話，自己打過去確認。
  - 撥 165 反詐騙專線，或上 165 打詐儀錶板查證。
  safe_lookalikes:
  - 郵局真的無法配送時，會打電話給收件人另約時間，不會用電子郵件通知。
  - 真的掛號招領通知單上會印：收件人姓名地址、寄件人、一段式條碼、招領郵局名稱和市話、6 碼員工編號。郵差（郵務士）不會留手機號碼，通知單也不會裝進信封寄來。
  - 中華郵政不會寄電子郵件，要你上網轉帳來辦寄件或存款、匯款的事。
  if_already_happened:
  - 已輸入卡號，立刻聯絡發卡機構停卡、換卡。
  - 撥 165 反詐騙專線或到 165 打詐儀錶板報案。
  prevalence:
    note: 刑事局 2026 年 9 月把「假冒物流服務（賣貨便、新竹物流、黑貓宅急便、宅配通）」列為六類常見釣魚話術之一；2025 年 8 月也有搭關稅議題、稱包裹未付關稅的新一波假郵局通知。
    source_url: https://udn.com/news/story/124490/9755214
  sources:
  - title: 常見手法及因應之道（防制詐騙專區）
    publisher: 中華郵政
    date: ''
    url: https://www.post.gov.tw/post/internet/Anti-Fraud/common_practices.jsp
    level: L1
    supports:
    - stages
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
    - if_already_happened
  - title: 新型詐騙假冒中華郵政寄email 稱無法配送需點連結驗證
    publisher: 公視新聞網
    date: '2025-01-19'
    url: https://news.pts.org.tw/article/734398
    level: L2
    supports:
    - stages
    - opener_examples
    - red_flags
    - verify
