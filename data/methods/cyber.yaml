- id: account-takeover
  name: LINE、IG 帳號被盜：假投票、假登入頁、騙驗證碼
  aliases:
  - LINE 被盜
  - 盜帳號
  - 幫忙投票詐騙
  - LINE 輔助認證
  - IG 被盜
  - 冒名借錢
  category: 帳號資安
  summary: 用投票、抽獎、好康連結騙你輸入社群帳號、密碼和簡訊驗證碼，盜走帳號後冒用你的身分向親友借錢或繼續散布連結。
  status: active
  first_seen: ''
  channels:
  - LINE
  - IG
  pretend_to_be:
  - 親友
  - 投票或抽獎活動
  - LINE 官方（假輔助認證）
  stages:
  - stage: 接觸
    what_you_see: 收到「幫親友小孩比賽投票」或抽獎活動的連結，有時是熟人帳號傳來的。
  - stage: 要求行動
    what_you_see: 點開後是做得很像的登入頁，要你輸入 LINE 綁定的手機號碼、密碼和簡訊驗證碼；也有頁面寫「LINE 輔助認證」。
  - stage: 收網後
    what_you_see: 帳號突然被登出、重裝也登不回去；盜用者用你的帳號向好友群發借錢訊息、打電話催促，或再傳連結盜更多帳號。
  opener_examples:
  - 可以幫我小孩的比賽投一票嗎？點連結登入就能投。
  - 歡迎使用 LINE 輔助認證，請輸入手機號碼與認證碼。
  red_flags:
  - id: vote-link-asks-login
    text: 投票、抽獎的連結卻要你登入帳號
    cues:
    - 投票
    - 投一票
    - 比賽投票
    - 抽獎
    weight: 2
  - id: asks-for-your-code
    text: 有人要你把簡訊驗證碼或認證碼傳給他
    cues:
    - 驗證碼傳給我
    - 認證碼給我
    - re:(驗證碼|認證碼).{0,10}(傳|給|告訴)我
    weight: 3
  - id: fake-line-assist-auth
    text: 出現「LINE 輔助認證」（LINE 官方沒有這種機制）
    cues:
    - 輔助認證
    - line輔助認證
    - LINE輔助認證
    weight: 3
  - id: friend-suddenly-borrows
    text: 熟人帳號突然傳訊借錢
    cues:
    - 借我
    - 急用
    - 先借
    - 周轉
    weight: 2
  final_ask:
  - 在假登入頁輸入 LINE 綁定的手機號碼、密碼與簡訊驗證碼。
  verify:
  - 熟人傳連結或開口借錢，另外打電話給本人確認，不要在同一個聊天室問。
  - 撥 165 反詐騙專線或 110 諮詢。
  safe_lookalikes:
  - 你自己登入或換手機時收到的驗證碼簡訊是正常的；問題在於有人要你交出來，或叫你填進他給的網頁。
  - 郵局等企業的 LINE 官方帳號不會透過 LINE 幫你做驗證或帳戶設定。
  if_already_happened:
  - 向 LINE 客服申訴，把帳號要回來。如果你的 LINE 事先綁了 Apple 或 Google 帳號，比較有機會找回原帳號。
  - 馬上通知親友不要理會盜用者傳的訊息。
  - 撥 165 反詐騙專線或 110 報案。
  prevalence:
    note: 2026-03-31 晚間起大量 LINE 用戶反映帳號被盜、遭強制登出，LINE 表示已啟動調查；部分受害者說自己沒點連結也沒給認證碼，官方未公布原因（與上面「騙驗證碼」的手法不同，原因未明）。
    source_url: https://udn.com/news/story/7266/9416879
  sources:
  - title: 台灣人這1週被騙24億！幫親友投票也要小心 首惡詐騙手法曝
