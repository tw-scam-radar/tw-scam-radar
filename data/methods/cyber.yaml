- id: malicious-app
  name: 惡意 App：叫你從連結下載安裝、開權限、綁卡
  aliases:
  - 假 App
  - APK
  - 下載 App 繳費
  - 惡意程式
  - 假官方 App
  category: 帳號資安
  summary: 假冒收費單位、客服或檢警，叫你從不明連結下載 App、開啟權限、綁定信用卡或設定來電轉接，之後卡被盜刷、存款被轉走。
  status: active
  first_seen: '2022'
  channels:
  - 簡訊
  - 電話
  - 交友軟體
  - 實體
  pretend_to_be:
  - 遠通電收
  - 醫院
  - 警察
  - 書記官
  stages:
  - stage: 接觸
    what_you_see: 收到欠費簡訊叫你「下載App線上繳費」；或接到自稱醫院、警察的電話，說你的證件被冒用。
  - stage: 製造情境
    what_you_see: 說你涉案要配合調查、做視訊筆錄，或說欠費再不繳要開罰單。
  - stage: 要求行動
    what_you_see: 被要求從不明網址下載 App、開啟「無障礙」權限、綁定信用卡，或照指示在手機設定來電轉接，並交出信用卡、網銀與證券帳密。
  - stage: 收網後
    what_you_see: 信用卡在幾天內被多筆盜刷、證券持股被賣掉，或存款在深夜被轉走。
  opener_examples:
  - 您有一筆通行費即將到期，請立即下載 App 線上繳費。
  - 為了配合調查，請依指示下載這個 App 並綁定信用卡。
  red_flags:
  - id: download-app-from-link
    text: 叫你從簡訊或對方給的連結下載 App
    cues:
    - re:下載.{0,6}(app|apk).{0,10}(加入|投資|入金|驗證|認證|客服|註冊)
    - re:(下載|安裝).{0,8}(apk|不明|指定|專用|遠端)
    - 請立即下載
    - 下載不明
    weight: 2
  - id: enable-accessibility
    text: 要你開啟「無障礙」權限或螢幕共享
    cues:
    - 無障礙
    - 螢幕共享
    - 開啟權限
    weight: 3
  - id: set-call-forwarding
    text: 要你在手機設定來電轉接
    cues:
    - 來電轉接
    - 轉接設定
    weight: 3
  - id: bind-credit-card
    text: 要你在 App 裡綁定信用卡
    cues:
    - 綁定信用卡
    - 綁卡
    weight: 2
  final_ask:
  - 安裝對方指定的 App、開啟權限、綁定信用卡或設定來電轉接。
  - 提供信用卡、網路銀行或證券帳號密碼。
  verify:
  - 掛掉電話或關掉簡訊，直接打官方機構的電話確認，或撥 110、165。
  - 上 165 打詐儀錶板查詢最新手法。
  safe_lookalikes:
  - 遠通電收建議繳費前先用它的官方 ETC App 查詢；差別在於你自己去找官方 App，而不是點簡訊裡的下載連結。
  if_already_happened:
