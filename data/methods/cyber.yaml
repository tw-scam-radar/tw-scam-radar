- id: deepfake-impersonation
  name: AI 換臉視訊、AI 仿聲冒充親友或名人
  aliases:
  - AI 換臉
  - 深偽
  - Deepfake
  - AI 仿聲
  - 假名人投資廣告
  category: 帳號資安
  summary: 用 AI 做出親友或名人的臉和聲音，透過視訊、電話或社群廣告取信，最後要你匯款、借錢或加入投資群組。
  status: active
  first_seen: '2024'
  channels:
  - 電話
  - 臉書
  - 臉書廣告
  - 其他
  pretend_to_be:
  - 親友
  - 投資名人
  stages:
  - stage: 接觸
    what_you_see: 在社群看到投資名人的影片或廣告，或接到名人的「通話」；也可能是親友打來視訊電話。
  - stage: 取信
    what_you_see: 臉和聲音都很像本人；詐團只要擷取網路上一小段影音就能模擬。
  - stage: 要求行動
    what_you_see: 名人邀你加入投資群組；「親友」說急需用錢，要你幫忙。
  - stage: 收網後
    what_you_see: 投入較多錢之後，被用各種理由拒絕出金。
  opener_examples:
  - （視訊中）是我啦，臨時急需一筆錢，可以先轉給我嗎？
  - 加入我的群組，每天分享強勢飆股，完全不收費。
  red_flags:
  - id: video-call-asks-money
    text: 視訊或電話裡的親友開口要錢
    cues:
    - 急需
    - 借錢
    - 匯款
    - 先轉給我
    weight: 2
  - id: celebrity-stock-group-ad
    text: 名人影片或廣告喊飆股、加入群組、穩定獲利、不收費
    cues:
    - 飆股
    - 強勢股
    - 加入群組
    - 穩定獲利
    - 不收取費用
    weight: 2
  final_ask:
  - 匯款給視訊或電話裡的「親友」。
  - 加入名人的投資群組並投入資金。
  verify:
  - 請對方揮手或左右轉頭，看畫面有沒有異常；AI 換臉在遮擋動作時比較容易露餡。
  - 跟家人事先約定只有彼此知道的暗號或私密問題。
  - 只要提到錢就掛斷，改用通訊錄裡的號碼回撥。
  - 名人投資訊息要透過官方管道查證，不要只看社群或非官方網站。
  safe_lookalikes: []
  if_already_happened:
  - 撥 165 反詐騙專線或 110 報案，並提供證據。
  - 檢舉可疑的廣告或網站，協助下架。
  prevalence:
    note: 刑事局 2024 年 7 月公布 AI 深偽假冒投資名人的三種手法（假影片、假通話、假廣告）；查無依手法分類的件數統計。
    source_url: https://www.cna.com.tw/news/asoc/202407130157.aspx
