- id: crypto-wallet-drain
  name: 加密貨幣錢包詐騙：假空投、錢包授權、騙助記詞
  aliases:
  - 假空投
  - 錢包授權詐騙
  - 助記詞詐騙
  - 假交易所客服
  category: 帳號資安
  summary: 假冒知名加密貨幣專案發「空投」（說要免費送你幣），或假冒交易所客服、寄釣魚郵件，要你把錢包連上假網站按授權，或交出助記詞（用來還原錢包的一組單字），錢包裡的資產就被轉走。
  status: active
  first_seen: ''
  channels:
  - 電子郵件
  - 其他
  pretend_to_be:
  - 知名加密貨幣項目
  - 交易所客服
  - 律師事務所
  stages:
  - stage: 接觸
    what_you_see: 看到知名項目的「空投」活動，或收到冒充交易所、律師事務所的郵件。
  - stage: 要求行動
    what_you_see: 要你把錢包連到對方網站並授權，還鼓勵你用資產最多的錢包；或要你在網站輸入助記詞「驗證資產」，或讓「客服」幫你恢復錢包。
  - stage: 收網後
    what_you_see: 錢包裡的資產瞬間被轉走。
  opener_examples:
  - 恭喜你符合空投資格，連結錢包並授權即可領取。
  - 我是交易所客服，可以幫你恢復錢包，請提供助記詞。
  red_flags:
  - id: airdrop-connect-approve
    text: 空投活動要你連結錢包、按授權
    cues:
    - 空投
    - 領取空投
    - 空投資格
    weight: 2
  - id: asks-seed-phrase
    text: 要你提供或輸入助記詞
    cues:
    - 助記詞
    - 恢復錢包
    - 驗證資產
    weight: 3
  - id: connect-wallet-approve
    text: 要你連結錢包並「授權」才能領取
    cues:
    - re:(連結|連接|綁定)錢包.{0,10}(授權|簽名|確認)
    - 授權即可領取
    weight: 3
  final_ask:
  - 把錢包連上對方網站並按下授權。
  - 輸入或交出助記詞。
  verify:
  - 助記詞絕不交給任何人、不填進任何網站。
  - 要買賣加密貨幣，只選已完成金管會「洗錢防制登記」的業者；名單在金管會證期局官網「提供虛擬資產服務之事業或人員」專區。
  safe_lookalikes: []
  if_already_happened:
  - 馬上保存區塊鏈上的交易紀錄（例如錢包地址、轉帳紀錄）。
  - 聯絡交易所，請他們幫忙攔下這筆錢。
  prevalence:
    note: 查無台灣官方針對假空投、錢包授權的統計。
    source_url: ''
  sources:
  - title: 新手小白最容易中招！律師蔡昆洲揭露：五大詐騙手法變體，正在深入加密貨幣世界！
    publisher: 幣特財經（LINE TODAY 轉載）
    date: '2025-01-14'
    url: https://today.line.me/tw/v3/article/yzNOXNz
    level: L2
    supports:
    - pretend_to_be
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - verify
    - if_already_happened
