- id: phishing-bank
  name: 假銀行釣魚簡訊：假網銀、假信用卡、假證券登入頁
  aliases:
  - 銀行釣魚簡訊
  - 假網銀
  - 假證券商網站
  - 信用卡盜刷簡訊
  category: 帳號資安
  summary: 假冒銀行、信用卡或證券商發簡訊，說帳戶更新失敗或交易異常，叫你點連結輸入帳號密碼、卡號或驗證碼。
  status: active
  first_seen: '2021'
  channels:
  - 簡訊
  - 電子郵件
  pretend_to_be:
  - 銀行
  - 信用卡發卡機構
  - 證券商
  - 金流服務業者
  stages:
  - stage: 接觸
    what_you_see: 收到開頭掛著銀行名稱的簡訊，刑事局觀察常選在週五下午或下班後大量發送，讓你週末找不到銀行查證。
  - stage: 製造情境
    what_you_see: 說你的帳戶資料更新失敗、付款失敗或交易異常，要你馬上處理，逾時要重來。
  - stage: 要求行動
    what_you_see: 點連結進入仿冒的網路銀行或證券商頁面，被要求輸入帳號、密碼、簡訊驗證碼，或信用卡卡號、有效期限與 OTP。
  - stage: 收網後
    what_you_see: 網銀帳密被盜用、存款被轉進人頭帳戶，或信用卡被盜刷、被綁到別人的手機。
  opener_examples:
  - 【某銀行】您的帳戶資料更新失敗，請點連結輸入驗證碼重新驗證。
  - 您的帳戶出現付款失敗，請盡快點連結完成帳戶驗證。
  red_flags:
  - id: bank-update-enter-code
    text: 銀行名義的簡訊附連結，要你「更新資料」並輸入驗證碼
    cues:
    - 帳戶更新失敗
    - 更新資料
    - 輸入您的驗證碼
    - 請立即輸入
    weight: 3
  - id: payment-failed-verify
    text: 說付款失敗、交易異常，要你做「帳戶驗證」
    cues:
    - 付款失敗
    - 交易異常
    - 帳戶驗證
    - 帳戶異常
    weight: 2
  - id: ask-card-otp
    text: 要你在網頁上輸入卡號、有效期限、安全碼或 OTP 一次性密碼
    cues:
    - 有效期限
    - 安全碼
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    weight: 2
  - id: odd-domain-link
    weight: 2
    text: 網址的結尾或拼法很怪（例如 .top、.cc、.vip，或在官方名稱後面加奇怪字串）
    cues:
    - re:[a-z0-9-]+\.(top|xyz|cc|vip|cn|icu|click|buzz|work|live|online|club|shop|site|fun|bond|sbs|cfd|pro|games)(/|$|[^a-z0-9.-])
    - re:(7-?eleven|shopee|line|apple|gov|post)[-.][a-z0-9-]*\.(cc|top|xyz|vip|shop|site)
  final_ask:
  - 在假網銀或假證券商頁面輸入帳號、密碼與簡訊驗證碼。
  - 在不明網頁輸入信用卡卡號、有效期限與 OTP，或把信用卡綁定到對方的手機。
  verify:
  - 不點簡訊裡的連結；自己打開銀行或證券商的官方 App，或手動輸入官網網址。
  - 撥證券商官網上的客服電話，或發卡機構的客服電話查證。
  - 撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - 真的 OTP 簡訊會寫交易幣別、金額與用途；跟你正在做的交易對不上就不要輸入，並聯絡發卡機構。
  - 發卡機構的消費即時通知是正常服務，可以用來發現不是本人的刷卡。
  if_already_happened:
  - 發現不是本人的消費或可疑交易，立刻聯絡發卡機構處理（停卡、換卡）。
  - 撥 165 反詐騙專線諮詢，並到派出所報案。
  prevalence:
    note: 刑事局統計 2026 年 8 月釣魚連結詐騙受理 505 件、財損約 5,451 萬元，件數年增 99.6%、財損年增 317.7%（含各種假冒對象，不只銀行）；假冒銀行與金流服務是六類常見話術之一。
    source_url: https://udn.com/news/story/124490/9755214
  sources:
  - title: 釣魚簡訊改冒用台新銀名義行騙 財損達55萬！警方提醒民眾勿點連結
    publisher: Newtalk 新聞
    date: '2021-02-06'
    url: https://newtalk.tw/news/view/2021-02-06/534333
    level: L2
    supports:
    - first_seen
    - stages
    - opener_examples
    - red_flags
    - final_ask
  - title: 詐騙猖獗 金管會提醒春節假期慎防信用卡盜刷
    publisher: 中央社（聯合新聞網轉載）
    date: '2026-02-16'
    url: https://udn.com/news/story/7239/9332247
    level: L2
    supports:
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
    - if_already_happened
  - title: 詐騙集團假冒券商頁面盜帳號 金管會籲小心釣魚
    publisher: 中央社
