- id: fake-traffic-fine
  name: 假監理站、假交通罰單簡訊
  aliases:
  - 假監理服務網
  - 罰單簡訊詐騙
  - 罰單催繳郵件
  - 假 111 簡訊
  category: 帳號資安
  summary: 假冒監理服務網或監理站，用簡訊或電子郵件說你的交通違規快逾期，叫你點連結刷卡繳罰款。
  status: active
  first_seen: '2023'
  channels:
  - 簡訊
  - 電子郵件
  pretend_to_be:
  - 監理服務網
  - 監理站
  - 公路局
  stages:
  - stage: 接觸
    what_you_see: 收到開頭寫「監理服務網」的簡訊，或「監理業務中心」名義的電子郵件，說你違反道路交通管理事件。
  - stage: 製造情境
    what_you_see: 說即將超過線上處理期限、罰款逾期未繳，要你在某月某日前盡快處理。
  - stage: 要求行動
    what_you_see: 點連結進入仿冒的監理服務網和信用卡繳費畫面，被要求輸入信用卡號與認證碼。
  - stage: 收網後
    what_you_see: 信用卡被盜刷，個資也外洩。
  opener_examples:
  - ［監理服務網］您有交通違規即將逾期，請於期限前上網處理。
  - 監理單位通知：您有違規罰款尚未繳納，請點連結線上繳費。
  red_flags:
  - id: fine-message-with-link
    text: 罰單或違規通知附了連結（官方到期提醒不附網址）
    cues:
    - re:(違反道路交通|交通違規|罰單|罰款|罰鍰).{0,40}(http|www\.|\[連結\])
    - re:(http|www\.|\[連結\]).{0,40}(罰單|罰款|罰鍰)
    - bit.ly
    weight: 3
  - id: fine-deadline-pressure
    text: 說即將過線上處理期限、逾期未繳，要你盡快處理
    cues:
    - 即將過線上處理期限
    - 線上處理期限
    - 盡快處理
    - 逾期未繳
    weight: 2
  - id: fine-by-email
    text: 用電子郵件催繳交通罰單
    cues:
    - 監理業務中心
    - 未處理違反交通管理事件
    - 繳納交通違規罰鍰
    weight: 2
  - id: foreign-sender-number
    text: 發送號碼是「+」開頭的境外號碼
    cues:
    - '+63'
    - '+66'
    weight: 2
  final_ask:
  - 點連結到假監理服務網，輸入信用卡號與認證碼繳「罰款」。
  verify:
  - 自己輸入監理服務網正確網址 www.mvdis.gov.tw，或用監理服務 App 查有沒有違規。
  - 打公路局用路人服務中心 0800-231-035，或直接問各地監理所、站；如果罰單是六都開的，要問該市的裁決中心（處）。
  - 撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - 監理單位的罰單到期簡訊要車主自己申請，只是提醒，不會附網址讓你點。
  - 政府機關網址以 gov.tw 結尾；縮網址或其他網域都不是監理服務網。
  - 法務部宣導：交通罰單催繳電子郵件是詐騙。
  - 曾有詐團假冒「111」政府專屬短碼發釣魚簡訊；看到 111 也不要點附帶的連結，回官網查。
  if_already_happened:
  - 已輸入信用卡資料，立刻聯絡發卡機構停卡、換卡。
  - 撥 165 反詐騙專線諮詢或報案。
  prevalence:
    note: 刑事局 2026 年 9 月把「假冒政府機關及公共服務（含交通部，以罰單未繳為由）」列為六類常見釣魚話術之一。
    source_url: https://udn.com/news/story/124490/9755214
  sources:
