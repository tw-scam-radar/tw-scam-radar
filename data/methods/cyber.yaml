- id: qr-phishing
  name: QR Code 釣魚：假繳費單、假海報、假客服叫你掃碼
  aliases:
  - 掃碼詐騙
  - 假 QR Code
  - 野 code
  - 掃碼詐欺
  category: 帳號資安
  summary: 在停車繳費單、優惠海報、店家付款立牌或假客服對話裡放假 QR Code，掃了被導去釣魚網站輸卡號、登入帳號，或直接把錢轉走。
  status: active
  first_seen: ''
  channels:
  - 實體
  - LINE
  pretend_to_be:
  - 停車繳費單
  - 優惠抽獎活動
  - 店家付款碼
  - 電商客服
  - 金流人員
  stages:
  - stage: 接觸
    what_you_see: 路邊停車繳費單上的 QR Code 被蓋上另一張；公共場所貼著「限時優惠」「免費抽獎」海報；店家付款立牌被調包。
  - stage: 製造情境
    what_you_see: 假客服說你的訂單重複扣款、要辦理取消設定，再帶你加入假客服 LINE 做「金流驗證」。
  - stage: 要求行動
    what_you_see: 掃碼後要你輸入信用卡資料、登入社群帳號、下載程式；或要你掃對方給的 QR Code 匯款、提供無卡提款 QR Code。
  - stage: 收網後
    what_you_see: 信用卡被盜刷；社群帳號被盜後親友收到詐騙訊息；付款進了詐騙帳戶，交易卻沒完成。
  opener_examples:
  - 系統顯示您的訂單重複扣款，請掃描這個 QR Code 完成金流驗證。
  - 掃碼參加免費抽獎，登入帳號就能領獎。
  red_flags:
  - id: scan-qr-to-verify
    text: 客服要你掃 QR Code 做驗證、解除扣款
    cues:
    - re:掃描?\s*QR\s*[Cc]ode.{0,10}(驗證|匯款|轉帳)
    - 金流驗證
    - 解除扣款
    - 取消設定
    weight: 3
  - id: give-cardless-qr
    text: 要你提供無卡提款 QR Code 或付款碼
    cues:
    - 無卡提款
    - 付款碼
    - 提款QR
    weight: 3
  - id: promo-poster-login
    text: 掃碼抽獎、領優惠，卻要你登入社群帳號或填個資
    cues:
    - 限時優惠
    - 免費抽獎
    weight: 1
  final_ask:
  - 掃碼後在頁面輸入信用卡資料或帳號密碼。
  - 掃對方給的 QR Code 匯款，或提供自己的無卡提款 QR Code、付款碼。
  verify:
  - 掃完先看網址，是政府網站或你熟悉的支付平台才繼續；導到陌生頁面就停，不輸入任何資料。
  - 對訂單有疑問，直接用官方網站或官方 App 查；可疑電話掛掉後撥 165。
  safe_lookalikes:
  - 台北、台中、高雄的正牌停車單 QR Code 是官方系統產生的，掃了會連到市政府的繳費平台，或經過授權的行動支付。
  - 正規企業與銀行的客服不會要你掃 QR Code 匯款或做驗證。
  if_already_happened:
  - 已輸入卡號，立刻聯絡發卡機構處理。
  - 撥 165 反詐騙專線或 110 報案。
  prevalence:
    note: 自由時報 2026-07-02 引刑事局統計，2026 上半年假繳費、假優惠等掃碼詐騙件數比去年同期多四成以上、財損破億元。衝突：三立 2025-10-27 報導，刑事局與 165 當時表示沒接過因掃停車單 QR Code 被盜刷的報案（台北、台中、高雄停管處也沒有），網傳「盜刷 30 萬」被判定為錯誤訊息。兩者並列，不做調和。
    source_url: https://news.ltn.com.tw/news/society/breakingnews/5491584
  sources:
