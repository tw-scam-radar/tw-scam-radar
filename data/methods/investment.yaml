- id: fake-investment-app
  name: 假投資：假券商 App、假投資平台
  aliases:
  - 假投資 App
  - 假投資平台
  - 假券商
  - 出金詐騙
  - 偽造金管會公文
  category: 投資理財
  summary: 對方要你下載非官方的投資 App 或網站下單，帳面一路賺；等你要把錢領出來（出金），才說要先繳稅金、保證金或解凍金，甚至拿偽造的金管會公文要你繳錢，繳了還是領不到。
  status: active
  first_seen: ''
  channels:
  - 臉書廣告
  - LINE
  - LINE 群組
  - 簡訊
  pretend_to_be:
  - 合法證券商
  - 投資平台客服
  - 金管會
  stages:
  - stage: 接觸
    what_you_see: 從投資群組、臉書廣告或簡訊被引導，用對方給的連結下載投資 App 或進入投資網站。
  - stage: 取信
    what_you_see: 先小額試做，帳面顯示獲利；有的 App 用「儲值」下單，看起來跟一般看盤軟體不一樣。
  - stage: 製造情境
    what_you_see: 說能搶漲停股、保證獲利，鼓勵你持續加碼匯款。
  - stage: 要求行動
    what_you_see: 申請出金時，客服或一份蓋著「金管會」印信的文件說，要先繳稅金、所得稅、保證金、解凍金或驗證金。
  - stage: 收網後
    what_you_see: 繳了錢還是出不了金，帳號被凍結，App 或網站關閉、客服失聯。
  opener_examples:
  - 這個 App 可以搶漲停股，先小額試試看。
  - 您的獲利需先繳納所得稅，才能提領出金。
  - 出金前請先繳保證金完成驗證，款項才會解凍。
  red_flags:
  - id: withdrawal-fee
    text: 要把錢領出來（出金）前，得先繳稅金、保證金、解凍金或驗證金
    cues:
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 所得稅
    - 解凍金
    - 驗證金
    weight: 3
  - id: withdrawal-excuse
    text: 用「洗碼量不足」「IP 異常」「帳號凍結」等理由，不讓你把錢領出來
    cues:
    - 洗碼量
    - IP異常
    - 帳號凍結
    - 無法出金
    weight: 3
  - id: unofficial-app
    text: 要你用對方給的連結下載 App，或用「儲值」方式下單
    cues:
    - 下載連結
    - 機構席位
    - re:(儲值|入金).{0,10}(平台|app|帳戶|客服|老師)
    weight: 2
  - id: fake-regulator-doc
    text: 拿出「金管會」公文、執照或違約通知要你繳錢
    cues:
    - re:金管會.{0,10}(核准|認證|許可|保證|擔保|批准)
    - re:(line|賴|簡訊|email).{0,10}(公文|拘票|傳票|通緝)
    - 違約申報
    - 營業執照
    weight: 2
  - id: guaranteed-return
    text: 保證獲利、搶漲停、穩賺不賠
    cues:
    - 保證獲利
    - 搶漲停
    - 穩賺不賠
    weight: 3
  final_ask:
  - 在對方給的 App 或網站持續儲值、加碼。
  - 出金前先繳稅金、保證金、解凍金或驗證金。
  verify:
  - 到金管會「防範非法證券期貨業宣導專區」查合法業者名單，或查證券期貨公會的警示專區。
  - 撥 165 反詐騙諮詢專線，或金管會反詐欺諮詢專線 02-2737-3434 查證。
  - 用 165 打詐儀錶板的涉詐網址查詢檢查投資網站。
  safe_lookalikes:
  - 金管會官方不會主動聯繫你處理帳戶、不會管制或凍結資金、不會要你繳保證金或驗證金；收到蓋金管會印信、要你繳稅才能出金的文件就是偽造的。
  - 合法業者名稱可能被冒用；要查證時，用金管會合法業者名單上的聯絡方式自己聯繫，不要用對方給的電話或 LINE。
  if_already_happened:
  - 不要再繳任何出金費用，立即停止操作並查證。
  - 撥 165 或到派出所報案；款項還沒被領走時，請專員通報銀行圈存（先把那筆錢凍結住）。
  prevalence:
    note: ''
    source_url: ''
  sources:
