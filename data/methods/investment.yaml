- id: columbarium-scam
  name: 靈骨塔、塔位、生前契約詐騙：說有人高價收購，要你先加購或繳費
  aliases:
  - 靈骨塔詐騙
  - 靈骨塔收購詐騙
  - 靈骨塔位買空賣空
  - 塔位仲介詐騙
  category: 投資理財
  summary: 業者說塔位、生前契約是保值商品，能賺價差；或說已有買家要高價收購你手上的塔位，但要你先加購更多塔位、骨灰罐、禮儀契約，或先付手續費、保管費、節稅等費用。錢付了，買賣卻一直談不成。這種手法主要鎖定長輩。
  status: active
  first_seen: ''
  channels:
  - 實體
  - 其他
  pretend_to_be:
  - 塔位仲介
  - 殯葬業務員
  - 買家
  stages:
  - stage: 接觸
    what_you_see: 業者推銷塔位、骨灰罐或生前契約，說是保值商品、幾年後能賺好幾倍；或自稱塔位仲介、掛著「高價收購靈骨塔位」的招牌，說能幫你把手上的塔位賣掉。
  - stage: 取信
    what_you_see: 一直強調靈骨塔是投資標的，低價買進、高價賣出，還能節稅。
  - stage: 製造情境
    what_you_see: 說已經有買家要高價收購，但要「整套」才賣得掉，或買家臨時追加需求。
  - stage: 要求行動
    what_you_see: 要你先加購更多塔位、骨灰罐、禮儀契約、生前契約或永久使用憑證，或先付手續費、保管費、節稅、代書費、廣告費。
  - stage: 收網後
    what_you_see: 交易一直不成交，要退款被百般刁難；有人花了數百萬到上千萬元，手上囤了一堆賣不掉的塔位，之後還被用新名目再要一次錢。
  opener_examples:
  - 有買家要高價收你的塔位，但要整套加購骨灰罐才收。
  - 塔位是保值商品，低價買進、過幾年轉手就能賺價差。
  - 買家臨時多要幾個，不補足數量這筆交易就做不成。
  red_flags:
  - id: columbarium-as-investment
    text: 把塔位、生前契約當投資商品賣，說能賺價差、節稅、獲利好幾倍
    cues:
    - re:(塔位|靈骨塔|納骨塔|生前契約).{0,15}(投資|賺價差|保值|增值|獲利)
    - re:(投資|買).{0,6}(塔位|靈骨塔|納骨塔).{0,15}(節稅|賺)
    weight: 3
  - id: buyer-waiting
    text: 說已有買家要高價收購你的塔位或生前契約
    cues:
    - re:(高價|高額).{0,4}(收購|收).{0,6}(塔位|靈骨塔|納骨塔|生前契約)
    - re:(有|找到).{0,4}買家.{0,15}(塔位|靈骨塔|骨灰罐|生前契約)
    weight: 2
  - id: buy-more-to-sell
    text: 要賣先買：叫你加購塔位、骨灰罐、禮儀契約，或補足數量才能成交
    cues:
    - re:(加購|補足|追加).{0,10}(塔位|骨灰罐|禮儀契約|生前契約|數量)
    - re:(不補|沒補).{0,6}(差額|數量).{0,10}(無法|不能)(交易|成交|退款)
    - re:整套.{0,6}(才|比較).{0,4}(划算|賣得掉|好賣)
    weight: 3
  - id: fee-before-deal
    text: 成交前先收手續費、保管費、稅金、代書費或廣告費
    cues:
    - re:(先|要|需|須).{0,4}(繳|付|交).{0,8}(保管費|代書費|廣告費|手續費|稅金)
    - re:(節稅|稅金|保管費|代書費).{0,15}(才能|才可).{0,4}(成交|過戶|交易|賣)
    weight: 3
  final_ask:
  - 先加購更多塔位、骨灰罐、禮儀契約或生前契約，才能把手上的塔位賣掉。
  - 先付手續費、保管費、節稅費用、代書費或廣告費。
  verify:
  - 納骨塔位和生前契約不是投資商品；自稱能幫你把塔位賣掉的業者不要輕信，撥 165 或 110 查證。
  - 到內政部「全國殯葬資訊入口網」查合法的生前契約與殯葬設施經營業者，或洽地方政府殯葬主管機關。
  - 任何買賣或契約，先確認對方身分和資金用途再付錢。
  safe_lookalikes:
  - 依自己實際需要向合法殯葬業者買塔位或生前契約、簽書面契約是正常交易；不正常的是「說能幫你賺錢或轉賣，卻要你先多買或先付費」。
  if_already_happened:
  - 撥 165 或 110 報案。
  - 已經付過錢的人，要小心對方再用保管費、節稅、代書費等名目回頭要第二次錢，一律先停下來查證。
  prevalence:
    note: 刑事局 2026-03 破獲靈骨塔買空賣空集團，約 12 名高齡被害人，其中一人買了 80 多個塔位、花了 2000 多萬元；2026-07 高雄破獲收購詐團，至少 4 人受害、財損逾 300 萬元。查無 165 分類統計。
