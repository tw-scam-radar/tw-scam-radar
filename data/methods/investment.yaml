- id: fake-investment-group
  name: 假投資：投資群組、老師帶單
  aliases:
  - 投資群組詐騙
  - 飆股群組
  - 股票老師
  - 報明牌
  - 新股抽籤詐騙
  - 港仙股
  category: 投資理財
  summary: 對方冒用名人、財經專家、機關首長或合法券商名義，把你拉進 LINE 投資群組報明牌，最後要你下載指定 App、把錢匯到指定帳戶或面交現金加碼。
  status: active
  first_seen: ''
  channels:
  - 臉書
  - 臉書廣告
  - IG
  - YouTube
  - LINE
  - LINE 群組
  - 簡訊
  - 電話
  - 交友軟體
  pretend_to_be:
  - 投資老師
  - 助理
  - 客服
  - 財經名人
  - 財經專家
  - 合法證券商或金融機構
  - 機關首長
  stages:
  - stage: 接觸
    what_you_see: 在臉書、IG、YouTube 看到名人或專家推薦的投資訊息，或收到簡訊、陌生訊息，請你加 LINE。
  - stage: 取信
    what_you_see: 被拉進 LINE 投資群組，「老師」每天早晚報明牌，其他成員不斷貼獲利截圖、匯款單，說「籌碼到手」。
  - stage: 製造情境
    what_you_see: 先讓你小額試做、看到獲利，再說資金越多賺越多；也可能通知你用「專用通道」抽中新股要馬上繳款，或叫你開複委託買極低價的港股。
  - stage: 要求行動
    what_you_see: 要你下載指定的投資 App 或網站儲值下單，把錢匯到對方給的帳戶，或約你面交現金。
  - stage: 收網後
    what_you_see: 想出金時被用洗碼量不足、要繳保證金、IP 異常等理由拒絕；最後帳號被凍結、網站或 App 關閉，對方失聯。
  opener_examples:
  - 有事想請教你，方便加個 LINE 嗎？
  - 老師每天免費分享明牌，進群組就能跟上。
  - 群組有專用通道，新股可以優先申購、不限張數。
  - 恭喜抽中新股，請今天內匯款，否則算違約。
  red_flags:
  - id: guaranteed-return
    text: 保證獲利、穩賺不賠、零風險
    cues:
    - 保證獲利
    - 穩賺不賠
    - 零風險
    - 低風險高報酬
    - 穩定獲利
    weight: 3
  - id: line-investment-group
    text: 要你加入 LINE 投資群組，或加「老師」「助理」好友，才能拿明牌
    cues:
    - 投資群組
    - 飆股
    - 明牌
    - 股票老師
    - 助理
    - 加LINE
    weight: 2
  - id: insider-tip
    text: 號稱有內線消息
    cues:
    - 內線
    - 內線消息
    - 內線交易
    weight: 2
  - id: celebrity-endorsement
    text: 用名人、財經專家或官員名義推薦投資
    cues:
    - 名人推薦
    - 財經專家
    - 首長推薦
    weight: 1
  - id: priority-ipo-channel
    text: 說有專用通道可優先申購新股，抽中要立刻匯款否則違約
    cues:
    - 專用通道
    - 優先申購
    - 不限數量
    - 抽中
    - 違約
    weight: 3
  - id: pay-personal-account-or-cash
    text: 要你把投資款匯到個人帳戶，或面交現金
    cues:
    - 個人帳戶
    - 指定帳戶
    - re:面交.{0,8}(現金|存摺|提款卡|金融卡|款項)
    - re:(現金|存摺|提款卡|金融卡).{0,8}面交
    - re:(派|請).{0,6}(專員|人員|同事).{0,6}(收|拿|取)
    - 收取現金
    weight: 3
  - id: withdrawal-fee
    text: 要把錢領出來（出金）前，得先繳保證金、稅金等費用
    cues:
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 解凍金
    - 洗碼量
    weight: 3
  - id: hk-penny-stock
    text: 叫你開複委託帳戶（透過國內券商買國外股票），去買極低價、冷門的港股
    cues:
    - 複委託
    - 港股
    - 仙股
    weight: 2
  - id: stock-group-jargon
    weight: 2
    text: 群組裡講「飆股、主力佈局、外資帳戶、開戶經理」這類帶單行話
    cues:
    - 飆股
    - 主力機構
    - 外資帳戶
    - 開戶經理
    - 帶大家進場
    - 做莊
    - re:(老師|主力).{0,10}(佈局|進場|帶單|當沖)
  final_ask:
  - 下載對方指定的投資 App 或網站，儲值、持續加碼。
  - 把錢匯到對方給的帳戶（常是個人帳戶），或約面交現金。
  - 想把錢領出來時，又要你先繳保證金、稅金等費用。
  verify:
  - 到金管會「防範非法證券期貨業宣導專區」查合法業者名單，或查各證券期貨公會的「非金管會核准之證券期貨業者及商品警示專區」。
  - 到投信投顧公會網站查合法投資管道與「投信投顧合格登錄人員」。
  - 撥 165 反詐騙諮詢專線，或金管會反詐欺諮詢專線 02-2737-3434 查證。
  - 用 165 打詐儀錶板的涉詐網址查詢，檢查對方給的投資網站。
  safe_lookalikes:
  - 合法業者的名字可能被冒用；就算名字查得到，只要對方叫你把錢匯到個人帳戶，或要跟你面交現金，金管會提醒，這極可能是詐騙。
  - 金管會官方不會主動聯繫你處理帳戶、不會凍結資金、不會要你繳保證金或驗證金；收到「金管會違約通知」要你補繳款就是假的。
  if_already_happened:
  - 立刻停止匯款加碼，不要因為已經投入就繼續繳「出金費用」。
  - 保留對話、轉帳紀錄，撥 165 或到派出所報案。
  - 款項還沒被領走時，盡快打 165，由專員通報銀行圈存（先把那筆錢凍結住）。
  prevalence:
    note: 警政署統計，114 年「投資詐欺」5 萬 8,675 件，占全部詐欺案件 29.69%，件數第一；24 歲以上各年齡層被害人都以投資詐欺最多（此統計未再細分群組、App、虛擬貨幣）。
    source_url: https://www.npa.gov.tw/ch/app/data/doc?module=wg057&detailNo=1488707994689474560&type=s
  sources:
  - title: 常見詐騙手法話術解析與因應之道－第二章 假投資
    publisher: 刑事警察局
