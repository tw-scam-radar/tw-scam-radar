    publisher: 財政部國庫署
    date: '2025-08-07'
    url: https://www.mof.gov.tw/singlehtml/384fb3077bb349ea973e7fc6f13b6974?cntId=b0b1e1ec93dc4869aa5a89f4b42a41c9
    level: L1
    supports:
