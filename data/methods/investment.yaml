- id: recovery-scam
  name: 二次詐騙：假律師、假協會說能幫你追回
  aliases:
  - 二次詐騙
  - 假律師
  - 追款詐騙
  - 駭客追款
  - 幣流分析師
  category: 投資理財
  summary: 你被騙後上網找追款方法，遇到自稱律師、駭客、幣流分析師或檢警的人說能追回，要你先付律師費、手續費、保證金，甚至叫你到博弈平台把錢「贏回來」。
  status: active
  first_seen: ''
  channels:
  - 搜尋引擎廣告
  - LINE
  - LINE 群組
  - 電話
  pretend_to_be:
  - 律師
  - 國際律師
  - 幣流分析師
  - 駭客
  - 網路追款專員
  - 檢警
  - 銀行人員
  stages:
  - stage: 接觸
    what_you_see: 被騙後上網搜尋「追回詐騙款項」，看到「律師保證幫你拿回」「律師事務所免費諮詢」的廣告或網站，或看到駭客追款貼文要你加 LINE。
  - stage: 取信
    what_you_see: 對方自稱律師、國際律師或「幣流分析師」，要你提供被騙細節與文件，說已查出錢流去哪裡。
  - stage: 製造情境
    what_you_see: 也有人假冒檢警說抓到提領車手，或假冒銀行說款項已追回，要你配合處理。
  - stage: 要求行動
    what_you_see: 要你先付律師費、手續費、保證金，或提供帳戶；有的叫你開虛擬貨幣錢包、面交現金換泰達幣，到博弈平台「贏回」損失。
  - stage: 收網後
    what_you_see: 付了錢對方就消失；或帳面顯示「贏錢」，再慫恿你借錢、抵押房子加碼。
  opener_examples:
  - 律師事務所免費提供詐騙法律諮詢，保證幫你追回。
  - 我們的幣流分析師已查到你的錢流向，可以協助拿回。
  - 已經抓到提領車手，繳了手續費就能把款項還你。
  red_flags:
  - id: guaranteed-recovery
    text: 保證能幫你追回、拿回被騙的錢
    cues:
    - 追回
    - 保證拿回
    - 追款
    - 協助追回
    - 討回
    weight: 3
  - id: fee-before-recovery
    text: 追款前要你先付律師費、手續費或保證金
    cues:
    - 律師費
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    weight: 3
  - id: hacker-or-flow-analyst
    text: 自稱駭客、幣流分析師或國際律師，有特殊管道追款
    cues:
    - 駭客
    - 幣流分析
    - 國際律師
    - 特殊管道
    weight: 3
  - id: win-back-by-gambling
    text: 叫你到博弈平台或娛樂城把損失「贏回來」
    cues:
    - 娛樂城
    - 博弈
    - 贏回
    weight: 3
  final_ask:
  - 先付律師費、手續費或保證金。
  - 提供自己的帳戶給對方（可能被拿去當人頭帳戶）。
  - 面交現金換虛擬貨幣，到對方指定的博弈平台下注。
  verify:
  - 用法務部律師查詢系統查對方是不是登錄的執業律師，並親自到事務所面談。
  - 找法律扶助基金會，或各地方法院的訴訟輔導科、律師免費諮詢。
  - 對追回方式有疑慮，撥 165 反詐騙諮詢專線詢問。
  safe_lookalikes:
  - 正規追款要走這條路：報案、檢察官起訴、法院審理，判決有罪後，再透過「刑事附帶民事訴訟」要求賠償。律師只能幫你打官司（訴訟代理人），沒有公權力，不能私下把錢追回來。
  - 款項還沒被領走時，正規做法是打 165，請專員通報銀行圈存（先把那筆錢凍結住），再向警方報案。
  if_already_happened:
  - 立刻報警，不要再找駭客或來路不明的單位。
  - 錢還沒被領走：撥 165 請銀行圈存；已被轉走：只能提出詐欺告訴或向法院請求民事賠償。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 注意可能被「二次詐騙」
    publisher: 臺灣臺北地方檢察署
    date: '2024-04-23'
    url: https://www.tpc.moj.gov.tw/292885/976681/661783/1169727/post
    level: L1
    supports:
    - aliases
    - channels
    - pretend_to_be
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
    - if_already_happened
  - title: 誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元
    publisher: 刑事警察局
    date: '2026-01-31'
    url: https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d
    level: L1
