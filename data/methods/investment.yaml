- id: fake-gambling
  name: 假博弈：彩券明牌群組、假娛樂城、假線上投注，說你贏了卻要先繳錢才能領
  aliases:
  - 假投資（博弈）網站
  - 假博弈機房
  - 彩券明牌詐騙
  - 報明牌詐騙
  - 假六合彩／報明牌
  category: 投資理財
  summary: 在臉書、LINE 群組看到「免費報明牌、保證中獎」，或標榜「入出金快速、高賠率」的博弈平台。加入後，對方要你繳入會費、保密費、包中費，或在假網站儲值下注。等說你中獎、贏錢了，要領錢卻得先付手續費、稅金、擔保金；付了還是領不到，贏多了直接被封鎖。
  status: active
  first_seen: '2012'
  channels:
  - 臉書
  - LINE 群組
  - LINE
  - 其他
  pretend_to_be:
  - 報牌老師、專業操盤團隊
  - 博弈網站客服
  - 線上投注站
  - 說能暗中幫你贏錢的網友
  stages:
  - stage: 接觸
    what_you_see: 在臉書貼文或社團看到「免費入群」「獎號分享」「連中多期」的報明牌訊息，或標榜「入出金快速、高賠率高報酬」的博弈平台；也有網友說親戚在操盤，能暗中讓你贏。
  - stage: 取信
    what_you_see: 被拉進 LINE 群組，群組說是專業團隊操盤、內部號碼穩賺、保證中獎。
  - stage: 要求行動
    what_you_see: 要你繳入會費、保密費、包中費或系統維護費才能繼續收號；或要你在網站加入會員、儲值下注，甚至先付開戶費。
  - stage: 製造情境
    what_you_see: 告訴你中了大獎，或帳面上贏了很多錢。
  - stage: 收網後
    what_you_see: 要領錢卻得先付手續費、稅金、擔保金；不付就打電話恐嚇要告你；贏太多要出金時直接被封鎖，群組和帳號跟著消失。
  opener_examples:
  - 免費入群拿獎號，我們已經連中好幾期了。
  - 專業團隊操盤，內部號碼穩賺，名額有限要快。
  - 恭喜你中大獎，先到超商繳手續費才能領。
  - 入出金快速、高賠率，註冊儲值就能下注。
  red_flags:
  - id: lottery-insider-numbers
    text: 宣稱有內幕明牌、保證中獎、包中
    cues:
    - re:(內幕|內線|內部|精準).{0,4}(明牌|號碼|報牌)
    - re:(保證中獎|中獎包中|包中牌|包中費)
    - re:(免費|帶你|幫你).{0,4}報明牌
    - re:連中.{0,4}(多期|好幾期|[0-9一二三四五六七八九十]+期)
    weight: 3
  - id: pay-to-join-group
    text: 要繳入會費、保密費、包中費、系統維護費才給號碼
    cues:
    - re:(繳|付|匯|交).{0,6}(入會費|保密費|包中費|系統維護費)
    - re:(入會費|保密費|包中費).{0,10}(才|就|可以)
    weight: 3
  - id: online-lottery-betting
    text: 說能在網路上買公益彩券，或加入會員、儲值就能下注
    cues:
    - re:(網路|線上).{0,4}(投注|下注|購買).{0,6}(彩券|今彩|大樂透|威力彩|六合彩)
    - re:(加入會員|註冊).{0,10}儲值.{0,10}(下注|投注|購買|買)
    weight: 3
  - id: pay-before-payout
    text: 中獎或贏錢要領之前，先叫你付手續費、稅金、擔保金
    cues:
    - re:(中獎|中了|贏了|彩金|獎金).{0,20}(先|需|要|須).{0,4}(繳|付|匯).{0,8}(手續費|稅金|擔保金|保證金)
    - re:(擔保金|稅金|手續費).{0,10}(才能|才可).{0,4}(領|出金|提領)
    - re:到超商.{0,6}(繳|匯).{0,6}手續費
    weight: 3
  - id: fast-payout-high-odds
    text: 標榜入出金快速、高賠率、高報酬，或說能暗中讓你贏
    cues:
    - re:入.{0,1}出金.{0,2}快速
    - re:高賠率.{0,4}高(報酬|回報)
    - re:(暗中|偷偷).{0,4}(幫|讓).{0,4}(你|我們|你們)贏
    weight: 2
  - id: threaten-if-not-pay
    text: 不付錢就恐嚇要報案、提告
    cues:
    - re:(不|沒有)(繳|付|匯).{0,10}(報案|提告|告你|法律責任)
    - re:(將|就)報案提告
    weight: 2
  final_ask:
  - 繳入會費、保密費、包中費或系統維護費，換取「明牌」。
  - 在假投注網站或博弈平台加入會員、儲值下注。
  - 說你中獎或贏錢後，先付手續費、稅金、擔保金才能領。
  verify:
  - 公益彩券目前沒有開放線上投注或儲值購買；網路上要你加會員、儲值買彩券的就是詐騙，可打台灣彩券客服查證。
  - 公益彩券開獎完全隨機、有公正人士見證，事前不可能知道號碼，沒有「明牌」。
  - 撥 165，或到數位發展部「網路詐騙通報查詢網」查詢、通報。
  safe_lookalikes:
  - 在彩券行（投注站）買公益彩券、照官方方式對獎是正常的；網路上自稱能代買、代下注、報明牌的都不是官方。
  if_already_happened:
  - 不要再到超商繳款或照指示到 ATM 操作，封鎖對方帳號，撥 110 或 165。
  prevalence:
    note: 165「假投資（博弈）網站」開放資料（統計期間 2021-12-27 至 2025-12-31）中，網站名稱含「娛樂城」或「博弈」的有 457 筆、通報 961 件；名稱沒寫明的博弈網站不在這個數字內。
    source_url: https://data.gov.tw/dataset/160055
  sources:
