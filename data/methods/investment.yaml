- id: fake-investment-crypto
  name: 假投資：虛擬貨幣、假交易所
  aliases:
  - 虛擬貨幣投資詐騙
  - 假交易所
  - 假投資平台
  - 泰達幣
  - USDT
  - 假幣商
  category: 投資理財
  summary: 對方用虛擬貨幣高收益當誘餌，教你買泰達幣（USDT）轉進他給的錢包或平台，或安排「幣商」面交現金換幣，最後平台不讓你把錢領出來（出金）。
  status: active
  first_seen: ''
  channels:
  - 交友軟體
  - LINE
  - LINE 群組
  - 實體
  pretend_to_be:
  - 網友
  - 投資老師
  - 平台客服
  - 虛擬貨幣幣商
  stages:
  - stage: 接觸
    what_you_see: 在交友軟體認識的網友，或投資群組裡推薦飆股的人，開始跟你聊虛擬貨幣賺匯差、高收益。
  - stage: 取信
    what_you_see: 教你買泰達幣（USDT），給你一個投資平台網址；第一次出金可能真的成功，讓你更相信。
  - stage: 製造情境
    what_you_see: 帳面一直賺，鼓勵你加碼，甚至去銀行申請信貸投入。
  - stage: 要求行動
    what_you_see: 要你把幣轉進指定錢包或平台，或安排「幣商」跟你面交現金換幣。
  - stage: 收網後
    what_you_see: 再次申請出金時，「客服」說要另繳訂金、手續費、稅金或保證金才能出金，繳了還是拿不到。
  opener_examples:
  - 我最近在做虛擬貨幣匯差，每天都有收益，帶你一起。
  - 先買一點泰達幣試試，轉到這個平台就能操作。
  - 幣商可以直接跟你面交現金換幣，不用跑交易所。
  red_flags:
  - id: buy-crypto-to-wallet
    text: 要你先買虛擬貨幣，再轉入他指定的錢包或平台
    cues:
    - 泰達幣
    - USDT
    - 指定錢包
    - 錢包地址
    - 轉入平台
    weight: 3
  - id: cash-for-crypto-meetup
    text: 安排「幣商」面交現金換虛擬貨幣
    cues:
    - 幣商
    - re:面交.{0,8}(現金|存摺|提款卡|金融卡|款項)
    - re:(現金|存摺|提款卡|金融卡).{0,8}面交
    - re:(派|請).{0,6}(專員|人員|同事).{0,6}(收|拿|取)
    - 現金換幣
    weight: 3
  - id: withdrawal-fee
    text: 要把錢領出來（出金）前，得先繳訂金、手續費、稅金或保證金
    cues:
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 解凍金
    weight: 3
  - id: high-return-claim
    text: 標榜穩定獲利、保證報酬、賺匯差
    cues:
    - 穩定獲利
    - 保證報酬
    - 高收益
    - 賺匯差
    weight: 2
  final_ask:
  - 買泰達幣（USDT）轉到對方給的錢包或平台。
  - 跟「幣商」面交現金換幣。
  - 出金前先繳訂金、手續費或稅金。
  verify:
  - 到金管會證期局官網「提供虛擬資產服務之事業或人員」專區，查平台或業者有沒有完成洗錢防制登記；沒登記的不得提供服務。
  - 用 165 打詐儀錶板查涉詐網址、問 AI 防詐客服（可以輸入對方的話術或網址），或撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - 合法的虛擬資產服務商不得用現金向客戶收款，必須用能留下金流紀錄的轉帳；要你面交現金的「幣商」不是正規管道。
  - 你自己在已完成登記的業者買賣是正常的；要小心的是，有人叫你把買到的幣轉進他指定的錢包或平台。
  if_already_happened:
  - 立刻停止操作，不要為了拿回本金再繳出金費用。
  - 保留錢包地址、轉帳紀錄與對話，撥 165 或報案；錢還沒被領走前，可以請銀行圈存（先把那筆錢凍結住）。
  prevalence:
    note: 刑事局 110 年上半年統計：網路投資詐騙為最大宗，標的多為虛擬通貨、外匯期貨或博奕遊戲（舊資料，查無近年單獨統計）。
    source_url: https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=7fa6b61e-4a9a-42d7-a72e-2685f578367d
