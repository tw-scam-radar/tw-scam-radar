    publisher: 行政院
    date: '2026-06-01'
    url: https://www.ey.gov.tw/Page/9277F759E41CCD91/b2096cbc-186d-482b-bef1-199e227656fa
    level: L1
    supports:
    - stages
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
    - if_already_happened
  - title: 周董阿妹接力開唱大巨蛋 歹徒「佛心」轉讓門票 假二手真詐騙
    publisher: 台灣英文新聞
