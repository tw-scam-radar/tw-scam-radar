- id: fake-seller
  name: 假網拍賣家：一頁式廣告、超低價商品
  aliases:
  - 假網拍
  - 一頁式廣告詐騙
  - 一頁式詐騙
  - 低價出清詐騙
  category: 網購交易
  summary: 對方假裝成網路商家，用一頁式廣告或社群貼文賣超低價商品；付款後不出貨、寄來劣質品，或丟假賣貨便連結騙你操作網銀。
  status: active
  first_seen: '2019'
  channels:
  - 臉書廣告
  - 臉書
  - IG
  - Threads
  - LINE
  - 簡訊
  - 網站彈窗
  pretend_to_be:
  - 網路商家
  - 粉絲專頁賣家
  - 結束營業出清的店家
  stages:
  - stage: 接觸
    what_you_see: 在臉書、IG、Threads 看到超低價商品廣告或貼文，常寫「限時特價」「倒數」，或說景氣不好、結束營業要出清。
  - stage: 取信
    what_you_see: 頁面標榜免運費、7 天鑑賞期、可拆箱驗貨、貨到付款，底下留言全是好評。
  - stage: 製造情境
    what_you_see: 頁面沒有公司地址和客服電話，只留 email 或要你加 LINE 私下下單；貼文還寫「限量」「最後幾台」催你。
  - stage: 要求行動
    what_you_see: 要你先匯款，或選貨到付款到超商取貨；也有賣家丟來假賣貨便連結，跳出「實名認證失敗」，再叫你加 LINE 客服。
  - stage: 收網後
    what_you_see: 付款後不出貨、聯絡不到人；或開箱才發現是劣質品、跟你下單的東西不一樣。
  opener_examples:
  - 店面結束營業，品牌商品超低價出清，剩最後幾台。
  - 限時特價倒數中，免運、貨到付款、七天鑑賞期。
  - 有興趣私訊加 LINE，直接跟我下單比較快。
  red_flags:
  - id: price-far-below-market
    text: 價格明顯低於市價，或說結束營業低價出清
    cues:
    - 超低價
    - 低於市價
    - 低價出清
    - 結束營業
    weight: 2
  - id: countdown-limited
    text: 用「限時」「倒數」「最後幾台」催你馬上下單
    cues:
    - 限時特價
    - 限時特惠
    - 倒數
    - 限量
    - 最後幾台
    - 剩最後
    weight: 1
  - id: no-company-info
    text: 查不到公司地址和電話，只留電子郵件、LINE 或海外聯絡方式
    cues:
    - 加LINE
    - LINE ID
    - 私訊下單
    - 海外
    weight: 2
  - id: cod-plus-7days
    text: 只能貨到付款或刷卡，再拿「7 天鑑賞期」當誘因
    cues:
    - 貨到付款
    - 7天鑑賞期
    - 七天鑑賞期
    - 可拆箱驗貨
    - 不滿意包退
    weight: 1
  - id: fake-myship-link-warning
    text: 賣家給的交易網頁跳出「實名認證失敗」「訂單異常」「解除分期」
    cues:
    - 實名認證失敗
    - 訂單異常
    - 重新下單
    - 解除分期
    - 解除金流限制
    weight: 3
  - id: otp-qr-request
    text: 「客服」要你提供 OTP、網銀轉帳 QR Code 或操作網銀
    cues:
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    - re:(掃|掃描|拍).{0,6}(qr|條碼).{0,12}(驗證|認證|收款|轉帳|領取|解除|登入|加好友)
    - re:(提供|傳|拍).{0,6}(qr|條碼)
    - re:(網路銀行|網銀).{0,10}(操作|設定|轉帳|驗證(?!碼)|認證(?!碼)|帳號|密碼|帳密)
    - re:(登入|打開).{0,6}(網路銀行|網銀).{0,10}(驗證(?!碼)|認證(?!碼)|按|操作)
    weight: 3
  final_ask:
  - 先把錢匯給賣家，或在超商用貨到付款取貨。
  - 加 LINE「客服」後，提供網銀轉帳 QR Code、信用卡 OTP，或照指示操作網銀轉帳。
  verify:
  - 到經濟部網站查公司名稱、地址等基本資料，確認商家真的存在。
  - 選口碑好、付款會經過平台（第三方支付）、不直接匯給賣家的購物平台，能面交就面交。
  - 看粉專或帳號成立多久、粉絲數和留言是否正常；剛成立、互動很少的要小心。
  - 付款取貨前，再確認一次訂單明細、金額和寄件人資訊。
  - 拿不定就撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - 正規電商也會辦限時特價、提供貨到付款和七天鑑賞期；分辨重點是查不查得到公司資料、客服電話，付款是不是留在平台內。
  - 真的賣貨便或電商平台，不會跟你要 OTP、信用卡驗證碼或網銀 QR Code。
  if_already_happened:
  - 貨到付款買到劣質品，盡快找代收貨款的貨運或超商協助退貨退款，並保留溝通紀錄。
  - 在超商取貨的，取貨後 7 天內提出申訴，保留完整外箱、繳費憑證和包裹單據。
  - 業者沒處理好、又是國內交易，可到「行政院消費者保護會線上申訴系統」申訴；如果是跟國外買的，看消保會網站公告的跨境消費爭議申訴管道。
  - 已經匯款或帳戶被盜領，撥 165 並到警察機關報案。
  prevalence:
    note: 2025 年第 4 季到 2026 年 1 月，假網拍仍是詐騙手法第一名。
    source_url: https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=2ada7b37-da8a-44cf-851e-f0e8efa8240e
  sources:
  - title: 常見詐騙手法話術解析與因應之道－第一章　假網拍詐騙
    publisher: 刑事警察局
    date: ''
    url: https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=7e614f6f-df9b-4ae2-8293-ed384fb1a470
    level: L1
    supports:
    - stages
    - red_flags
    - final_ask
    - verify
  - title: 近年來「一頁式廣告」詐騙業者遍及臉書、入口網站或社群媒體
