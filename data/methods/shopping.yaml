  - 臉書市集詐騙
  category: 網購交易
  summary: 對方在二手社團、Threads 或二手平台假裝要送閒置物、結緣品，說只要付小額運費或用指定賣場寄送，再傳假物流網頁，跳出「需實名驗證」後由假客服騙你操作網銀。
  status: active
  first_seen: '2023'
  channels:
  - 臉書
  - Threads
  - IG
  - 二手平台
  - LINE
  pretend_to_be:
  - 送物的網友
  - 倒閉店家
  - 二手賣家
  - 物流平台客服
  - 銀行專員
  stages:
  - stage: 接觸
    what_you_see: 在臉書、Threads、IG 看到有人要送 iPhone、筆電、媽祖結緣品，或說店家倒閉、多出閒置物品要送，接著轉到 LINE 聯絡。
  - stage: 取信
    what_you_see: 對方說東西免費，只要負擔一點運費，或要你用他指定的賣場寄送。
  - stage: 製造情境
    what_you_see: 對方傳來假的 7-11、全家、嘉里大榮、順豐等物流或賣場網頁，填完資料跳出「系統異常，需實名驗證」「未完成金流簽署」。
  - stage: 要求行動
    what_you_see: 引導你加「官方 LINE 客服」「銀行專員」，說只是驗證程序、不會扣款，要你操作網銀、ATM、無卡提款，或翻拍 QR Code 付款碼。
  - stage: 收網後
    what_you_see: 對方用訊息轟炸，說你操作錯誤害他帳戶凍結，甚至搬出孩子手術費、家暴，逼你繼續轉帳。
  opener_examples:
  - 家裡多出來的吹風機免費送，只要付一點運費。
  - 店面收掉了，庫存免費送，留言加 LINE 登記。
  - 系統顯示你要先完成實名驗證，才能寄出贈品。
  red_flags:
  - id: free-gift-pay-shipping
    text: 說東西免費送，只要你付小額運費
    cues:
    - 免費贈送
    - re:(免費送|免費贈送|閒置).{0,20}(運費|郵資|保證金|手續費|物流費)
    - 負擔運費
    - 小額運費
    - 結緣品
    weight: 2
  - id: fake-logistics-warning
    text: 物流或賣場網頁跳出「需實名驗證」「未開通金流服務」「未完成金流簽署」
    cues:
    - 需實名驗證
    - 未開通金流服務
    - 未完成金流簽署
    - 實名制認證
    - 系統異常
    weight: 3
  - id: verify-no-charge
    text: 說「只是驗證程序、不會扣款」，或要做「餘額驗證」
    cues:
    - 不會扣款
    - 驗證程序
    - 餘額驗證
    - 扣款出錯
    weight: 3
  - id: fake-official-line
    text: 要你加「官方 LINE 客服」或「銀行專員」的 LINE
    cues:
    - 官方LINE客服
    - LINE客服
    - 銀行專員
    - 加LINE
    weight: 2
  - id: account-frozen-guilt
    text: 說你害他帳戶凍結，或搬出手術費、家暴施壓
    cues:
    - 帳戶違規遭凍結
    - 帳戶凍結
    - 手術費
    - 家暴
    weight: 2
  - id: qr-or-cardless
    text: 要你翻拍 QR Code 付款碼，或去做無卡提款
    cues:
    - 無卡提款
    - 付款碼
    - re:(掃|掃描|拍).{0,6}(qr|條碼).{0,12}(驗證|認證|收款|轉帳|領取|解除|登入|加好友)
    - re:(提供|傳|拍).{0,6}(qr|條碼)
    - 翻拍
    weight: 3
  final_ask:
  - 照假客服指示操作網銀、ATM 或無卡提款，把錢轉進指定帳戶。
  - 翻拍 QR Code 付款碼傳給對方，或提供帳戶資料。
  verify:
  - 不點陌生網址；自己打開 7-11 賣貨便、全家好賣+的官方網站或 App，確認交易網頁是真的。
  - 賣貨便不需要實名認證、金流簽署；真客服不會加 LINE，也不會開視訊。
  - 撥 165 反詐騙諮詢專線查證。
  safe_lookalikes:
  - 真心送東西的人不會要你在網頁上做「實名驗證」或「開通金流」；一出現這類要求就該停。
  - 賣貨便首次登入只會寄認證信確認電子郵件，在官方網站內完成，不需要轉帳。
  if_already_happened:
  - 停止轉帳，帶著對話紀錄和轉帳資料到附近警察機關報案。
  - 撥 165 反詐騙諮詢專線。
  prevalence:
    note: 2023 年第 3 季刑事局統計的高風險賣場中，旋轉拍賣 720 件排第 2，臉書 Marketplace 168 件排第 4。
    source_url: https://www.cna.com.tw/news/asoc/202311130156.aspx
  sources:
