  category: 網購交易
  summary: 對方假裝成要轉讓門票的粉絲或代購，要你先匯款「保留」票，或丟假售票網站、假客服要你驗證金流，收了錢就封鎖。
  status: active
  first_seen: '2024'
  channels:
  - 臉書
  - Threads
  - LINE
  pretend_to_be:
  - 粉絲
  - 代購
  - 售票平台客服
  - 官方售票網站
  stages:
  - stage: 接觸
    what_you_see: 熱門演唱會開賣後，在臉書「求票、讓票、換票、代購」社團或 Threads 看到有人用原價或「佛心」價讓票。
  - stage: 取信
    what_you_see: 對方主動傳身分證、交易截圖給你看，強調「誠信」。
  - stage: 製造情境
    what_you_see: 說要先匯款才能「保留優先購票權」；或說你「無法下單」要找客服，客服再說「金流驗證沒辦法通過」、要做身分證簽署。
  - stage: 要求行動
    what_you_see: 催你快付錢，不然就買不到；或要你在假售票網站登入網銀，提供 OTP 驗證碼、QR Code 付款碼。
  - stage: 收網後
    what_you_see: 匯款後對方封鎖、刪帳號；或拿到的是複製別人 QR Code 的假票，到場才發現票已經被用過。
  opener_examples:
  - 臨時不能去，原價讓票，先匯款幫你保留。
  - 你那邊無法下單的話，要聯絡客服做金流驗證。
  - 我可以先給你看身分證，交易講誠信。
  red_flags:
  - id: pay-to-hold-ticket
    text: 要你先匯款才能「保留」票或「優先購票權」
    cues:
    - 保留優先購票權
    - 先匯款
    - 保留票
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    weight: 2
  - id: private-resale
    text: 在社團或私訊讓票、代購，不走官方授權平台
    cues:
    - 讓票
    - 轉讓
    - 代購
    - 原價讓
    - 佛心
    weight: 1
  - id: cashflow-verification
    text: 說你「無法下單」，要你找客服做金流驗證或身分證簽署
    cues:
    - 金流驗證
    - 身分證簽署
    - 無法下單
    - 聯絡客服
    weight: 3
  - id: otp-qr-request
    text: 要你提供 OTP 驗證碼或 QR Code 付款碼
    cues:
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    - 付款碼
    - QR-Code
    - re:(掃|掃描|拍).{0,6}(qr|條碼).{0,12}(驗證|認證|收款|轉帳|領取|解除|登入|加好友)
    - re:(提供|傳|拍).{0,6}(qr|條碼)
    weight: 3
  - id: id-card-as-proof
    text: 主動傳身分證、交易截圖來取信
    cues:
    - re:(拍|上傳|傳|提供|寄|拍照).{0,6}(身分證|證件)
    - re:(身分證|證件).{0,6}(正反面|拍給|傳給)
    - 交易截圖
    - 誠信
    weight: 1
  - id: qr-photo-ticket
    text: 賣家只給票券照片或 QR Code，條碼可能是從別人打卡照複製的
    cues:
    - re:(掃|掃描|拍).{0,6}(qr|條碼).{0,12}(驗證|認證|收款|轉帳|領取|解除|登入|加好友)
    - re:(提供|傳|拍).{0,6}(qr|條碼)
    - 票券照片
    - 電子票
    weight: 1
  final_ask:
  - 先把票款匯到對方個人帳戶。
  - 在假售票網站輸入帳號、網銀資料，或交出 OTP 驗證碼、QR Code 付款碼。
  verify:
  - 優先在官方授權的售票平台買票，或面交當場確認。
  - 對照售票平台公告的取票日期；票明明還不能取，賣家卻要你先付錢，就要警覺。
  - 撥 165 反詐騙諮詢專線查證；黃牛加價轉售可到文化部或運動部的黃牛檢舉專區檢舉。
  safe_lookalikes:
  - 在官方授權售票平台買票，付款都在平台內完成；要你轉去私人客服或 LINE 做「金流驗證」的，不是官方流程。
  - 朋友間原價轉讓很常見；能面交、當場確認票券再付款，風險低很多。
  if_already_happened:
  - 保留交易過程、對話紀錄和匯款資料，撥 165 或到警察機關報案。
  - 消費爭議可打消費者服務專線 1950，或上「行政院消費者保護會線上申訴系統」申訴。
  prevalence:
    note: 台北市 2024 年截至 8 月，受理演唱會購票相關詐騙報案 376 件。
    source_url: https://www.taiwannews.com.tw/zh/news/5943878
  sources:
