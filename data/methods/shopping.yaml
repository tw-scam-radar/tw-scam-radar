- id: fake-group-buy
  name: 假代購、假團購、假預購
  aliases:
  - 代購詐騙
  - 團購詐騙
  - 預購詐騙
  category: 網購交易
  summary: 對方假裝成代購或團購主，用低價商品吸引你，前幾次真的出貨取信，再要你先付全額，收款後用缺貨、物流延遲拖延，最後失聯。
  status: active
  first_seen: '2017'
  channels:
  - 臉書
  - LINE 群組
  - LINE
  - 網購平台
  - 其他
  pretend_to_be:
  - 代購
  - 團購主
  - 粉絲專頁賣家
  stages:
  - stage: 接觸
    what_you_see: 在粉絲專頁、社團或拍賣網站看到低價代購或團購，價格比市價低很多，接著被拉進 LINE 群組。
  - stage: 取信
    what_you_see: 前幾次真的有出貨，讓你覺得可以信任。
  - stage: 製造情境
    what_you_see: 群組一直貼低價商品，接著要你一次付全額、先匯款才出貨。
  - stage: 要求行動
    what_you_see: 透過 LINE 要你先把錢匯過去。
  - stage: 收網後
    what_you_see: 收款後一直說物流比較慢、缺貨、上游廠商捲款；你要求退款，對方就斷聯。
  opener_examples:
  - 日本家電代購，價格比市價便宜很多，私訊下單。
  - 群組今天開團，全額匯款後統一出貨。
  - 這批貨物運送延遲，再等幾天就到。
  red_flags:
  - id: full-prepay
    text: 要你先付全額才出貨
    cues:
    - 先匯款
    - 全額
    - 先付款
    - 匯款後出貨
    weight: 2
  - id: delay-excuses
    text: 收款後一再用運送延遲、缺貨、廠商出包等理由拖延
    cues:
    - 運送延遲
    - 缺貨
    - 物流較慢
    - 檔期
    - 廠商捲款
    weight: 2
  - id: far-below-market
    text: 價格遠低於市價
    cues:
    - 低於市價
    - 超低價
    - 代購價
    weight: 1
  - id: dm-or-group-purchase
    text: 在社團、私訊或 LINE 群組代購、揪團，不走有交易保障的平台
    cues:
    - 代購
    - 團購
    - re:私訊.{0,8}(交易|下單|匯款|付款|line|賴)
    - LINE群組
    weight: 1
  final_ask:
  - 先把全額貨款匯到對方帳戶。
  verify:
  - 用可信賴的第三方支付平台交易（錢先經過平台），不直接匯款給個人。
  - 選口碑好、合法授權的賣場平台；價格便宜得不正常，就先停下來查證。
  - 撥 165 反詐騙諮詢專線，或上 165 全民防騙網查。
  safe_lookalikes:
  - 正常的團購、代購若透過有第三方支付的平台付款，出貨延遲還有平台可申訴；只收個人匯款的就少了這層保障。
  if_already_happened:
  - 撥 165 反詐騙諮詢專線諮詢或報案。
  prevalence:
    note: ''
    source_url: ''
  sources:
