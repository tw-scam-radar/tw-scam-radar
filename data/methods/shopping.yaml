- id: fake-charity
  name: 假募款：假慈善、假災難捐款
  aliases:
  - 假募款
  - 假捐款
  - 賑災詐騙
  - 假冒公益團體
  category: 網購交易
  summary: 對方假冒政府或慈善團體，在災後用簡訊、假網站、社群貼文要你捐款，或要你先做「網路身分認證」，最後騙你交出帳號密碼、操作網銀或 ATM。
  status: active
  first_seen: '2022'
  channels:
  - 簡訊
  - 臉書
  - LINE
  - IG
  - Threads
  - 電子郵件
  - 電話
  pretend_to_be:
  - 政府單位
  - 慈善團體
  - 公益團體
  - 捐款客服
  stages:
  - stage: 接觸
    what_you_see: 重大災害後，收到附連結的募款簡訊，或在臉書、LINE、IG、Threads 看到募款貼文、影片。
  - stage: 取信
    what_you_see: 對方用政府或慈善團體的名義，或沿用過去災害的募款名稱。
  - stage: 製造情境
    what_you_see: 說捐款前要先做「網路身分認證」「網路金流認證」；或打電話說你以前的捐款「預設扣款設定錯誤」。
  - stage: 要求行動
    what_you_see: 要你匯到不是官方指定的帳戶，或提供個資、銀行帳號密碼，再由「客服」指示你操作網銀或 ATM。
  - stage: 收網後
    what_you_see: 錢被轉走，對方聯絡不上。
  opener_examples:
  - 災區急需物資，點連結就能線上捐款。
  - 捐款前請先完成網路身分認證。
  - 您之前的捐款扣款設定有誤，需要到 ATM 解除。
  red_flags:
  - id: verification-before-donation
    text: 捐款前要你先做「網路身分認證」或「網路金流認證」
    cues:
    - 網路身分認證
    - 網路金流認證
    - 身分認證
    - 金流認證
    weight: 3
  - id: donation-setting-error
    text: 打電話說捐款扣款設定錯誤，要你去 ATM 處理
    cues:
    - 扣款設定錯誤
    - 設定錯誤
    - 解除分期
    - re:(到|去|前往|找|最近的).{0,6}(atm|提款機)
    - re:(atm|提款機).{0,10}(操作|解除|設定|認證|退費|退款|按|輸入)
    weight: 3
  - id: non-official-account
    text: 要你匯到不是官方公布的法人或個人帳戶
    cues:
    - 個人帳戶
    - 私人帳戶
    - 指定帳戶
    weight: 2
  - id: asks-bank-password
    text: 要你提供個資、銀行帳號和密碼
    cues:
    - re:(提供|告訴|給|傳|寫下|報).{0,6}(密碼|帳密)
    - re:(密碼|帳密).{0,6}(給我|告訴我|傳給|寫給|一起寄)
    - 帳號密碼
    - re:(網路銀行|網銀).{0,10}(操作|設定|轉帳|驗證(?!碼)|認證(?!碼)|帳號|密碼|帳密)
    - re:(登入|打開).{0,6}(網路銀行|網銀).{0,10}(驗證(?!碼)|認證(?!碼)|按|操作)
    weight: 3
  - id: link-donation-message
    text: 簡訊或貼文附連結叫你捐款
    cues:
    - 捐款
    - 募款
    - 賑災
    - 愛心
    weight: 1
  final_ask:
  - 匯款到不是官方指定的帳戶。
  - 提供個資、銀行帳號和密碼，或照「客服」指示操作網銀、ATM。
  verify:
  - 捐款認明官方公布的管道；不確定就主動問衛福部、縣市政府、鄉鎮市區公所或社福機構。
  - 到衛福部公益勸募管理系統，查募款團體有沒有取得許可、勸募期間是否還有效。
  - 收到可疑簡訊或捐款帳號，撥 165 求證，或上數位發展部的網路詐騙通報查詢網查詢。
  safe_lookalikes:
  - 政府真的會公布賑災專戶，提供匯款、LINE Pay、超商機台等管道；以官方網站公告為準，不要只照一則簡訊行動。
  if_already_happened:
  - 撥 165 反詐騙諮詢專線說明狀況。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 花蓮賑災防詐騙 行政院：捐款認明官方管道，慎防假網站、假簡訊
    publisher: 行政院
    date: '2025-09-25'
    url: https://www.ey.gov.tw/Page/9277F759E41CCD91/c3d0e406-02a4-4d6c-b02e-1540e4039603
    level: L1
    supports:
