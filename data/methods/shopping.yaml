- id: ghost-parcel
  name: 幽靈包裹：沒訂的東西叫你貨到付款
  aliases:
  - 幽靈包裹
  - 超商包裹詐騙
  - 貨到付款包裹詐騙
  category: 網購交易
  summary: 你根本沒下單，詐團卻把包裹寄到超商，再傳簡訊通知取貨付款，讓你以為是家人代訂，付錢領走劣質品。
  status: active
  first_seen: '2024'
  channels:
  - 簡訊
  - 實體
  pretend_to_be:
  - 網路賣家
  - 超商取貨通知
  stages:
  - stage: 接觸
    what_you_see: 收到簡訊說網購商品已送達超商，要你去取貨付款。
  - stage: 製造情境
    what_you_see: 你一時不確定有沒有買，以為是家人或朋友幫忙訂的。
  - stage: 要求行動
    what_you_see: 到超商付一千多元把包裹領走。
  - stage: 收網後
    what_you_see: 打開才發現是防曬霜、不明化妝品之類，問遍家人朋友都沒人買。
  opener_examples:
  - 您的網購商品已送達超商，請攜帶款項取貨。
  red_flags:
  - id: pickup-sms-not-ordered
    text: 收到取貨付款通知，但你想不起來自己有下單
    cues:
    - 已送達超商
    - 取貨付款
    - 貨到付款
    - 到店取貨
    weight: 1
  final_ask:
  - 到超商付款取貨。
  verify:
  - 取貨前先查自己的購物紀錄、問家人有沒有代訂；沒訂就拒收。
  - 看包裹上的寄件人資料，查查看是不是真的。
  - 分不出真假，可用警政服務 App 的「可疑訊息分析」，或撥 165。
  safe_lookalikes:
  - 自己或家人真的網購時，也會收到幾乎一樣的到店取貨簡訊；差別是查得到訂單紀錄。
  if_already_happened:
  - 取貨後 7 天內，透過超商線上申訴平台或客服中心申請退款、退貨。
  - 保留完整外箱、繳費憑證和包裹單據，方便超商和貨運追寄件人。
  - 撥 165 反詐騙諮詢專線求助。
  prevalence:
    note: 2025 年 9 月網路購物詐騙報案 3,625 件，居各類詐騙之首；刑事局把超商包裹詐騙分成一頁式廣告和幽靈包裹兩類。
    source_url: https://www.ey.gov.tw/File/D59ECD63187B0F44
  sources:
  - title: 收貨可以，受騙不行 刑事局呼籲警覺「超商包裹詐騙」陷阱（新聞資料）
    publisher: 刑事警察局
    date: 2025-10
    url: https://www.ey.gov.tw/File/D59ECD63187B0F44
