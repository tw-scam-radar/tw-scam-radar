- id: game-trade
  name: 遊戲交易：虛寶、帳號、遊戲點數
  aliases:
  - 遊戲帳號詐騙
  - 虛寶詐騙
  - 遊戲點數詐騙
  - 假遊戲交易平台
  category: 網購交易
  summary: 對方假裝成要買或賣遊戲帳號、虛寶的玩家，把你帶到假交易網站，再由假客服說帳號凍結要付保證金，或要你先用遊戲點數付款，拿到就失聯。
  status: active
  first_seen: '2020'
  channels:
  - 臉書
  - LINE
  - 其他
  pretend_to_be:
  - 玩家
  - 遊戲交易平台客服
  - 遊戲官方客服
  stages:
  - stage: 接觸
    what_you_see: 在遊戲裡、遊戲社團或私訊遇到有人高價收購你的帳號或寶物，或看到貼文便宜出售高階帳號、虛寶。
  - stage: 取信
    what_you_see: 對方要你改用 LINE 聯絡，推薦一個「交易網站」，或自稱官方的客服中心。
  - stage: 製造情境
    what_you_see: 在那個網站交易時，「客服」說你操作錯誤、帳號被凍結，要先付保證金或儲值才能解鎖。
  - stage: 要求行動
    what_you_see: 要你匯款，或買遊戲點數卡、拍照傳序號給他。
  - stage: 收網後
    what_you_see: 付了一次又要你再付保證金；或拿到點數序號後立刻失聯。
  opener_examples:
  - 你的帳號我出高價收，到交易網站上交易比較安全。
  - 便宜出售高階帳號，先用遊戲點數付款當保證。
  - 客服說你的遊戲帳號已遭凍結，要先儲值才能解鎖。
  red_flags:
  - id: unknown-trade-site
    text: 對方指定你到某個「交易網站」或「客服中心」交易
    cues:
    - 交易網站
    - 交易平台
    - re:(加|聯繫|聯絡|私訊).{0,6}(客服|專員|助理).{0,6}(line|賴|telegram|whatsapp)
    - re:(line|賴).{0,4}(客服|專員)
    weight: 2
  - id: frozen-pay-deposit
    text: 說帳號凍結，要付保證金、儲值才能解鎖
    cues:
    - 凍結
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 儲值解鎖
    - 解凍
    - 解鎖
    weight: 3
  - id: points-as-payment
    text: 要你用遊戲點數付款、當保證，或拍點數序號給他
    cues:
    - 遊戲點數
    - 點數卡
    - 序號
    - 先用點數
    weight: 3
  - id: high-price-buyout
    text: 主動高價收購帳號、寶物，或保證「官方買回」賺差價
    cues:
    - 高價收購
    - 官方買回
    - 收購帳號
    - 賺差價
    weight: 2
  - id: cheap-account
    text: 便宜出售高階帳號或虛寶
    cues:
    - 便宜出售
    - 高階帳號
    - 低價出售
    - 虛寶
    weight: 1
  final_ask:
  - 匯款，或買遊戲點數卡、把序號傳給對方。
  - 為了「解凍」一次又一次付保證金。
  verify:
  - 遊戲點數只能用來儲值遊戲；要你用點數付款、「解鎖」或「驗證」的都是詐騙。
  - 不私下買賣帳號和虛寶；官方不處理私下交易的糾紛。
  - 對方推薦的交易平台，把網址丟進搜尋引擎查；只有零星結果的，很可能是假網站。
  - 有疑問先問遊戲官方客服，或撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - 遊戲內建的交易功能或官方公告的交易方式是正常的；以遊戲官網或遊戲內公告為準，不信社群或私訊裡的連結。
  if_already_happened:
  - 遊戲點數交易無法取消，馬上停止再付款，撥 165 反詐騙諮詢專線。
  prevalence:
    note: ''
    source_url: ''
  sources:
