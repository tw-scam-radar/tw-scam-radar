- id: fake-rental
  name: 假租屋：先付訂金才能看房
  aliases:
  - 租屋詐騙
  - 假房東
  - 看房費詐騙
  category: 網購交易
  summary: 對方假裝成房東，用低於行情的漂亮房子吸引你，要你先付訂金或押金才能看房，或說要寄鑰匙讓你自己看，再用假物流網頁騙你操作網銀、買遊戲點數。
  status: active
  first_seen: '2024'
  channels:
  - 臉書
  - Threads
  - LINE
  pretend_to_be:
  - 房東
  - 屋主
  - 超商物流客服
  stages:
  - stage: 接觸
    what_you_see: 在臉書、Threads 看到租金低於行情、裝潢漂亮的出租貼文，有的還寫附車位、可申請租補。
  - stage: 取信
    what_you_see: 「房東」說人在外地不方便帶看，要用超商物流寄鑰匙給你自己去看。
  - stage: 製造情境
    what_you_see: 說要先付訂金才能看房或保留房子；或傳來仿冒超商物流的連結，填完資料跳出「未實名認證」，再叫你找客服。
  - stage: 要求行動
    what_you_see: 要你轉帳付訂金、押金，或為了「解除驗證」去匯款、買遊戲點數。
  - stage: 收網後
    what_you_see: 轉帳後對方各種推託，接著刪掉通訊軟體帳號；你連他的真名、地址都不知道。
  opener_examples:
  - 我人在外地不方便帶看，鑰匙用超商寄給你自己看。
  - 想看房要先付訂金保留，不然很快就租出去了。
  - 全新裝潢、附車位，租金比行情便宜，可申請租補。
  red_flags:
  - id: deposit-before-viewing
    text: 還沒看到房子，就要你付訂金、看房費或保留費
    cues:
    - 先付訂金
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 看房費
    - 保留費
    - 押金
    weight: 3
  - id: landlord-away-mail-key
    text: 房東說人在外地，用寄鑰匙代替帶看
    cues:
    - 人在外地
    - 寄鑰匙
    - 不方便帶看
    - 自己看房
    weight: 2
  - id: fake-logistics-verification
    text: 寄鑰匙的物流連結跳出「未實名認證」，要你找客服處理
    cues:
    - 未實名認證
    - 實名認證
    - 解除驗證
    - 帳戶認證
    weight: 3
  - id: game-points-for-verification
    text: 要你買遊戲點數來做認證
    cues:
    - 遊戲點數
    - re:(買|購買|儲值|超商).{0,6}點數.{0,12}(驗證|認證|擔保|保證|解鎖|序號|卡號)
    - re:點數.{0,6}(序號|卡號|密碼).{0,6}(給|傳|拍)
    - 序號
    weight: 3
  - id: below-market-rent
    text: 租金比行情低兩三成、照片漂亮得不像真的
    cues:
    - 低於行情
    - 附車位
    - 可申請租補
    - 全新裝潢
    weight: 1
  final_ask:
  - 轉帳付訂金、押金或預付兩個月租金。
  - 照假客服指示操作網銀匯款，或買遊戲點數「解除驗證」。
  verify:
  - 沒親眼看到房子前不付任何錢；簽約前，不把錢交給自稱房東的網友。
  - 確認對方是房屋所有權人：核對房屋稅單、權狀和屋主身分證；代理人要有授權書，二房東要有出租人同意轉租的書面文件。
  - 找合法租賃住宅服務業者或仲介，可到地政機關的租賃住宅服務查詢系統查登記證。
  - 撥 165 反詐騙諮詢專線查證，或直接報警。
  safe_lookalikes:
  - 正常房東也會收訂金，但會在你看過房、核對過身分後收，開收據，並匯到屋主本人帳戶。
  if_already_happened:
  - 撥 165 反詐騙諮詢專線，或直接報警。
  prevalence:
    note: ''
    source_url: ''
  sources:
