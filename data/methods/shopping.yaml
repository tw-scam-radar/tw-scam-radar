- id: fake-buyer
  name: 假買家：要你開賣貨便、簽金流協議
  aliases:
  - 假買家詐騙
  - 賣貨便詐騙
  - 金流驗證詐騙
  - 實名認證詐騙
  category: 網購交易
  summary: 對方假裝想買你東西，要你開超商賣貨便等交易連結，再說訂單被凍結、丟假客服連結，最後要你操作網銀，或交出 OTP、網銀轉帳 QR Code。
  status: active
  first_seen: '2023'
  channels:
  - 臉書
  - IG
  - Threads
  - LINE
  - 二手平台
  pretend_to_be:
  - 買家
  - 7-11 賣貨便客服
  - 全家好賣+客服
  - 銀行專員
  stages:
  - stage: 接觸
    what_you_see: 你在臉書、IG、Threads 或拍賣平台賣東西，有人私訊說想買，接著要你改加 LINE 聊。
  - stage: 取信
    what_you_see: 對方說為了「交易保障」，要你在 7-11 賣貨便或全家好賣+開一個賣場連結給他下單。
  - stage: 製造情境
    what_you_see: 你給了連結，對方說「無法下單」「訂單遭凍結」，傳來客服連結或 QR Code；「客服」說你「尚未完成身份驗證」「未簽署金流協議」。
  - stage: 要求行動
    what_you_see: 假客服或自稱銀行「簽署專員」的人，要你打開網銀照指示輸入數字，或提供網銀轉帳 QR Code、信用卡 OTP，或去做無卡提款。
  - stage: 收網後
    what_you_see: 假買家一直催，說他的帳戶也被凍結，甚至搬出孩子要開刀；你照做後才發現那些「驗證」其實都是轉帳。
  opener_examples:
  - 請問還有貨嗎？用賣貨便下單比較有保障，開個賣場給我。
  - 我這邊顯示無法下單，你是不是還沒做實名認證？
  - 客服說你要先簽署金流協議，訂單才能解凍。
  red_flags:
  - id: unable-to-order-cs-link
    text: 買家說「無法下單」「訂單凍結」，丟客服連結或 QR Code 要你處理
    cues:
    - 無法下單
    - 訂單遭凍結
    - 訂單凍結
    - 客服連結
    - 聯繫客服
    weight: 2
  - id: sign-cashflow-agreement
    text: 要你「簽署金流協議」、做「實名認證」或「升級賣場」才能交易
    cues:
    - 金流協議
    - 金流簽署
    - 簽署金流
    - 實名認證
    - 實名驗證
    - 賣場升級
    weight: 3
  - id: otp-qr-request
    text: 要你提供 OTP 驗證碼、網銀轉帳 QR Code 或付款碼
    cues:
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    - re:(掃|掃描|拍).{0,6}(qr|條碼).{0,12}(驗證|認證|收款|轉帳|領取|解除|登入|加好友)
    - re:(提供|傳|拍).{0,6}(qr|條碼)
    - 付款碼
    weight: 3
  - id: bank-officer-guided-transfer
    text: 自稱「銀行專員」「簽署專員」的人，要你開網銀或去無卡提款照指示操作
    cues:
    - 銀行專員
    - 簽署專員
    - re:(網路銀行|網銀).{0,10}(操作|設定|轉帳|驗證(?!碼)|認證(?!碼)|帳號|密碼|帳密)
    - re:(登入|打開).{0,6}(網路銀行|網銀).{0,10}(驗證(?!碼)|認證(?!碼)|按|操作)
    - 無卡提款
    weight: 3
  - id: cs-adds-line-or-video
    text: 「客服」要你加 LINE 好友，或要跟你開視訊
    cues:
    - 加LINE
    - LINE客服
    - 官方LINE
    - re:(客服|專員|檢察官|警察|法官).{0,10}視訊
    - re:視訊.{0,6}(筆錄|認證|驗證|驗資)
    weight: 2
  - id: emotional-pressure
    text: 買家說你害他帳戶被凍結，或搬出孩子手術費、家暴來催你
    cues:
    - 帳戶被凍結
    - 帳戶遭凍結
    - 手術費
    - 家暴
    weight: 2
  - id: financial-institution-certify
    weight: 3
    text: 說要「全權委託金融機構」幫你認證、簽署交易安全協議
    cues:
    - 全權委託金融機構
    - 交易安全協議
    - 認證簽署
    - 三大保障
    - re:金融機構.{0,10}(認證|簽署|授權|致電)
  final_ask:
  - 照假客服或假專員指示操作網路銀行，把金額欄填成對方說的「驗證碼」，實際上是轉帳。
  - 提供網銀轉帳 QR Code、信用卡 OTP 驗證碼、存摺照片或帳戶資料。
  - 到 ATM 做無卡提款，或把錢匯到對方說的「指定帳戶」。
  verify:
  - 賣貨便不需要實名認證，也沒有「金流簽署」；訂單有問題，自己打開官方 App 或網站查，不點對方給的連結。
  - 真的客服不會加 LINE，更不會開視訊。
  - 撥 165 反詐騙諮詢專線，或上 165 打詐儀錶板詢問。
  safe_lookalikes:
  - 真買家也會問「可以用賣貨便嗎」，但他會自己在賣場下單付款，不會叫你去找客服、簽協議或驗證帳戶。
  - 賣貨便首次登入確實會寄認證信，要你輸入驗證碼確認電子郵件；這在官方網站內完成，不需要轉帳或給銀行驗證碼。
  if_already_happened:
  - 撥 165 反詐騙諮詢專線，或上 165 打詐儀錶板諮詢。
  - 帶著對話紀錄、轉帳紀錄等證據，到附近警察機關報案。
  prevalence:
    note: 2026 年 1–2 月網路購物詐騙報案 6,735 件；民眾指出遭冒用平台的 3,577 件裡，冒用 7-11 賣貨便的有 2,656 件。
    source_url: https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=ee5bec9e-7635-45d9-9573-359b98293796
  sources:
  - title: 超商寄貨竟成詐騙溫床 假買家詐騙劇本全公開
    publisher: 刑事警察局
    date: '2026-03-17'
