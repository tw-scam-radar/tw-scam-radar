- id: triangle-scam
  name: 三方詐騙：你的帳戶被拿去收別人的錢
  aliases:
  - 三方詐騙
  - 第三方詐騙
  category: 網購交易
  summary: 詐團同時假冒買家和賣家，讓另一位被害人把錢匯進你的帳戶；你以為是買家付款就出貨或退款，結果東西被騙走，帳戶還被列為警示帳戶。
  status: active
  first_seen: '2019'
  channels:
  - 臉書
  - LINE
  pretend_to_be:
  - 買家
  - 賣家
  stages:
  - stage: 接觸
    what_you_see: 有人向你下單買東西（例如手機），要你給帳戶收款。
  - stage: 取信
    what_you_see: 很快有一筆錢匯進你的帳戶，你以為是買家付的。
  - stage: 製造情境
    what_you_see: 其實那筆錢是另一位被害人在詐團的假粉專買東西時，被給了你的帳戶去匯款。
  - stage: 要求行動
    what_you_see: 你照常出貨；也有人說系統出錯，要你提供帳戶「退款」。
  - stage: 收網後
    what_you_see: 被害人收不到貨去報案，你的帳戶被列警示、凍結，已出的貨也追不回來。
  opener_examples:
  - 東西我要了，給我帳號，錢馬上匯給你。
  - 剛剛系統出錯沒扣到，給我你的帳號，我退錢給你。
  red_flags:
  - id: asks-account-in-dm
    text: 在私訊交易，對方直接要你的銀行帳號收款
    cues:
    - 給我帳號
    - 銀行帳號
    - 匯款帳號
    - 你的帳戶
    weight: 1
  - id: refund-to-your-account
    text: 說系統出錯要退款給你，跟你要帳號
    cues:
    - 退款
    - 退錢
    - 系統錯誤
    - 系統出錯
    weight: 2
  - id: unknown-payer
    text: 匯進來的錢查不出是不是你的買家付的
    cues:
    - 已匯款
    - 轉帳截圖
    - 匯款人
    weight: 1
  final_ask:
  - 提供你的銀行帳號收款，收到錢後出貨或把錢轉出去。
  verify:
  - 避免在社群私訊交易，不輕易把個人帳號給別人。
  - 收下別人的匯款前，先確認款項來源，確定匯款的人就是跟你交易的人。
  - 買賣盡量走官方購物管道或面交。
  safe_lookalikes:
  - 正常買家也會轉帳給你；確認匯款人跟你交易的人對得上，再出貨。
  if_already_happened:
  - 帳戶被列警示時，保留交易過程、對話紀錄和相關資料，向警方說明你也是被害人。
  - 如果是三方詐騙這類特殊情況，可以準備好司法文書、對話紀錄、交易資料，到負責你這個案子的警察分局（管轄分局）申請解除警示帳戶。
  - 能和其他被害人共同簽和解書，也有助加快解除警示。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 第三方詐騙橫行　無辜賣家成金流工具、帳戶遭凍結
    publisher: TVBS新聞網
    date: '2026-02-16'
    url: https://news.tvbs.com.tw/life/3075354
    level: L2
    supports:
    - stages
    - opener_examples
    - final_ask
    - verify
    - if_already_happened
