    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
    - if_already_happened
  - title: 【海外求職要注意　高薪徵才不可信】外交部加強防詐宣導，提醒國人慎防海外求職詐騙
    publisher: 外交部領事事務局
    date: '2025-03-06'
    url: https://www.boca.gov.tw/cp-56-7771-0dbec-1.html
