- id: job-overseas
  name: 假求職：海外高薪輕鬆工作，實際送往詐騙園區
  aliases:
  - 海外求職詐騙
  - 海外求職陷阱
  - 出國高薪打工
  category: 求職打工
  summary: 陌生人甚至朋友以高薪、免經驗、免費旅遊為由，邀你出國工作、幫忙賣貨或做直播；面試時被要求開戶、交出帳戶，到了當地行動被控制，甚至遭人口販運。
  status: active
  first_seen: ''
  channels:
  - 交友軟體
  - 其他
  pretend_to_be:
  - 海外公司招募者
  - 朋友
  stages:
  - stage: 接觸
    what_you_see: 在社群網站或交友軟體看到「出國高薪打工」廣告，或有朋友邀你出國工作、帶貨、做直播。
  - stage: 製造情境
    what_you_see: 對方強調薪水高、免經驗，還能免費旅遊。
  - stage: 要求行動
    what_you_see: 面試時被帶去銀行開戶、設定約定轉帳和網路銀行，或要你簽約出借帳戶、領每日報酬。
  - stage: 收網後
    what_you_see: 被控制人身自由、拘禁在民宅或旅館，或到了海外被迫從事不法工作、遭人口販運。
  opener_examples:
  - 海外缺人，薪水高、免經驗，還能順便免費旅遊。
  - 出國做直播帶貨，輕鬆就有高收入，朋友都去了。
  red_flags:
  - id: overseas-high-pay
    text: 出國工作卻主打高薪、免經驗
    cues:
    - 出國高薪
    - 海外工作
    - re:高薪.{0,10}(免經驗|輕鬆|日領|出國|海外|在家)
    - re:免經驗.{0,10}(高薪|日領|月入|輕鬆)
    weight: 2
  - id: free-travel-lure
    text: 說工作還附免費旅遊
    cues:
    - 免費旅遊
    - 免費出國
    weight: 2
  - id: overseas-livestream-selling
    text: 邀你出國幫忙賣貨或做直播
    cues:
    - re:(出國|海外|柬埔寨|緬甸|泰國|杜拜).{0,10}(直播|帶貨)
    - 海外直播
    weight: 2
  - id: bank-setup-at-interview
    text: 面試就要你開戶、設定約定轉帳、網路銀行，或簽約出借帳戶
    cues:
    - 約定轉帳
    - re:(網路銀行|網銀).{0,10}(操作|設定|轉帳|驗證(?!碼)|認證(?!碼)|帳號|密碼|帳密)
    - re:(登入|打開).{0,6}(網路銀行|網銀).{0,10}(驗證(?!碼)|認證(?!碼)|按|操作)
    - re:(帶你|陪你|幫你|去|要你|請你).{0,6}開戶
    - re:開戶.{0,10}(交給|給我|寄|提供)
    - 出借帳戶
    - 每日報酬
    weight: 3
  final_ask:
  - 跟著對方出國工作，或在面試時申辦、交出銀行帳戶與網路銀行帳密。
  verify:
  - 出國工作前，先看外交部網站「海外求職陷阱宣導專區」。
  - 對網路上徵才的公司多查、多問、多存疑，可以打電話過去確認是不是真的；面試前先跟家人朋友說你要去哪裡，覺得有問題的契約不要簽。
  - 出國前完成「出國登錄」，並下載「旅外安全指南」App。
  safe_lookalikes:
  - 合法公司徵才不會只靠網路訊息貼文，更不會用私人帳號發訊息找你。
  if_already_happened:
  - 人在海外受困，向我國駐外館處（大使館、代表處或辦事處）求助；國內親友可先向警察局報案，再撥外交部緊急聯絡中心免付費專線 0800-085-095。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 常見詐騙手法話術解析與因應之道－第七章　假求職
    publisher: 刑事警察局
    date: ''
    url: https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=87a85079-c42f-48cb-9506-14e08c912a39
    level: L1
    supports:
