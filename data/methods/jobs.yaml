- id: job-account
  name: 假求職：要你交出存摺、提款卡、網銀帳密，或先付保證金、訓練費
  aliases:
  - 假求職
  - 求職詐騙
  - 人頭帳戶
  - 收簿手
  category: 求職打工
  summary: 假冒人力公司或知名企業刊登高薪輕鬆職缺，以「薪資轉帳」為由要你交出存摺、提款卡和密碼，或先收保證金、訓練費、制服費；帳戶會被拿去收詐騙款，你也可能變成人頭戶而觸法。
  status: active
  first_seen: '2019'
  channels:
  - 臉書
  - LINE
  - 求職網站
  pretend_to_be:
  - 人力資源公司
  - 知名企業
  - 獵人頭公司
  stages:
  - stage: 接觸
    what_you_see: 在臉書、LINE 或求職網站看到「高薪日領、免經驗、在家工作」之類的職缺。
  - stage: 取信
    what_you_see: 對方自稱人力公司、知名企業或獵人頭，要你私下加 LINE 聯絡，或約你「面試」。
  - stage: 要求行動
    what_you_see: 說要設定薪資轉帳，要你交出或用超商寄出存摺、提款卡和密碼，或先付制服費、保證金、訓練費、系統操作費。
  - stage: 收網後
    what_you_see: 帳戶被拿去收詐騙款、變成警示帳戶；也有人被叫去 ATM 領錢或到超商收件，淪為車手、收簿手而觸法。
  opener_examples:
  - 高薪日領、免經驗，在家就能做，有興趣加 LINE 詳談。
  - 錄取後要設定薪資轉帳，請先把提款卡和密碼寄來。
  red_flags:
  - id: hand-over-bank-card
    text: 要你交出或寄出存摺、提款卡、提款密碼
    cues:
    - re:(寄|交|給|提供|放|郵寄|快遞|面交|交付|出借|出租|借|租).{0,8}(金融卡|提款卡|存摺|存簿|簿子)
    - re:(金融卡|提款卡|存摺|存簿).{0,10}(寄|交給|給我|密碼|一起|放在|寄到)
    - 提款密碼
    weight: 3
  - id: fee-before-job
    text: 還沒上班就要先付保證金、訓練費、制服費
    cues:
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 訓練費
    - 制服費
    - 治裝費
    - 系統操作費
    weight: 3
  - id: netbank-credentials
    text: 要你給網路銀行帳密，或照指示申辦約定轉帳
    cues:
    - 網銀帳密
    - 網路銀行密碼
    - 約定轉帳
    - 約定帳戶
    weight: 3
  - id: high-pay-daily
    text: 主打高薪日領、免經驗、在家工作
    cues:
    - 高薪日領
    - 日領
    - re:免經驗.{0,10}(高薪|日領|月入|輕鬆)
    - 在家工作
    weight: 1
  final_ask:
  - 交出或寄送存摺、提款卡與密碼、網路銀行帳密。
  - 先繳保證金、訓練費、制服費或治裝費。
  verify:
  - 查證職缺來源是否合法，跟親友討論是否真有這份工作。
  - 對徵才公司多查、多問，可以打電話過去確認是不是真的；覺得有問題的契約不要簽。
  - 到台灣就業通查詢打工資訊與求職防騙技巧。
  safe_lookalikes:
  - 合法公司徵才不會只靠網路訊息貼文，更不會用私人帳號發訊息找你。
  if_already_happened:
  - 面試時發現不對勁，立刻離開現場或藉故脫身。
  - 立即撥打 165 反詐騙專線，或到附近派出所求助。
  prevalence:
    note: ''
    source_url: ''
  sources:
