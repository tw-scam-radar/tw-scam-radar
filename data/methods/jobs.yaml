- id: job-task
  name: 假求職：刷單、按讚、做任務賺佣金，後來要你先墊錢
  aliases:
  - 假兼職
  - 按讚賺錢詐騙
  - 代購賺價差
  category: 求職打工
  summary: 標榜在家按讚、代購商品就能賺佣金的兼職，先發一點小錢讓你相信，再要你墊錢代購或付會員費升級，等你想領錢時就拖延，甚至 App 下架、群組關閉。
  status: active
  first_seen: '2020'
  channels:
  - 臉書
  - Threads
  - LINE
  - LINE 群組
  pretend_to_be:
  - 兼職招募者
  stages:
  - stage: 接觸
    what_you_see: 在臉書、Threads 或打工社團看到「在家按讚賺佣金」「代購商品賺價差」的兼職廣告，對方要你私下加 LINE。
  - stage: 取信
    what_you_see: 一開始真的發給你一點小額佣金，讓你相信是真的工作。
  - stage: 要求行動
    what_you_see: 接著要你投入資金「代購商品」，或付會員費、開通更高等級會員來提高回饋。
  - stage: 收網後
    what_you_see: 想出金時對方用各種理由拖延，或 App 無預警關閉下架、群組被關掉。
  opener_examples:
  - 在家用手機按讚就能賺佣金，免經驗、時間自由。
  - 幫忙代購商品就能賺價差，高薪、遠端、免經驗。
  red_flags:
  - id: likes-for-money
    text: 按讚、關注就能賺錢
    cues:
    - 按讚賺佣金
    - 按讚可賺錢
    - 按讚賺錢
    - 賺佣金
    weight: 2
  - id: pay-before-working
    text: 要你先墊款、代購商品，或付會員費、升級會員才能領更多
    cues:
    - 先墊款
    - 墊付
    - 代購商品
    - 會員費
    - 升級會員
    weight: 3
  - id: easy-high-pay-remote
    text: 主打高薪、零門檻、輕鬆遠端
    cues:
    - re:高薪.{0,10}(免經驗|輕鬆|日領|出國|海外|在家)
    - re:免經驗.{0,10}(高薪|日領|月入|輕鬆)
    - 輕鬆遠端
    - 在家賺錢
    - 零門檻
    weight: 1
  - id: order-task-job
    weight: 2
    text: 在家「點單、處理訂單、做任務」，有督導員教你、按單計酬
    cues:
    - 點單
    - 督導員
    - 線上門市訂單
    - 計算對應的稿費
    - re:(訂單|點單).{0,10}(處理|時段|單量)
  final_ask:
  - 先墊錢代購商品、付會員費或升級會員，才能繼續領佣金。
  verify:
  - 不要相信宣稱高薪、零門檻的工作；要先墊款或先投資才能開始的職缺一律拒絕。
  - 求職時先查清楚公司和職缺資訊是不是真的。
  - 有疑問撥打 165 反詐騙專線諮詢。
  safe_lookalikes:
  - 正常的兼職不會要求你先墊款或先投資才能開始工作。
  if_already_happened:
  - 撥 110 報案，或撥 165 專線諮詢。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 暑假打工注意！「在家按讚賺佣金」全是假　警政署揭詐騙3步驟
    publisher: 聯合新聞網
    date: '2026-07-19'
    url: https://udn.com/news/story/124490/9637050
    level: L2
    supports:
    - aliases
    - channels
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
  - title: 假投資真詐騙！抖音點讚賺錢 app「友點讚」百餘人受害
    publisher: 中央社（INSIDE 授權轉載）
    date: '2020-08-07'
    url: https://www.inside.com.tw/article/20608-taiwan-internet-fraud-tiktok
    level: L2
    supports:
    - aliases
    - first_seen
    - channels
    - stages
