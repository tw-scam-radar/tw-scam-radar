- id: fake-medicine
  name: 假醫師、假中醫 LINE 看診賣藥：線上問診推「特效藥」、保健品
  aliases:
  - 假醫師賣藥詐騙
  - 假名醫一頁式廣告
  - 線上問診詐騙
  category: 其他
  summary: 在臉書看到名醫、中醫或減重藥廣告，加 LINE 後由「醫師」「醫師助理」「中醫師顧問」線上問診，推銷來路不明的特效藥、保健品，要你匯款或貨到付款。之後一直叫你加購，越買越貴，甚至要你繳說明會入場費。藥吃了還可能延誤病情。
  status: active
  first_seen: '2024'
  channels:
  - 臉書
  - 臉書廣告
  - LINE
  pretend_to_be:
  - 名醫或名醫的助理
  - 中醫師顧問
  - 國外大學中醫學院醫師
  - 中醫養生帳號
  stages:
  - stage: 接觸
    what_you_see: 在臉書或社群看到名醫、中醫推薦特效藥、減重藥的廣告，有的是用 AI 偽造醫師的臉和聲音。
  - stage: 取信
    what_you_see: 點進去加入 LINE（例如「中醫養生」帳號），對方自稱醫師、醫師助理或「中醫師顧問」，說醫師病人太多、由助理關心你的病情，替你線上問診。
  - stage: 要求行動
    what_you_see: 推薦「特效藥」「快速療程」，說名額有限、已經幫你登記，要你匯款到指定帳戶，或寄高價藥品貨到付款。
  - stage: 收網後
    what_you_see: 用療程不足、效果加強當理由一直要你加購，越買越貴；有人被要求繳數十萬元說明會入場費，還說之後會全額退還藥款。
  - stage: 收網後
    what_you_see: 藥品標示不清、來源不明，有慢性病患者吃了病情惡化住院。
  opener_examples:
  - 醫師病人太多，我是他的助理，先幫你線上問診。
  - 這款特效藥名額有限，已經幫你登記，今天匯款保留。
  - 療程還不夠，要再加購一期效果才會出來。
  - 醫院要來台設分院辦說明會，先繳入場費之後全退。
  red_flags:
  - id: line-consultation
    text: 要你加 LINE 才能線上問診、買藥
    cues:
    - re:(加|私訊).{0,6}(LINE|賴|好友).{0,10}(問診|看診|買藥)
    - re:開放加好友.{0,4}(問診|看診)
    - re:(LINE|賴).{0,4}(線上)?(問診|看診)
    weight: 2
  - id: miracle-cure
    text: 推銷「特效藥」「快速療程」，誇大療效、保證快速見效
    cues:
    - re:特效(藥|中藥|藥方)
    - re:(保證|快速|馬上|一週|七天).{0,4}(見效|根治|痊癒|斷根)
    - 快速療程
    weight: 2
  - id: doctor-assistant-sells
    text: 自稱醫師助理或「中醫師顧問」在私訊幫你看病、賣藥
    cues:
    - re:我是.{0,6}(醫師|醫生).{0,2}(的)?助理
    - 中醫師顧問
    - re:(醫師|醫生).{0,6}(病人|患者).{0,4}(太多|很多)
    weight: 2
  - id: upsell-course
    text: 用療程不足、效果加強當理由，不斷要你加購、越買越貴
    cues:
    - re:療程.{0,4}(不足|不夠|還沒完成)
    - re:(再|加)購.{0,8}(療程|一期|一盒|效果)
    - re:效果(加強|更好).{0,10}(加購|再買)
    weight: 2
  - id: entrance-fee-refund
    text: 要你先繳說明會入場費，還說之後全額退還
    cues:
    - re:(入場費|說明會).{0,15}(全額退|退還|全退|退費)
    - re:(繳|付|匯).{0,4}入場費
    weight: 3
  - id: limited-slots-rush
    text: 說名額有限、已經幫你登記，催你快匯款
    cues:
    - re:(已|已經)(幫|替)你登記
    - re:名額有限.{0,10}(匯款|付款|轉帳)
    weight: 1
  final_ask:
  - 匯款到對方指定帳戶買藥或保健品（收款帳戶常掛著一般店家、行號的名字，其實是人頭帳戶）。
  - 收下貨到付款的高價藥品包裹。
  - 繳交說明會入場費。
  verify:
  - 看病到合格醫療院所，藥品憑處方箋到合法藥局領。
  - 上衛福部「醫事查詢系統」查醫師與院所資格。
  - 醫師或醫院是不是真的有線上看診、賣藥，打醫院或學校官方電話、看官網公告確認。
  - 有疑慮撥 165 反詐騙專線諮詢。
  safe_lookalikes:
  - 透過醫院官網、正式掛號系統看診是正常管道；名醫本人不會用私人社群帳號看診、賣藥。
  if_already_happened:
  - 身體不舒服請到合格醫療院所就醫，不要再照 LINE 上的指示用藥。
  - 貨到付款的包裹還沒簽收可以拒收、請物流退回；已經匯款就撥 165 或 110 報案。
  prevalence:
    note: ''
    source_url: ''
