- id: election-season
  name: 選舉期間詐騙：投資候選人廣告、冒用政治人物帳號借錢、假政治獻金訂貨
  aliases:
  - 選舉詐騙
  - 投資參選人看板廣告
  - 冒用參選人帳號
  - 假借政治獻金騙商家
  category: 其他
  summary: 選舉期間，詐團利用支持者的熱情，常見三種騙法。一是說投資候選人看板廣告，當選後能分紅。二是冒用候選人、官員或村里長的「私人帳號」，說選舉缺錢，要你匯款、借錢。三是假扮競選團隊，向商家大量訂貨「代替政治獻金」，用遠期支票付款後跳票。
  status: active
  first_seen: '2018'
  channels:
  - 臉書
  - LINE
  - 其他
  pretend_to_be:
  - 競選總部人員
  - 候選人或現任官員本人（自稱私人帳號）
  - 區長、村里長
  - 候選人團隊採購人員
  stages:
  - stage: 接觸
    what_you_see: （路線一：投資候選人廣告）自稱競選總部人員的人來找你，說可以「投資」候選人的看板廣告。
  - stage: 製造情境
    what_you_see: （路線一）說個人捐政治獻金有上限，多出來的可以用投資入股，當選後分紅，或帶你加入政治人物操盤的股票，保證獲利。
  - stage: 要求行動
    what_you_see: （路線一）要你轉帳或交付本票，甚至介紹你去當鋪抵押借錢來投資；你追問時就被封鎖、刪除。
  - stage: 接觸
    what_you_see: （路線二：冒用私人帳號借錢）你支持的候選人或官員的「私人帳號」突然私訊你，名稱、照片和本人幾乎一樣；或說區長、村里長換了新 LINE，邀你加好友、進群組。
  - stage: 要求行動
    what_you_see: （路線二）說選舉缺錢、經費不足、不方便公開募款，要你匯款參加「不公開」募款，或直接開口借錢。
  - stage: 接觸
    what_you_see: （路線三：假政治獻金訂貨，對象是商家）有人自稱候選人團隊，向你的店大量訂貨，說是用採購「代替政治獻金」或選舉送禮。
  - stage: 收網後
    what_you_see: （路線三）用遠期支票付款，貨運走後支票跳票，人也聯絡不上。
  opener_examples:
  - 個人捐款有上限，改投資候選人看板廣告，當選後就分紅。
  - 我是候選人的私人帳號，選舉經費吃緊，能先借我一筆嗎？
  - 區長換新 LINE 了，請加這個帳號，再拉你進群組。
  - 我們競選團隊要大量訂貨代替政治獻金，貨款開期票給你。
  red_flags:
  - id: invest-in-candidate
    text: 用「投資政治廣告、入股參選人」名義找你出錢，還說保證獲利、當選分紅
    cues:
    - re:投資.{0,8}(候選人|參選人|政治廣告|看板廣告)
    - re:(入股|投資).{0,6}(參選人|候選人)
    - re:當選.{0,8}(分紅|配息|回饋|獲利)
    - re:(政治人物|候選人|參選人).{0,6}操盤
    weight: 3
  - id: donation-cap-workaround
    text: 說政治獻金有上限，多出來的錢可以改用投資名義
    cues:
    - re:(政治獻金|捐款).{0,10}(上限|額度).{0,15}(投資|入股)
    - re:超過.{0,6}(上限|額度).{0,10}(投資|入股)
    weight: 2
  - id: private-account-asks-money
    text: 候選人、官員或村里長的「私人帳號」私訊你借錢，或要你參加不公開募款
    cues:
    - re:(私人|私下|另一個|新的).{0,4}(帳號|LINE).{0,20}(借|匯|轉|募款)
    - re:(選舉|競選).{0,6}(缺錢|經費不足|經費吃緊|經費短缺).{0,15}(借|匯|轉|支持)
    - re:不公開.{0,4}募款
    - re:(區長|里長|村長|議員|立委|市長).{0,8}(換|新).{0,4}(LINE|帳號)
    weight: 3
  - id: donation-order-postdated-cheque
    text: 自稱競選團隊大量訂貨「代替政治獻金」，用遠期支票付款
    cues:
    - re:(代替|取代|當作|充當).{0,4}政治獻金
    - re:(競選|候選人|選舉).{0,20}(期票|遠期支票)
    - re:(大量|大批).{0,4}(訂貨|採購|訂購).{0,20}(政治獻金|競選|選舉)
    weight: 3
  - id: promissory-note-or-pawn
    text: 要你交付本票，或叫你去當鋪抵押借錢來「投資」
    cues:
    - re:(交付|開|簽).{0,4}本票
    - re:(當鋪|典當).{0,10}(借|抵押|週轉|周轉)
    weight: 2
  final_ask:
  - 把錢轉帳或交付本票，「投資」候選人廣告或入股。
  - 匯款或借錢給冒用候選人、官員、村里長身分的帳號。
  - （商家）先出貨，收遠期支票當貨款。
  verify:
  - 參選人的廣告和競選經費不會對外招募投資；支持候選人請走合法捐款管道，並要求開收據。
  - 自稱競選總部人員要你匯款或交本票，先撥 165 查證，或在 165 打詐儀錶板問 AI 防詐客服。
  - 候選人、官員或親友說換了帳號、要借錢，改用電話或當面等其他管道向本人確認。
  - 商家還沒跟政治人物或競選團隊當面確認交易細節前，不要先交貨或交付財物。
  safe_lookalikes:
  - 合法政治獻金是捐款，有法定上限（個人對同一參選人每年最多 10 萬元），會開收據，不會給你分紅或獲利。
  - 競選辦公室公布的政治獻金專戶是正常捐款管道；165 曾澄清，民眾捐到競選辦公室提供的帳戶並不是被騙。
  if_already_happened:
  - 撥 165 查證或 110 報案。
  - 自己的照片、姓名被冒用開了假帳號，可以直接向 LINE 檢舉，並通知親友與支持者。
  prevalence:
    note: 刑事局 2026-10-18 依 165 報案資料整理選舉四大詐術，表示目前多為零星個案；第四種「假送競選小物」件數最多，屬 fake-sticker 一類的免費贈品手法，不在本筆。
    source_url: https://www.cna.com.tw/news/asoc/202610180107.aspx
  sources:
