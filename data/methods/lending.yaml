- id: installment-cancel
  name: 解除分期付款（假客服＋假銀行）
  aliases:
  - ATM 解除分期
  - 解除分期付款詐騙
  - 誤設分期
  - 重複扣款
  - 升級 VIP
  - 假客服
  category: 借貸金融
  summary: 對方假冒你買過東西的商家客服，說系統誤設成分期或重複扣款，再由假銀行人員要你操作 ATM、網銀、掃 QR Code 或買點數「解除設定」，錢就被轉走。
  status: active
  first_seen: ''
  channels:
  - 電話
  - LINE
  pretend_to_be:
  - 電商或商家客服
  - 基金會人員
  - 銀行客服
  - 金融機構金流人員
  stages:
  - stage: 接觸
    what_you_see: 接到自稱商家、電商或基金會客服的電話，常是境外來電（顯示 + 開頭），對方說得出你的購買紀錄。
  - stage: 製造情境
    what_you_see: 說工作人員操作錯誤，把你的訂單誤設成分期付款、重複扣款或升級 VIP 會員，不處理會一直扣款。
  - stage: 取信
    what_you_see: 接著有人自稱銀行人員或金流人員打來，或要你加「客服」LINE 協助解除。
  - stage: 要求行動
    what_you_see: 要你到 ATM 或用網路銀行照指示操作、掃對方給的 QR Code，或去超商買遊戲點數；也有改說個資外洩，要你寄出提款卡和存摺。
  - stage: 收網後
    what_you_see: 帳戶餘額變少才發現錢被轉走；寄出提款卡的人，帳戶還可能被拿去當人頭帳戶。
  opener_examples:
  - 您好，這裡是購物網站客服，您上次的訂單被誤設成分期。
  - 系統出錯會每月重複扣款，需要您配合銀行解除設定。
  - 我是銀行金流人員，請到 ATM 照我的指示取消扣款。
  red_flags:
  - id: wrong-installment-setting
    text: 說你的訂單被誤設分期、重複扣款或升級 VIP
    cues:
    - 誤設
    - 重複扣款
    - 升級VIP
    - 取消設定
    - re:(誤設|設定成|設定為|變成|升級).{0,8}(分期|vip|會員|批發商)
    weight: 3
  - id: atm-or-netbank-operation
    text: 要你到 ATM 或用網路銀行「解除設定」
    cues:
    - re:(到|去|前往|找|最近的).{0,6}(atm|提款機)
    - re:(atm|提款機).{0,10}(操作|解除|設定|認證|退費|退款|按|輸入)
    - re:(網路銀行|網銀).{0,10}(操作|設定|轉帳|驗證(?!碼)|認證(?!碼)|帳號|密碼|帳密)
    - re:(登入|打開).{0,6}(網路銀行|網銀).{0,10}(驗證(?!碼)|認證(?!碼)|按|操作)
    - 解除設定
    - 解除扣款
    weight: 3
  - id: qr-code-verification
    text: 用「金流驗證」名義要你掃 QR Code
    cues:
    - 金流驗證
    - re:(掃|掃描|拍).{0,6}(qr|條碼).{0,12}(驗證|認證|收款|轉帳|領取|解除|登入|加好友)
    - re:(提供|傳|拍).{0,6}(qr|條碼)
    weight: 3
  - id: game-points
    text: 要你去超商買遊戲點數來解除設定
    cues:
    - 遊戲點數
    - 買點數
    weight: 3
  - id: mail-bank-cards
    text: 要你寄出提款卡、存簿或先改提款卡密碼
    cues:
    - 寄送提款卡
    - 寄送存簿
    - 變更提款卡密碼
    weight: 3
  - id: overseas-caller
    text: 來電顯示「+」開頭的境外號碼
    cues:
    - '+886'
    - '+02'
    - 境外來電
    weight: 1
  - id: data-breach-card-theft
    text: 說業者個資外洩或訂單設定錯誤，你的卡會被盜刷或重複扣款
    cues:
    - re:個資外洩.{0,15}(盜刷|扣款|分期|重複)
    - re:(訂單|帳戶|會員).{0,6}(設定錯誤|誤設|異常).{0,10}(扣款|分期)
    weight: 3
  final_ask:
  - 到 ATM 或用網路銀行照對方指示「解除設定」，實際上是把錢轉出去。
  - 去超商買遊戲點數「解除設定」。
  - 寄出提款卡、存簿，或先改提款卡密碼。
  verify:
  - 掛斷電話，自己查官方客服電話打回去確認；不要因為對方說得出交易明細就相信。
  - 撥 165 反詐騙諮詢專線。
  safe_lookalikes:
  - ATM 只有提款和轉帳功能，不能解除分期付款或退款；遊戲點數也只能儲值遊戲，不能解除任何設定。
  - 對訂單有疑問，直接到官方網站或 App 查；正規企業與銀行客服不會要你掃 QR Code 匯款或驗證。
  if_already_happened:
  - 立刻撥 165 或到派出所報案，並聯絡銀行。
  - 已寄出提款卡或存摺：盡快打給銀行凍結帳戶，報案時說明自己是受害者，保留對話紀錄。
  prevalence:
    note: 內政部公布 112 年詐騙案件發生數前三名依序為假投資、假網路拍賣、解除分期付款。
    source_url: https://www.cna.com.tw/news/asoc/202401300023.aspx
  sources:
  - title: 常見詐騙手法話術解析與因應之道－第三章 ATM解除分期付款詐騙
    publisher: 刑事警察局
    date: '2026-10-22'
    url: https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a61af506-a4ac-49eb-9c79-ef75ddc6f237
    level: L1
    supports:
    - channels
    - pretend_to_be
    - stages
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
    - if_already_happened
  - title: 解除分期詐騙新手法，提醒消費者慎防詐騙
    publisher: 刑事警察局
    date: '2021-09-12'
    url: https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=19d0bb9c-908d-40fb-81fc-11a8e6522d57
    level: L1
    supports:
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - if_already_happened
  - title: 帳戶被騙出借或交付他人之民刑事責任問題
    publisher: 臺灣高等檢察署
    date: '2026-08-04'
    url: https://www.tph.moj.gov.tw/4421/4475/632364/1425669/post
    level: L1
    supports:
    - if_already_happened
  - title: 訂單重複取消扣款？假客服詐騙手法升級 警政署提醒：掃QR Code全是騙
    publisher: 聯合新聞網
    date: '2026-08-31'
    url: https://udn.com/news/story/124490/9724838
    level: L2
    supports:
    - channels
    - pretend_to_be
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - safe_lookalikes
  - title: 假投資連3年居詐騙件數金額第1 常冒用名人身分傳飆股訊息
    publisher: 中央社
