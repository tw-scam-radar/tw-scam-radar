- id: fake-bank-service
  name: 假冒銀行客服、帳戶異常
  aliases:
  - 假冒銀行簡訊
  - 網銀釣魚簡訊
  - 帳戶異常詐騙
  - 假網銀
  category: 借貸金融
  summary: 對方假冒銀行發簡訊、郵件或來電，說你的帳戶異常、即將凍結或網銀要更新，引你到假網銀輸入帳密和驗證碼，再登入真網銀把錢轉走。
  status: active
  first_seen: ''
  channels:
  - 簡訊
  - 電子郵件
  - 電話
  pretend_to_be:
  - 銀行
  - 銀行客服
  - 金融機構金流人員
  stages:
  - stage: 接觸
    what_you_see: 收到掛著銀行名稱的簡訊或 email，說帳戶顯示異常、網銀更新失敗、系統升級或要綁定資料；也可能直接接到自稱銀行人員的電話。
  - stage: 製造情境
    what_you_see: 用「否則帳戶將凍結」「卡片暫停使用」施壓，要你立刻處理。
  - stage: 要求行動
    what_you_see: 點連結進到很像銀行官網的假網站，輸入網銀帳號、密碼、身分證字號；接著再收到訊息要你輸入簡訊驗證碼。電話版則要你照指示操作 ATM 或網銀。
  - stage: 收網後
    what_you_see: 歹徒拿你的帳密登入真網銀轉帳，往往收到轉帳通知才發現。
  opener_examples:
  - 【某銀行】您的帳戶顯示異常，請立即登入驗證，逾時凍結。
  - 您的網銀帳戶更新失敗，請輸入驗證碼完成更新。
  - 網銀系統升級，您的卡片暫停使用，請點連結驗證恢復。
  red_flags:
  - id: account-abnormal-freeze
    text: 說帳戶異常、即將凍結或卡片暫停使用
    cues:
    - 帳戶異常
    - 顯示異常
    - 凍結
    - 暫停使用
    weight: 2
  - id: update-or-bind-request
    text: 要你更新、綁定或升級網銀資料
    cues:
    - 更新失敗
    - 綁定
    - 版本更新
    - 升級
    - 立即登入
    weight: 2
  - id: login-link-in-sms
    text: 簡訊或郵件附連結要你登入網銀
    cues:
    - 點擊連結
    - 登入網銀
    - re:(登入|登錄|輸入|驗證|認證|更新|繳費|繳納|付款|支付|領取|解除|綁定|填寫|確認|補件|查看帳單).{0,25}(https?://|\[連結\]|網址|連結)
    weight: 2
  - id: otp-request
    text: 要你輸入或回傳簡訊驗證碼
    cues:
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    weight: 3
  final_ask:
  - 在假網銀輸入帳號、密碼、身分證字號。
  - 輸入或回傳簡訊驗證碼。
  - 如果對方是打電話來：照指示操作 ATM 或網路銀行。
  verify:
  - 不要點簡訊連結、不要撥簡訊上的電話，改打銀行官網上的客服專線。
  - 從銀行官方網站或官方 App 登入，看有沒有同樣的通知。
  - 接到自稱銀行的電話先掛斷，自己查銀行電話回撥確認。
  - 可疑網址到 TWCERT/CC「Phishing Check 釣魚網站通報」回報；有疑問撥 165。
  safe_lookalikes:
  - 金融機構不會用簡訊請你點連結並輸入帳號、密碼或簡訊認證碼；銀行真有公告，官方 App 或官網也查得到。
  - 銀行確實會傳一次性密碼（OTP）做交易確認；輸入前要核對幣別、金額和用途是否跟你正在做的交易相符。
  if_already_happened:
  - 已在可疑網站輸入帳密：立刻用官網電話聯絡銀行處理、改密碼，並撥 165。
  - 沒綁卡卻收到綁定通知或發現異常交易，立刻聯繫發卡機構。
  prevalence:
    note: 165 打詐儀錶板 2026 年 3 月受理件數前五名包含「釣魚連結詐騙」（未單獨統計假冒銀行）。
