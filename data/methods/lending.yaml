- id: fake-loan
  name: 假借貸、代辦貸款
  aliases:
  - 假貸款
  - 代辦貸款
  - 美化帳戶
  - 包裝金流
  - 刷流水
  - 貸款保證金
  category: 借貸金融
  summary: 對方打著保證核貸、信用不良可辦的廣告，要你先付手續費或保證金，或交出網銀帳密、金融卡、存摺做「美化帳戶」；最後錢沒借到，帳戶還可能變成人頭帳戶。
  status: active
  first_seen: ''
  channels:
  - 臉書廣告
  - IG
  - LINE
  pretend_to_be:
  - 貸款專員
  - 理財專員
  - 資產管理公司客服
  - 銀行或融資公司員工
  - 代辦業者
  stages:
  - stage: 接觸
    what_you_see: 在臉書、IG 看到「保證核貸、信用不良可辦」「低利率、快速核貸」的貸款廣告，點進去被導到 LINE。
  - stage: 取信
    what_you_see: 對方自稱貸款專員或資產管理公司，說有專業團隊能幫你向銀行申貸。
  - stage: 製造情境
    what_you_see: 說你的財力證明不夠、現金流不足，要先「美化帳戶」「包裝金流」或「配合刷流水」，還說這很常見。
  - stage: 要求行動
    what_you_see: 要你先匯手續費、保證金或帳戶驗證費，或交出網銀帳號密碼、金融卡、存摺、驗證碼。
  - stage: 收網後
    what_you_see: 付了錢就失聯、不讀不回；帳戶出現不明大額進出，被列為警示帳戶，日常金融往來幾乎停擺。
  opener_examples:
  - 信用不好也能貸，保證核貸，加 LINE 免費諮詢。
  - 您的財力證明不足，要先幫您把帳戶美化一下。
  - 撥款前要先繳一筆保證金，確認帳戶後就放款。
  red_flags:
  - id: guaranteed-approval
    text: 保證核貸、保證過件、信用不良也能貸
    cues:
    - 保證核貸
    - 保證過件
    - 信用不良可辦
    - 不看信用
    - 快速核貸
    - 免擔保
    weight: 2
  - id: upfront-fee
    text: 放款前要你先付手續費、保證金、代辦費或驗證費
    cues:
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 驗證費
    - 先匯款
    weight: 3
  - id: account-beautify
    text: 說要幫你美化帳戶、包裝金流、刷流水
    cues:
    - 美化帳戶
    - 包裝金流
    - 刷流水
    - 財力證明
    weight: 3
  - id: hand-over-credentials
    text: 要你交出網銀帳密、金融卡、存摺或驗證碼，或「暫借帳戶」
    cues:
    - 網銀帳密
    - re:(寄|交|給|提供|放|郵寄|快遞|面交|交付|出借|出租|借|租).{0,8}(金融卡|提款卡|存摺|存簿|簿子)
    - re:(金融卡|提款卡|存摺|存簿).{0,10}(寄|交給|給我|密碼|一起|放在|寄到)
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    - 暫借帳戶
    weight: 3
  final_ask:
  - 先匯手續費、保證金或代辦費給對方。
  - 交出網銀帳號密碼、金融卡、存摺或驗證碼，讓對方「操作金流」。
  verify:
  - 貸款找政府核准的合法金融機構，自己從官方網站或公開管道查聯絡方式。
  - 撥 165 反詐騙諮詢專線或 110 查證；也可以在 165 打詐儀錶板問 AI 防詐客服，輸入對方的話術或網址。
  safe_lookalikes:
  - 合法貸款機構通常不會在放款前收取不明費用，也不會要你提供帳戶密碼或借用你的帳戶。
  - 銀行審核貸款會請你提供身分與財力文件，但不會要你交出網銀密碼、驗證碼或金融卡。
  if_already_happened:
  - 已交出網銀帳密或金融卡，立刻打給銀行凍結帳戶，到警察局報案並說明自己是受害者，保留對話與匯款紀錄。
  - 撥 165 或 110 求助。
  prevalence:
    note: ''
    source_url: ''
  sources:
  - title: 網路找貸款？我來幫你「美化帳戶」缺錢調頭寸反被當成洗錢人頭戶
    publisher: 刑事警察局
    date: '2026-08-08'
    url: https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=1812d90c-16f4-407c-acc2-047ef1514f2d
    level: L1
    supports:
    - aliases
    - channels
    - pretend_to_be
    - stages
    - opener_examples
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
  - title: 貸款詐欺之樣態、危害與防範
    publisher: 臺灣臺北地方檢察署
    date: '2026-01-13'
    url: https://www.tpc.moj.gov.tw/292885/976681/661783/1362145/post
    level: L1
    supports:
    - aliases
    - pretend_to_be
    - stages
    - red_flags
    - final_ask
    - verify
    - safe_lookalikes
  - title: 帳戶被騙出借或交付他人之民刑事責任問題
    publisher: 臺灣高等檢察署
    date: '2026-08-04'
    url: https://www.tph.moj.gov.tw/4421/4475/632364/1425669/post
    level: L1
    supports:
    - if_already_happened
  - title: 貸款要先繳保證金台東男險被騙 關山警保他辛苦錢
    publisher: ETtoday新聞雲
    date: '2026-05-30'
    url: https://www.ettoday.net/news/20260530/3174874.htm
    level: L2
