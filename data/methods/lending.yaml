- id: account-rental
  name: 人頭帳戶招募：出租或出借帳戶
  aliases:
  - 出租帳戶
  - 出借帳戶
  - 租借帳戶
  - 人頭帳戶
  - 人頭戶
  - 代收款
  category: 借貸金融
  summary: 對方用月租金、代收款手續費、工作、投資或感情為理由，要你交出存摺、提款卡、密碼或網銀帳密；帳戶被拿去收贓款後，你可能被列警示帳戶、被判刑，還要賠償被害人。
  status: active
  first_seen: ''
  channels:
  - LINE
  - 交友軟體
  - 其他
  pretend_to_be:
  - 雇主或公司經理
  - 網友或戀人
  - 朋友
  - 投資業者
  - 貸款代辦
  stages:
  - stage: 接觸
    what_you_see: 有人說要「租」你的帳戶、按月給租金，或以工作、朋友、網戀、投資名義請你幫忙；對方身分模糊，常只用 LINE 聯絡。
  - stage: 製造情境
    what_you_see: 說公司帳戶因做帳問題暫時不能用，要你先代收貨款；或說「幫我收一下款」給你手續費；也有說「為了愛」要開共同帳戶。
  - stage: 要求行動
    what_you_see: 要你交出存摺、提款卡和密碼，或網銀帳號密碼，或開一個新帳戶給對方操作。
  - stage: 收網後
    what_you_see: 帳戶被拿去收詐騙贓款，被銀行凍結、列為警示帳戶；可能被依洗錢防制法、幫助詐欺追訴，還要連帶賠償被害人。
  opener_examples:
  - 帳戶閒著也是閒著，租給我們每月固定給租金。
  - 公司帳戶暫時不能用，先借你的帳戶收一下貨款。
  - 幫我代收一筆款，給你兩千元手續費。
  red_flags:
  - id: rent-account
    text: 說要租或借你的帳戶，還按月給錢
    cues:
    - 出租帳戶
    - 租借帳戶
    - 借用帳戶
    - 帳戶出租
    - 月租
    weight: 3
  - id: collect-money-for-fee
    text: 請你用自己的帳戶代收款，再給你手續費
    cues:
    - 收一下款
    - 幫我收款
    - re:(幫|替).{0,4}代收.{0,10}(款|錢|匯款)
    - re:(幫我|幫忙).{0,4}(收款|收一下款|收錢|轉帳|領錢).{0,12}(給你|報酬|酬勞|手續費|抽成)
    weight: 2
  - id: hand-over-card-password
    text: 要你交出提款卡、存摺、密碼或網銀帳密
    cues:
    - re:(寄|交|給|提供|放|郵寄|快遞|面交|交付|出借|出租|借|租).{0,8}(金融卡|提款卡|存摺|存簿|簿子)
    - re:(金融卡|提款卡|存摺|存簿).{0,10}(寄|交給|給我|密碼|一起|放在|寄到)
    - re:(提供|告訴|給|傳|寫下|報).{0,6}(密碼|帳密)
    - re:(密碼|帳密).{0,6}(給我|告訴我|傳給|寫給|一起寄)
    - 網銀帳密
    weight: 3
  - id: mail-bank-cards
    text: 要你把提款卡、存簿寄出去
    cues:
    - 寄送提款卡
    - 寄送存簿
    - 寄提款卡
    weight: 3
  - id: open-new-account
    text: 要你為對方開新帳戶或共同帳戶
    cues:
    - 開新帳戶
    - 共同帳戶
    weight: 2
  final_ask:
  - 交出存摺、提款卡和密碼，或網銀帳號密碼。
  - 用自己的帳戶幫對方收款，再轉出或領出。
  verify:
  - 面試或工作要你交出提款卡、存摺正本，幾乎可以確定是詐騙。
  - 遇到可疑狀況，先撥 165 反詐騙諮詢專線確認。
  safe_lookalikes:
  - 公司要你提供本人帳號收薪水是常見做法；但要你交出提款卡、存摺正本或密碼，就是詐騙。
  - 把帳戶借給信任的親友，或照一般商業習慣正當使用，法律上有例外；但如果對方要「帳戶＋密碼＋提款卡」一整套、給的錢高得不合理、又只用 LINE 聯絡，法院可能認定你是故意的。
  if_already_happened:
  - 盡快打給銀行凍結帳戶，到警察局報案並說明自己是受害者，保留對話與匯款紀錄。
  - 了解法律風險：第一次違反洗錢防制法第 22 條，會被警察機關告誡（裁處告誡）；如果有拿好處（收取對價）、交出三個以上帳戶，或被告誡後五年內再犯，可處三年以下有期徒刑、拘役，或併科罰金（另外再罰錢）。
