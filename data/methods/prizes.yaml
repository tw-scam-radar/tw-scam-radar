- id: fake-freebie
  name: 假免費贈品、假問卷送禮、假集點兌換
  aliases:
  - 假問卷抽獎
  - 會員點數到期簡訊
  - 免費贈送陷阱
  category: 中獎優惠
  summary: 冒用知名品牌、電商或電信名義，用填問卷送好禮、點數即將到期可兌換、免費送手機家電等理由，騙你填個資、輸入信用卡和簡訊驗證碼，或付運費、做「實名認證」。
  status: active
  first_seen: '2023'
  channels:
  - 簡訊
  - 電子郵件
  - LINE
  - 臉書
  - Threads
  pretend_to_be:
  - 知名品牌
  - 航空公司
  - 電商平台客服
  - 電信公司
  - 送贈品的賣家
  stages:
  - stage: 接觸
    what_you_see: 收到親友轉傳的品牌週年問卷抽獎、電商或電信「會員點數即將到期」的簡訊，或在 Threads 看到免費送手機、家電的貼文。
  - stage: 取信
    what_you_see: 頁面仿冒品牌或官方網站，要你填姓名、電話、Email，還要轉傳給好友或群組才能「達到進度」。
  - stage: 要求行動
    what_you_see: 要你輸入身分證字號、信用卡資料和簡訊驗證碼，或付小額運費、刷一元兌換；免費贈品則要你私下加 LINE 聯絡。
  - stage: 收網後
    what_you_see: 信用卡被綁定、盜刷；或「客服」說賣家帳號被封鎖，要你做實名認證、金流確認，叫你轉帳或提供付款碼截圖。
  opener_examples:
  - 您的會員點數即將到期，請盡速點連結兌換好禮。
  - 品牌週年慶送好禮，填問卷並分享到群組就能領。
  - 店家倒閉出清，免費送吹風機，只要付運費。
  red_flags:
  - id: points-expiring-sms
    text: 簡訊說會員點數即將到期，要你點連結兌換
    cues:
    - 點數即將到期
    - 請速兌換
    - 點數兌換
    - 回饋資格
    weight: 2
  - id: share-to-unlock
    text: 要你轉傳給好友、群組才能領獎
    cues:
    - 分享給
    - 轉傳
    - 達到進度
    - 分享到群組
    weight: 2
  - id: card-otp-for-gift
    text: 領贈品要輸入信用卡、簡訊驗證碼，或刷一元
    cues:
    - re:(提供|告訴|給|傳|回傳|回覆|輸入|唸|念|報|截圖).{0,8}(驗證碼|認證碼|otp|一次性密碼|簡訊碼)
    - re:(驗證碼|認證碼|otp|簡訊碼).{0,8}(給我|傳給|回傳|告訴我|截圖|唸給|報給|回覆)
    - re:(輸入|填寫|提供|告訴|拍).{0,6}(信用卡|卡號|安全碼|有效期限|背面三碼)
    - 刷一元
    - 一塊錢
    weight: 3
  - id: free-gift-pay-shipping
    text: 免費贈送，只要付運費
    cues:
    - 免費贈送
    - 小額運費
    - 付運費
    - 倒閉
    - re:(免費送|免費贈送|閒置).{0,20}(運費|郵資|保證金|手續費|物流費)
    weight: 2
  - id: real-name-cashflow-check
    text: 客服說要實名認證、金流驗證才能出貨或領取
    cues:
    - 實名認證
    - 金流確認
    - 金流驗證
    - 帳號已被封鎖
    - 付款碼
    weight: 3
  final_ask:
  - 在假網頁輸入個資、信用卡資料與簡訊驗證碼。
  - 付運費，或照「客服」指示轉帳、提供付款碼截圖做認證。
  verify:
  - 改開官方 App 或自己輸入官方網址查詢點數；電商通常不會用簡訊通知點數到期，也不會要你透過 LINE 客服兌換。
  - 有沒有這個活動，以品牌官網或官方管道公布的為準；不明連結不要轉傳。
  - 撥打 165 反詐騙專線諮詢。
  safe_lookalikes:
  - 真正的會員點數資訊可以在官方 App 或官網會員頁查到，不需要點簡訊連結。
  if_already_happened:
  - 已輸入信用卡資料：立刻聯繫發卡銀行停卡或凍結交易，通知電商客服，並撥打 165。
  - 已填個資：之後可能接到來路不明的電話或電子郵件，對方說得出你的資料也別相信。
  prevalence:
    note: 2023 年一起假冒電信點數兌換的盜刷案，警方初步清查 200 多名被害人、損失約 2 千萬元。
    source_url: https://news.pts.org.tw/article/651806
  sources:
  - title: 填問卷抽大獎？LINE、臉書收親友傳「這連結」別亂點　小心下場GG
    publisher: ETtoday
