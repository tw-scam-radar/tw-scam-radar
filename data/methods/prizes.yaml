- id: fake-celebrity-ad
  name: 假名人代言廣告（投資、保健品、課程）
  aliases:
  - 冒名名人投資廣告
  - 涉詐廣告
  - AI假醫師
  - 深偽廣告
  category: 中獎優惠
  summary: 在臉書、YouTube 等平台看到名人或名醫推薦的投資群組、神奇保健品，其實是冒名，或用 AI 換臉、仿聲做的假影片（深偽）；點進去會被拉進投資群組，一步步要你匯款，或被推銷來路不明的藥品。
  status: active
  first_seen: '2024'
  channels:
  - 臉書
  - 臉書廣告
  - YouTube
  - LINE 群組
  pretend_to_be:
  - 財經名人
  - 名醫
  - 醫院院長
  - 合法金融機構
  stages:
  - stage: 接觸
    what_you_see: 在臉書、YouTube 或社群看到名人、名醫推薦的廣告或影片，常打著「贈書」「知識分享」「免費領取」。
  - stage: 取信
    what_you_see: 假帳號的簡介和貼文還寫著「小心詐騙、不會要求粉絲匯款」，讓你以為是本人。
  - stage: 要求行動
    what_you_see: 點連結後被拉進 LINE 投資群組、要你填個資、下載投資 App；或被引導購買影片推銷的藥品、保健食品。
  - stage: 收網後
    what_you_see: 投入大筆錢後，對方以各種收費或延遲出金為由，再要你付更多錢。
  opener_examples:
  - 財經名人親自分享選股心法，加入群組就免費領取。
  - 名醫推薦這款保健食品，眼睛問題一次改善。
  red_flags:
  - id: celebrity-invites-to-group
    text: 名人廣告用贈書、免費領取等名義，引導你加入投資群組
    cues:
    - 免費領取
    - 贈書
    - 知識分享
    - 加入群組
    - 投資群組
    weight: 2
  - id: anti-scam-disclaimer-bait
    text: 帳號特別強調「小心詐騙、不會要求匯款」來取信
    cues:
    - 小心詐騙
    - 遏止受害
    - 不會要求粉絲匯款
    weight: 1
  - id: doctor-endorses-product
    text: 醫師、院長出面推銷藥品或保健食品
    cues:
    - 名醫推薦
    - 醫師推薦
    - 醫師代言
    - 院長推薦
    - 保健食品
    weight: 2
  final_ask:
  - 加入 LINE 投資群組、下載投資 App，照指示匯款買賣。
  - 購買影片推銷的藥品或保健食品。
  verify:
  - 名人的臉書帳號或粉專要認明藍勾勾認證；真正的名人不會主動邀好友、帶會員操作、自稱老師或要你出資金。
  - 醫院醫師不會代言商業產品，可上醫院官網查詢。
  - 看健康資訊先問三件事：來源是否專業、是否有臨床證據、是否過度誇大。
  - 撥打 165 查證，或到數位發展部「網路詐騙通報查詢網」查詢、通報涉詐內容。
  safe_lookalikes:
  - 名人本人的帳號通常有藍勾勾認證，也不會私訊邀你加群組或要你出資。
  if_already_happened:
  - 被拉進 LINE 群組時，不要提供個資或匯款；看到這類網站就立刻離開。
  - 撥打 165 反詐騙專線或上 165 全民防騙網查證。
  - 身體不適請直接就醫，不要在網路上買來路不明的藥品。
  prevalence:
    note: 金管會統計，2023 年 4 月至 2026 年 3 月累計蒐報下架逾 10.7 萬件涉詐廣告，手法包括假借名人、合法金融機構名義投放廣告。
    source_url: https://ec.ltn.com.tw/article/breakingnews/5398915
  sources:
  - title: 冒名○○○刊投資廣告還加警語　刑事局：詐騙新招
    publisher: 中央社
    date: '2024-03-24'
    url: https://www.cna.com.tw/news/afe/202403240110.aspx
