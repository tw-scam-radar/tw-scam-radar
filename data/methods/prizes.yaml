- id: fake-prize
  name: 假中獎、假抽獎，要你先繳稅金或手續費才能領獎
  aliases:
  - 假中獎
  - 中獎通知詐騙
  - 假抽獎
  category: 中獎優惠
  summary: 你在社群參加抽獎，甚至根本沒參加，卻接到「中獎」通知；「專員」要你先繳稅金、手續費或核實金，或要你在網頁輸入信用卡資料才能領獎。
  status: active
  first_seen: '2024'
  channels:
  - IG
  - 臉書
  - LINE
  - LINE 群組
  - 電話
  - 簡訊
  pretend_to_be:
  - 抽獎活動客服
  - 領獎專員
  - 財政部
  stages:
  - stage: 接觸
    what_you_see: 在 IG、臉書看到抽獎或送書活動；或沒參加任何活動，卻接到電話、簡訊說你中獎。
  - stage: 取信
    what_you_see: 「專員」加你 LINE 核對身分，看起來像正式的領獎流程。
  - stage: 要求行動
    what_you_see: 說領獎前要先繳稅金、手續費或核實金；或簡訊附連結，要你選信用卡、金融卡領獎並輸入卡片資料。
  - stage: 收網後
    what_you_see: 匯款後拿不到獎品、對方失聯；有人被拉進 LINE 群組灌輸投資，損失更多；輸入卡片資料的人被盜刷。
  opener_examples:
  - 恭喜你抽中大獎，請加客服 LINE 核對身分後領獎。
  - 發票中獎通知，請點連結選擇領獎方式。
  red_flags:
  - id: pay-before-prize
    text: 領獎前要先匯款、繳稅金、手續費或核實金
    cues:
    - 繳稅金
    - 提前繳納
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 核實金
    - 領獎前先匯款
    - 銀行直接協助
    weight: 3
  - id: card-details-for-prize
    text: 領獎要輸入信用卡號、安全碼
    cues:
    - 信用卡資料
    - 安全碼
    - re:發票中獎.{0,20}(點|連結|網址|輸入|填寫|信用卡|卡號)
    - 載具歸戶異常
    weight: 3
  - id: won-without-entering
    text: 沒參加活動卻說你中獎
    cues:
    - 中獎通知
    - 抽中
    - 中獎
    weight: 1
  - id: prize-specialist-line
    text: 「專員」「客服」要你加 LINE 才能領獎
    cues:
    - 專員
    - re:(加|聯繫|聯絡|私訊).{0,6}(客服|專員|助理).{0,6}(line|賴|telegram|whatsapp)
    - re:(line|賴).{0,4}(客服|專員)
    - 加LINE
    - LINE客服
    weight: 2
  final_ask:
  - 先匯稅金、手續費或核實金才能領獎。
  - 在網頁輸入信用卡號、安全碼等資料領獎。
  verify:
  - 自己開官方網站或官方 App 查詢是否中獎，不點簡訊或信件裡的連結；政府網站網址的結尾是「.gov.tw」。
  - 撥打 165 反詐騙諮詢專線查證。
  safe_lookalikes:
  - 統一發票中獎可以自己到官方平台查；官方不會用電子郵件或簡訊要你輸入信用卡資料。
  if_already_happened:
  - 撥打 165 反詐騙專線諮詢或報案。
  prevalence:
    note: 公視 2024 年 10 月報導「中獎通知詐騙竄升」（報導未附整體數字）。
    source_url: https://news.pts.org.tw/article/720140
  sources:
