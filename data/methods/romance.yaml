- id: romance-marriage
  name: 假交友：網戀談結婚，再用聘金、安家費或急用名義要錢
  aliases:
  - 假交友（徵婚詐財）
  - 假結婚真詐財
  - 假婚姻真詐財
  - 假交友真詐財
  category: 感情交友
  summary: 網友在臉書或交友軟體認識你後很快談感情、談結婚，再用婚禮金飾、聘金、安家費、來台結婚的費用，或車禍、生病、周轉不靈等理由要你匯款、借錢、交現金；人始終見不到面。
  status: active
  first_seen: ''
  channels:
  - 臉書
  - 交友軟體
  - LINE
  pretend_to_be:
  - 外籍軍人或軍官
  - 工程師
  - 醫生
  - 機師
  - 即將移居台灣的港籍單親人士
  - 外籍配偶婚姻仲介
  stages:
  - stage: 接觸
    what_you_see: 在臉書或交友軟體被陌生網友搭訕，照片好看、自稱外籍軍官、機師、醫師或工程師；也有人是看到「快速媒合外籍配偶」的廣告，加了自稱仲介的好友。
  - stage: 取信
    what_you_see: 很快改用 LINE 聯絡，每天噓寒問暖、互稱老公老婆，認識沒多久就談結婚、生小孩、一起生活。
  - stage: 製造情境
    what_you_see: 說婚前要準備婚禮金飾或「安家費」、要來台灣結婚需要現金，或突然車禍骨折要請看護、家人生病、公司周轉不過來。
  - stage: 要求行動
    what_you_see: 要你匯款、借錢，或到銀行解定存、解保單領現金，再交給對方派來的人；仲介則要你先匯聘金和仲介費。
  - stage: 收網後
    what_you_see: 錢一筆接一筆要，對方始終沒辦法見面；有人還被要求代收、代領別人的錢，結果自己變成車手。
  opener_examples:
  - 我們都認真要結婚了，婚前先準備一筆安家費好嗎？
  - 我出車禍腿骨折，要請看護，你能先借我錢嗎？
  - 我想快點來台灣跟你結婚，現在只差一筆現金。
  - 外籍配偶快速媒合、門檻低，先付聘金和仲介費就安排。
  red_flags:
  - id: marriage-talk-fast
    text: 沒見過面、認識不久就急著談結婚、來台結婚、共組家庭
    cues:
    - re:(來台|來臺|飛來台灣|回台灣).{0,6}(結婚|娶你|嫁給你)
    - 共組家庭
    - re:(婚前|結婚前).{0,8}(準備|存|湊).{0,6}(一筆|錢|基金)
    weight: 1
  - id: wedding-money
    text: 用結婚當理由要錢：聘金、安家費、婚禮金飾、結婚共同基金
    cues:
    - re:(準備|匯|付|給|拿).{0,6}安家費
    - re:(先|要|需要|幫忙).{0,6}(匯|付|準備|出).{0,6}(聘金|仲介費|結婚基金|婚禮費用)
    - re:(結婚|婚禮).{0,8}(金飾|首飾).{0,10}(匯|錢|款|買)
    - re:(共同基金|結婚基金).{0,8}(匯|轉|存)
    weight: 3
  - id: emergency-loan
    text: 網友突然出事急需錢：車禍、骨折、要請看護、家人生病、公司周轉
    cues:
    - re:(車禍|骨折|住院|開刀|生病).{0,15}(借|匯|轉).{0,6}(錢|萬|看護費|醫藥費)
    - re:(請|聘|找).{0,2}看護.{0,12}(錢|匯|借)
    - re:(周轉|週轉).{0,6}(不過來|困難|不靈).{0,12}(借|匯)
    weight: 2
  - id: cash-for-never-met
    text: 從沒見過面，卻要你解定存、解保單、領現金，交給來拿錢的人
    cues:
    - re:(解約|解除|解掉|解).{0,2}(定存|保單)
    - re:(派|請).{0,4}(人|朋友|同事|助理).{0,6}(去|來|過去).{0,4}(拿|收|取).{0,4}(錢|現金)
    - re:(領|提).{0,4}現金.{0,10}(交給|拿給)
    weight: 3
  - id: matchmaking-fee
    text: 婚姻仲介說能「快速媒合」外籍配偶，人都沒見到就要先付聘金、仲介費
    cues:
    - 快速媒合
    - re:(外籍|越南|印尼|大陸).{0,4}(新娘|配偶|老婆).{0,15}(媒合|介紹)
    - re:(先|預).{0,4}(付|匯|繳).{0,6}(聘金|仲介費)
    weight: 3
  final_ask:
  - 匯款或借錢給對方，名目是婚禮金飾、聘金、安家費、來台結婚費用，或車禍、生病、周轉。
  - 到銀行解定存、解保單後提領現金，交給對方派來的人。
  - 先把聘金和仲介費匯給自稱婚姻仲介的人。
  verify:
  - 要求開視訊確認本人；沒見過面或交往時間短的網友一開口借錢，不管理由多合理都先停下來。
  - 撥 165 反詐騙諮詢專線或 110 查證。
  safe_lookalikes:
  - 真正交往的對象可以視訊、見面，也不會沒見過面就要你匯大筆錢；只要是「沒見過面的網友開口要錢」，就先查證。
  if_already_happened:
  - 立刻撥 165 或 110，或到附近派出所報案。
  - 不要再依對方指示提領、轉出或代收別人的錢，那可能等於幫詐團洗錢，自己反而變成車手。
