- id: romance-investment
  name: 假交友：網戀後帶你投資或玩博弈平台
  aliases:
  - 假交友投資詐財
  - 假交友（投資）詐騙
  category: 感情交友
  summary: 陌生的帥哥美女在社群或交友軟體主動搭訕、很快網戀，再邀你到他推薦的投資平台一起投資，先讓你看到小賺，想提領時卻要你補資金、付佣金，最後拖延或封鎖你。
  status: active
  first_seen: '2019'
  channels:
  - 交友軟體
  - 臉書
  - IG
  - LINE
  pretend_to_be:
  - 高顏值網友
  - 軍人
  - 醫生
  - 金融專業人士
  - 投資專家
  - 金控公司會計人員
  stages:
  - stage: 接觸
    what_you_see: 突然有高顏值、自稱醫生、軍官或投資專家的陌生人加你好友，對你特別熱情。
  - stage: 取信
    what_you_see: 每天噓寒問暖，很快發展成網戀；你要求視訊或見面時，對方總說出差中、家人生病或網路不好。
  - stage: 製造情境
    what_you_see: 聊一陣子後開始談虛擬貨幣、外幣或股票，說是穩賺不賠的機會，邀你加入投資平台或群組。
  - stage: 要求行動
    what_you_see: 先讓你小額投入，帳戶畫面顯示穩定獲利，接著鼓勵你加碼。
  - stage: 收網後
    what_you_see: 想提領時被告知帳面資金要達到某個門檻才能出金，或要先付佣金；之後對方推託、消失，甚至封鎖你。
  opener_examples:
  - 你好，我是在國外工作的醫生，很想認識你這個朋友。
  - 我最近在做虛擬貨幣，很穩定，可以帶你一起賺。
  red_flags:
  - id: stranger-elite-befriend
    text: 陌生的帥哥美女，或自稱菁英身分的網友主動加你，對你特別熱情
    cues:
    - 交個朋友
    - 在國外工作
    - 軍官
    - 投資專家
    weight: 1
  - id: avoids-video-call
    text: 一直不肯視訊、不願見面，總有理由推託
    cues:
    - 出差中
    - 網路不好
    - 家人生病
    - 不方便視訊
    weight: 2
  - id: romance-turns-to-investment
    text: 網友聊著聊著就談投資，邀你加入投資平台或群組
    cues:
    - 一起投資
    - 投資平台
    - 虛擬貨幣
    - 投資群組
    - 帶你賺
    weight: 2
  - id: guaranteed-profit
    text: 強調穩賺不賠、無風險、報酬率很高
    cues:
    - 穩賺不賠
    - 無風險
    - 零風險
    - re:高報酬.{0,6}(低風險|零風險|無風險|保證|穩)
    - 投資越多賺越多
    weight: 3
  - id: pay-to-withdraw
    text: 要提領獲利前，先要你再匯錢補足帳戶裡的金額，或付佣金
    cues:
    - 才能出金
    - 帳面資金
    - 支付佣金
    - 無法提款
    weight: 3
  final_ask:
  - 把錢投入對方推薦的投資平台，想提領時再補足帳面資金、支付佣金。
  verify:
  - 要求對方開視訊通話，確認是不是本人。
  - 來路不明的投資平台，先查是不是真的、合不合法，不要因為感情就把錢投進去。
  - 撥打 165 反詐騙諮詢專線查證。
  safe_lookalikes:
  - 真實的網友可以視訊、見面確認身分；只要「沒見過面的網友談到錢或投資」，就要先停下來查證。
  if_already_happened:
  - 撥打 165 反詐騙諮詢專線或 110，或到附近派出所報案。
  prevalence:
    note: 2025 年 10 月 165 打詐儀錶板統計，假交友投資詐財財損約 11.4 億元，財損排第二（僅次於假投資）。
    source_url: https://www.ctee.com.tw/news/20251102700518-431401
  sources:
  - title: 愛情陷阱！假交友詐騙橫行　甜言蜜語背後藏危機
    publisher: 警政署
    date: '2025-05-07'
    url: https://police.npa.gov.tw/ch/app/data/view?module=wg081&id=1835&serno=0e226547-a730-4fb2-95b0-613e77746b82
    level: L1
