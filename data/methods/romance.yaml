- id: romance-sex
  name: 假交友：援交、包養，要你先付保證金或點數
  aliases:
  - 色情應召詐騙
  - 假援交詐騙
  - 色情援交詐騙
  category: 感情交友
  summary: 用情色廣告或美女照片吸引你私下聯絡，再以會員認證、保證金、怕警察查緝等名目要你匯款或買遊戲點數，付了又說要補款、解凍，人始終不會出現。
  status: active
  first_seen: ''
  channels:
  - 交友軟體
  - LINE
  - Telegram
  - 其他
  pretend_to_be:
  - 年輕女子
  - 應召服務客服
  stages:
  - stage: 接觸
    what_you_see: 在情色廣告、交友網站或社群平台看到「快速約會」之類的廣告，或美女大頭照的網友。
  - stage: 取信
    what_you_see: 對方要你加 LINE 或 Telegram 私下聯絡，由「客服」接手說明。
  - stage: 要求行動
    what_you_see: 要你先儲值會員費，或說怕被警察查緝、要保障安全，見面前得先付保證金，常要你買遊戲點數付款。
  - stage: 收網後
    what_you_see: 付款後又說匯款出錯要補匯、約會卡要啟用、帳戶要持續補款才能提領，人從頭到尾沒出現。
  opener_examples:
  - 快速約會，加客服 LINE 幫你安排。
  - 怕被警察釣魚，見面前要先付保證金。
  red_flags:
  - id: deposit-before-meeting
    text: 見面前要先付保證金、做會員認證或信用驗證
    cues:
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 會員認證
    - 信用驗證
    - 防警察
    - 查緝
    weight: 3
  - id: pay-with-game-points
    text: 要你買遊戲點數或點數卡付款
    cues:
    - 遊戲點數
    - 點數卡
    - 序號
    - 儲值
    weight: 3
  - id: endless-top-up
    text: 付了又說匯款出錯、要補款或付解凍金才能提領
    cues:
    - 解凍金
    - 補款
    - 匯款出錯
    - 約會卡
    - 才能提領
    weight: 3
  - id: move-to-private-chat
    text: 從廣告被引導到 LINE、Telegram 私下聯絡「客服」
    cues:
    - 加LINE
    - Telegram
    - re:(加|聯繫|聯絡|私訊).{0,6}(客服|專員|助理).{0,6}(line|賴|telegram|whatsapp)
    - re:(line|賴).{0,4}(客服|專員)
    weight: 1
  final_ask:
  - 先匯會員費、保證金，或買遊戲點數把序號交給對方。
  - 以補款、解凍金、約會卡啟用等名目持續付款。
  verify:
  - 不要相信對方提供的網站內容、截圖或金流紀錄。
  - 撥打 165 反詐騙諮詢專線，或到 165 打詐儀錶板查詢防詐資訊。
  safe_lookalikes: []
  if_already_happened:
  - 撥打 165 反詐騙專線或 110 報案。
  prevalence:
    note: 依 165 打詐儀錶板統計，色情應召詐騙穩居近期受理詐騙案財損前 5 名（2026 年 6 月報導）。
    source_url: https://www.cna.com.tw/news/asoc/202606200124.aspx
