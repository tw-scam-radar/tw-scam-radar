- id: romance-parcel-fee
  name: 假交友：網戀後說寄包裹、禮物卡海關，要你付關稅或通關費
  aliases:
  - 包裹卡海關
  - 假軍官
  - 假軍醫
  category: 感情交友
  summary: 網友自稱軍官、軍醫、聯合國官員、外國將軍或富商，網戀後說要寄包裹或禮物給你，卻「卡海關」要你代墊關稅、通關費，一筆接一筆，直到被封鎖才知道受騙。
  status: active
  first_seen: '2024'
  channels:
  - 交友軟體
  - 其他
  pretend_to_be:
  - 戰地軍官
  - 軍醫
  - 聯合國官員
  - 外國將軍
  - 外籍女軍官
  - 貿易商
  stages:
  - stage: 接觸
    what_you_see: 陌生網友在社群或交友軟體加你，照片帥氣或美麗，自稱軍官、軍醫或聯合國官員。
  - stage: 取信
    what_you_see: 甜言蜜語培養感情，談到結婚和未來。
  - stage: 製造情境
    what_you_see: 說要寄包裹或禮物給你，結果包裹「卡海關」。
  - stage: 要求行動
    what_you_see: 要你代墊關稅、匯款協助通關，或說要一起存結婚基金、介紹你投資管道；有人甚至去借貸來付。
  - stage: 收網後
    what_you_see: 付了一筆又冒出下一筆費用，直到被對方封鎖才知道受騙。
  opener_examples:
  - 我是駐外的軍醫，很想認識你這樣善良的人。
  - 我寄了禮物給你，但包裹卡在海關，要先付通關費。
  red_flags:
  - id: parcel-customs-fee
    text: 包裹或禮物卡海關，要你付關稅、通關費
    cues:
    - 卡海關
    - re:(先|需|要|須|必須|得|請|再)(繳|付|支付|匯|交|儲值|補).{0,10}(保證金|手續費|稅金|稅|驗證金|解凍金|訂金|保險金|代辦費|稅費|佣金|服務費|運費|關稅)
    - re:(保證金|手續費|稅金|驗證金|解凍金|稅費|關稅).{0,12}(才能|才可|方可|後才|就能|即可)(出金|提領|領取|撥款|解凍|放款|領獎|提現|入帳|取貨|出貨)
    - 代墊關稅
    - 協助通關
    - 通關
    weight: 3
  - id: military-un-identity
    text: 網友自稱軍官、軍醫、將軍或聯合國官員
    cues:
    - 軍官
    - 軍醫
    - 聯合國
    - 將軍
    - 戰地
    weight: 2
  - id: never-met-asks-money
    text: 沒見過面的網友要你代墊或匯錢
    cues:
    - 代墊
    - 匯款
    - 結婚基金
    weight: 2
  final_ask:
  - 代墊關稅、通關費，或依指示匯款給對方。
  verify:
  - 要求開視訊確認本人身分；沒見過面的網友一開口要錢，就先停下來查證。
  - 撥打 110、165 諮詢，或到附近派出所查證。
  safe_lookalikes: []
  if_already_happened:
  - 撥打 110、165，或到附近派出所求助。
