# Cloudflare Worker 設定。部署步驟見 docs/DEPLOY.md
name = "radar-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-sonnet-5-5"
DAILY_LIMIT = "30"         # 全站每天最多幾次 AI 判讀（2026-10-23 起網頁版不公開宣傳，只給維護者自己用）
PER_CLIENT_LIMIT = "30"    # 每個來源每天最多幾次
# ALLOWED_ORIGINS（網頁的網址，多個用逗號分開）用 npx wrangler secret put ALLOWED_ORIGINS 設定，不寫在這裡

# 建立 KV 後把 id 填進來：npx wrangler kv namespace create RADAR_KV
[[kv_namespaces]]
binding = "RADAR_KV"
id = "d190091732f441e78fb32e37653c44d7"

# 機密值不要寫在這裡，用指令設定：
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put HASH_SALT
