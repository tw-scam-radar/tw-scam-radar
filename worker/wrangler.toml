# Cloudflare Worker 設定。部署步驟見 docs/DEPLOY.md
name = "radar-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-haiku-5-5"
DAILY_LIMIT = "300"        # 全站每天最多幾次 AI 判讀
PER_CLIENT_LIMIT = "5"     # 每個來源每天最多幾次
ALLOWED_ORIGINS = "https://tw-scam-radar.github.io"   # 網頁版網址（多個用逗號分開）

# 建立 KV 後把 id 填進來：npx wrangler kv namespace create RADAR_KV
[[kv_namespaces]]
binding = "RADAR_KV"
id = "d190091732f441e78fb32e37653c44d7"

# 機密值不要寫在這裡，用指令設定：
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put HASH_SALT
